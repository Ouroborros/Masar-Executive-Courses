name: Fetch pages

# Some hosts refuse the crawler's proxies and the authoring sandbox has no
# route to them, so the runner fetches a short list of pages politely
# (robots.txt read first and honoured) and commits them to the branch.

on:
  workflow_dispatch:
    inputs:
      set:
        description: folder name under import/fetched
        required: true
        default: mbsc
      urls:
        description: URLs to fetch, separated by spaces or newlines
        required: true

permissions:
  contents: write

concurrency:
  group: fetch-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: printf '%s\n' "$URLS" | python tools/fetch-pages.py "${{ github.event.inputs.set }}"
      - name: Commit results
        run: |
          git config user.name "masar-fetch[bot]"
          git config user.email "masar-fetch@users.noreply.github.com"
          git add -A import/fetched || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fetch pages (${{ github.event.inputs.set }}) on the runner"
          git push origin HEAD:${{ github.ref_name }}
