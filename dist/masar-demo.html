/* ==========================================================================
   Masar — site.css
   One stylesheet for both locales. Everything directional is written with CSS
   logical properties (inline-start/end rather than left/right), so the Arabic
   RTL layout is the same code path as the English one — no mirrored stylesheet
   to keep in sync. The handful of things logical properties cannot express
   (glyph direction, gradient angles) are collected under [dir="rtl"] at the
   bottom.
   ========================================================================== */

/* --- Tokens --------------------------------------------------------------- */
:root {
  color-scheme: light dark;

  --brand:        #0f6b57;
  --brand-strong: #0a4d3e;
  --brand-soft:   #e6f1ed;
  --accent:       #b9852b;
  --accent-soft:  #f7efdd;

  --bg:        #fbfaf7;
  --bg-alt:    #f4f2ec;
  --surface:   #ffffff;
  --text:      #16241f;
  --muted:     #5a6b65;
  --line:      #e3e0d7;
  --line-firm: #cfcabc;
  --shadow-sm: 0 1px 2px rgba(16, 32, 28, .05), 0 1px 3px rgba(16, 32, 28, .04);
  --shadow-md: 0 4px 12px rgba(16, 32, 28, .07), 0 12px 28px rgba(16, 32, 28, .06);
  --shadow-lg: 0 18px 50px rgba(16, 32, 28, .14);

  --ui:      'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'Newsreader', Georgia, 'Times New Roman', serif;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-pill: 999px;

  --container: 1220px;
  --gutter: clamp(18px, 4vw, 40px);
  --header-h: 68px;

  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: clamp(1.3rem, 1.1rem + .7vw, 1.6rem);
  --step-3: clamp(1.6rem, 1.3rem + 1.4vw, 2.3rem);
  --step-4: clamp(2.1rem, 1.5rem + 2.7vw, 3.6rem);
}

html[lang="ar"] {
  --ui:      'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, sans-serif;
  --display: 'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, sans-serif;
}

html[data-theme="dark"] {
  --brand:        #3fbb9d;
  --brand-strong: #6ad3b8;
  --brand-soft:   #12312a;
  --accent:       #e0ab52;
  --accent-soft:  #2c2415;

  --bg:        #0c1411;
  --bg-alt:    #111c18;
  --surface:   #14201c;
  --text:      #e6efec;
  --muted:     #9db0a9;
  --line:      #22322c;
  --line-firm: #33463f;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, .45);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, .55);
}

/* --- Base ----------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }

html { -webkit-text-size-adjust: 100%; scroll-padding-block-start: calc(var(--header-h) + 20px); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

body {
  font-family: var(--ui);
  font-size: var(--step-0);
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

html[lang="ar"] body { line-height: 1.85; }

img, svg, video { display: block; max-width: 100%; }
/* Components below set display:flex/grid, which would otherwise beat [hidden]. */
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; line-height: 1.15; letter-spacing: -.015em; }
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] h4 {
  line-height: 1.4; letter-spacing: 0; font-weight: 700;
}

::selection { background: var(--brand); color: #fff; }

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.section { padding-block: clamp(48px, 7vw, 88px); }
.section--tight { padding-block: clamp(32px, 4.5vw, 56px); }
.section--alt { background: var(--bg-alt); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; inset-block-start: 8px; inset-inline-start: 8px;
  z-index: 200; transform: translateY(-160%);
  background: var(--brand-strong); color: #fff;
  padding: 10px 18px; border-radius: var(--r-sm); font-weight: 600;
  transition: transform .15s ease-out;
}
.skip-link:focus { transform: translateY(0); }

/* --- Type helpers --------------------------------------------------------- */
.eyebrow {
  font-family: var(--ui);
  font-size: .75rem; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--brand);
}
html[lang="ar"] .eyebrow { letter-spacing: 0; font-size: .82rem; }

.display   { font-size: var(--step-4); }
.h2        { font-size: var(--step-3); }
.h3        { font-size: var(--step-2); }
.lede      { font-size: var(--step-1); color: var(--muted); max-width: 62ch; }
.muted     { color: var(--muted); }
.prose p + p { margin-block-start: 1em; }

.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-block-end: 32px; flex-wrap: wrap; }
.section-head p { color: var(--muted); max-width: 58ch; margin-block-start: 8px; }

/* --- Buttons -------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 22px; border-radius: var(--r-pill);
  font-weight: 700; font-size: .95rem; font-family: var(--ui);
  border: 1px solid transparent; cursor: pointer;
  transition: background-color .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
}
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--brand); color: #fff; }
.btn--primary:hover { background: var(--brand-strong); }
html[data-theme="dark"] .btn--primary { color: #06120e; }
.btn--ghost { background: transparent; color: var(--text); border-color: var(--line-firm); }
.btn--ghost:hover { border-color: var(--brand); color: var(--brand); }
.btn--quiet { background: var(--surface); color: var(--text); border-color: var(--line); box-shadow: var(--shadow-sm); }
.btn--quiet:hover { border-color: var(--brand); }
.btn--block { width: 100%; }
.btn--sm { padding: 8px 16px; font-size: .85rem; }

.link-arrow { color: var(--brand); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.link-arrow:hover { color: var(--brand-strong); }
.link-arrow .arw { transition: transform .16s ease; }
.link-arrow:hover .arw { transform: translateX(3px); }

/* --- Header --------------------------------------------------------------- */
.site-header {
  position: sticky; inset-block-start: 0; z-index: 100;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(150%) blur(12px);
  border-block-end: 1px solid var(--line);
}
.header-inner {
  display: flex; align-items: center; gap: 20px;
  min-height: var(--header-h);
}
.brand {
  display: inline-flex; align-items: center; gap: 10px;
  font-weight: 800; letter-spacing: -.02em;
  min-width: 0;   /* the lockup yields before the header overflows */
}
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name {
  font-family: var(--display); font-size: 1.32rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-name small {
  display: block; font-family: var(--ui); font-size: .58rem; font-weight: 700;
  letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-block-start: -4px;
}
html[lang="ar"] .brand-name small { letter-spacing: 0; font-size: .62rem; }

.main-nav { margin-inline-start: auto; }
.main-nav ul { display: flex; align-items: center; gap: 4px; list-style: none; padding: 0; }
.main-nav a {
  display: block; padding: 8px 13px; border-radius: var(--r-pill);
  font-size: .93rem; font-weight: 600; color: var(--muted);
  transition: color .15s ease, background-color .15s ease;
}
.main-nav a:hover { color: var(--text); background: var(--bg-alt); }
.main-nav a[aria-current="page"] { color: var(--brand); background: var(--brand-soft); }

.header-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.currency-switch { padding: 6px 10px; font-size: .78rem; }
@media (max-width: 560px) { .currency-switch { max-width: 96px; } }

/* Four controls plus the wordmark do not fit a 320px phone at full size. */
@media (max-width: 400px) {
  .header-tools { gap: 3px; }
  .lang-switch { padding-inline: 10px; }
  .icon-btn { width: 34px; height: 34px; }
}

.icon-btn {
  display: inline-grid; place-items: center;
  width: 38px; height: 38px; border-radius: var(--r-pill);
  background: transparent; border: 1px solid var(--line); cursor: pointer;
  transition: border-color .15s ease, background-color .15s ease;
}
.icon-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
.icon-btn svg { width: 18px; height: 18px; }

.lang-switch {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 15px; border-radius: var(--r-pill);
  border: 1px solid var(--line-firm); font-weight: 700; font-size: .85rem;
  transition: border-color .15s ease, color .15s ease;
}
.lang-switch:hover { border-color: var(--brand); color: var(--brand); }

.shortlist-btn { position: relative; }
.shortlist-count {
  position: absolute; inset-block-start: -4px; inset-inline-end: -4px;
  min-width: 18px; height: 18px; padding-inline: 5px;
  border-radius: var(--r-pill); background: var(--accent); color: #fff;
  font-size: .68rem; font-weight: 800; display: none; place-items: center;
}
.shortlist-count[data-has] { display: grid; }

.nav-toggle { display: none; }

@media (max-width: 1040px) {
  .nav-toggle { display: inline-grid; }
  /* Two-line brand lockup pushes the header out of shape on phones. */
  .brand-name small { display: none; }
  .main-nav {
    position: fixed; inset-block-start: var(--header-h); inset-inline: 0;
    background: var(--surface); border-block-end: 1px solid var(--line);
    box-shadow: var(--shadow-md);
    padding: 12px var(--gutter) 22px;
    display: none;
  }
  .main-nav[data-open] { display: block; }
  .main-nav ul { flex-direction: column; align-items: stretch; gap: 2px; }
  .main-nav a { padding: 13px 14px; font-size: 1rem; }
}

/* --- Hero ----------------------------------------------------------------- */
.hero {
  position: relative;
  padding-block: clamp(44px, 7vw, 92px) clamp(36px, 5vw, 64px);
  background:
    radial-gradient(120% 90% at 82% 0%, var(--brand-soft) 0%, transparent 58%),
    radial-gradient(90% 70% at 0% 100%, var(--accent-soft) 0%, transparent 55%);
}
/* The block is as wide as the search panel needs; the prose is held narrower
   so lines stay readable. Constraining the text rather than letting the panel
   break out keeps everything inside the container at every width. */
.hero-inner { max-width: 1040px; }
.hero-inner h1, .hero-inner .lede, .hero-inner .eyebrow { max-width: 820px; }
.hero h1 { font-size: var(--step-4); margin-block: 14px 18px; }
.hero .lede { font-size: clamp(1.05rem, .98rem + .4vw, 1.25rem); }

.hero-search {
  margin-block-start: 32px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  padding: 10px;
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr auto;
  gap: 8px;
  width: 100%;
}
.hero-search .field { display: flex; flex-direction: column; justify-content: center; padding: 6px 14px; border-radius: var(--r-md); }
.hero-search .field + .field { border-inline-start: 1px solid var(--line); }
.hero-search label { font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
html[lang="ar"] .hero-search label { letter-spacing: 0; font-size: .75rem; }
.hero-search input,
.hero-search select {
  border: 0; background: transparent; padding: 3px 0;
  font-size: .98rem; font-weight: 600; width: 100%;
  /* Arabic descenders get clipped at a tight line-height. */
  line-height: 1.7; height: auto;
  appearance: none;
  text-overflow: ellipsis;
}
.hero-search input:focus, .hero-search select:focus { outline: none; }
.hero-search .field:focus-within { background: var(--bg-alt); }
.hero-search .btn { align-self: stretch; }

@media (max-width: 820px) {
  .hero-search { grid-template-columns: 1fr 1fr; }
  .hero-search .field + .field { border-inline-start: 0; }
  .hero-search .field:first-child { grid-column: 1 / -1; }
  .hero-search .btn { grid-column: 1 / -1; }
}

.hero-stats { display: flex; flex-wrap: wrap; gap: 28px 44px; margin-block-start: 34px; }
.hero-stat .n { font-family: var(--display); font-size: 1.7rem; font-weight: 700; line-height: 1; }
html[lang="ar"] .hero-stat .n { font-size: 1.55rem; }
.hero-stat .l { font-size: .84rem; color: var(--muted); margin-block-start: 4px; }

/* --- Subject tiles -------------------------------------------------------- */
.subject-grid {
  display: grid; gap: 12px;
  /* min() so the track floor collapses on screens narrower than the floor
     itself — a bare minmax(232px, 1fr) overflows a 320px phone. */
  grid-template-columns: repeat(auto-fill, minmax(min(232px, 100%), 1fr));
}
.subject-tile {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  font-weight: 600;
  transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.subject-tile:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.subject-tile .n { font-size: .8rem; color: var(--muted); font-weight: 700; flex: none; }

/* --- Cards ---------------------------------------------------------------- */
.card-grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(min(310px, 100%), 1fr));
}

.course-card {
  position: relative;
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px 20px 16px;
  transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
}
.course-card:hover { border-color: var(--line-firm); transform: translateY(-3px); box-shadow: var(--shadow-md); }
.course-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
/* Sits above the stretched title link so it stays clickable. */
.course-card__school { position: relative; z-index: 1; font-size: .82rem; font-weight: 700; color: var(--brand); }
.course-card__school:hover { text-decoration: underline; }
.course-card__place { font-size: .82rem; color: var(--muted); }
.course-card h3 { font-size: 1.16rem; margin-block: 10px 8px; }
html[lang="ar"] .course-card h3 { font-size: 1.1rem; }
.course-card h3 a::after { content: ''; position: absolute; inset: 0; border-radius: inherit; }
.course-card__summary { font-size: .92rem; color: var(--muted); flex: 1; }
.course-card__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: 14px; }
.course-card__foot {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin-block-start: 14px; padding-block-start: 14px; border-block-start: 1px solid var(--line);
}
.course-card__price { font-family: var(--display); font-size: 1.16rem; font-weight: 700; }
html[lang="ar"] .course-card__price { font-family: var(--ui); font-size: 1.05rem; }
.course-card__price small { font-family: var(--ui); font-size: .72rem; font-weight: 700; color: var(--muted); display: block; letter-spacing: .04em; }
.course-card__date { font-size: .85rem; color: var(--muted); text-align: end; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px; border-radius: var(--r-pill);
  background: var(--bg-alt); border: 1px solid var(--line);
  font-size: .76rem; font-weight: 700; color: var(--muted);
  white-space: nowrap;
}
.pill--brand { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
.pill--accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

.rating { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; font-weight: 700; }
.rating .stars { color: var(--accent); letter-spacing: .06em; }
.rating .count { color: var(--muted); font-weight: 500; }

.save-btn {
  position: relative; z-index: 1;
  display: inline-grid; place-items: center; flex: none;
  width: 32px; height: 32px; border-radius: var(--r-pill);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  color: var(--muted);
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.save-btn:hover { color: var(--accent); border-color: var(--accent); }
.save-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.save-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.save-btn[aria-pressed="true"] svg { fill: currentColor; }

/* School + collection cards */
.school-card {
  position: relative;
  display: flex; flex-direction: column; gap: 8px;
  padding: 22px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-lg);
  transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
}
.school-card:hover { border-color: var(--brand); transform: translateY(-3px); box-shadow: var(--shadow-md); }
.school-card h3 { font-size: 1.12rem; }
.school-card h3 a::after { content: ''; position: absolute; inset: 0; }
.school-card__place { font-size: .86rem; color: var(--muted); }
.school-card__foot { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: auto; padding-block-start: 14px; }

.list-card {
  position: relative; display: flex; flex-direction: column; gap: 10px;
  padding: 26px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line);
  transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
}
.list-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow-md); }
.list-card h3 { font-size: 1.24rem; }
.list-card h3 a::after { content: ''; position: absolute; inset: 0; }
.list-card p { color: var(--muted); font-size: .93rem; }
.list-card__n { font-size: .8rem; font-weight: 700; color: var(--accent); }

/* --- Catalogue layout ----------------------------------------------------- */
.catalogue { display: grid; grid-template-columns: 290px 1fr; gap: 34px; align-items: start; }
@media (max-width: 900px) { .catalogue { grid-template-columns: 1fr; gap: 18px; } }

.filters {
  position: sticky; inset-block-start: calc(var(--header-h) + 18px);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 20px;
  max-height: calc(100vh - var(--header-h) - 40px); overflow-y: auto;
}
.filters h2 { font-size: 1.05rem; }
.filters__head { display: flex; align-items: center; justify-content: space-between; margin-block-end: 8px; }
/* Groups are <fieldset>s — drop the UA border, keep only the divider rule. */
.filter-group { border: 0; padding-block: 16px; border-block-start: 1px solid var(--line); }
.filter-group:first-of-type { border-block-start: 0; padding-block-start: 6px; }
.filter-group > legend, .filter-group > h3 {
  font-family: var(--ui); font-size: .74rem; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  margin-block-end: 10px; padding: 0;
}
html[lang="ar"] .filter-group > legend, html[lang="ar"] .filter-group > h3 { letter-spacing: 0; font-size: .82rem; }
.filter-group fieldset { border: 0; padding: 0; margin: 0; }

/* Long facet labels wrap, so align to the first line rather than the block. */
.check {
  display: flex; align-items: flex-start; gap: 9px;
  padding-block: 6px; font-size: .87rem; line-height: 1.4; cursor: pointer;
}
html[lang="ar"] .check { line-height: 1.6; }
.check input {
  accent-color: var(--brand); width: 16px; height: 16px;
  flex: none; cursor: pointer; margin-block-start: 2px;
}
.check span { flex: 1; }
.check .n { flex: none; color: var(--muted); font-size: .76rem; font-weight: 700; }
.check:hover span { color: var(--brand); }

.range-row { display: flex; align-items: center; justify-content: space-between; font-size: .85rem; font-weight: 700; margin-block-end: 6px; }
input[type="range"] { width: 100%; accent-color: var(--brand); }

/* The "Done" / "Show results" controls only mean something in the mobile
   full-screen filter sheet. */
.filters-toggle,
.filters [data-filters-close],
.filters__done { display: none; }

@media (max-width: 900px) {
  .filters [data-filters-close] { display: inline-flex; }
  .filters__done { display: inline-flex; }
  .filters {
    position: fixed; inset: 0; z-index: 150; border-radius: 0; border: 0;
    max-height: none; overflow-y: auto; padding: 20px var(--gutter) 90px;
    display: none;
  }
  .filters[data-open] { display: block; }
  .filters__done { position: fixed; inset-inline: var(--gutter); inset-block-end: 18px; }
  .filters-toggle { display: inline-flex; }
}

.results-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  flex-wrap: wrap; margin-block-end: 18px;
}
.results-count { font-weight: 700; }
.results-tools { display: flex; align-items: center; gap: 10px; }
.select {
  padding: 9px 14px; border-radius: var(--r-pill);
  border: 1px solid var(--line-firm); background: var(--surface);
  font-size: .88rem; font-weight: 700; cursor: pointer;
}

.active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-block-end: 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 8px 5px 13px; border-radius: var(--r-pill);
  background: var(--brand-soft); color: var(--brand);
  font-size: .8rem; font-weight: 700; border: 0; cursor: pointer;
}
html[dir="rtl"] .chip { padding: 5px 13px 5px 8px; }
.chip:hover { background: var(--brand); color: #fff; }
.chip .x { font-size: 1rem; line-height: 1; }

.empty-state {
  text-align: center; padding: 60px 20px;
  border: 1px dashed var(--line-firm); border-radius: var(--r-lg);
}
.empty-state h3 { font-size: 1.3rem; margin-block-end: 8px; }
.empty-state p { color: var(--muted); margin-block-end: 18px; }

/* --- Detail pages --------------------------------------------------------- */
.breadcrumbs { font-size: .85rem; color: var(--muted); padding-block: 18px 0; }
.breadcrumbs ol { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; }
.breadcrumbs li::after { content: '/'; margin-inline-start: 8px; color: var(--line-firm); }
.breadcrumbs li:last-child::after { content: none; }
.breadcrumbs a:hover { color: var(--brand); }

.detail { display: grid; grid-template-columns: 1fr 348px; gap: 42px; align-items: start; }
@media (max-width: 940px) { .detail { grid-template-columns: 1fr; gap: 28px; } }

.detail-head { padding-block: 26px 30px; }
.detail-head h1 { font-size: var(--step-3); margin-block: 12px 14px; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 16px; }

.detail-body h2 { font-size: 1.4rem; margin-block: 34px 12px; }
.detail-body h2:first-child { margin-block-start: 0; }
.detail-body p { color: var(--muted); }
.detail-body ul.ticks { list-style: none; padding: 0; display: grid; gap: 10px; }
.detail-body ul.ticks li { display: flex; gap: 11px; align-items: flex-start; }
.detail-body ul.ticks li::before {
  content: ''; flex: none; margin-block-start: 7px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--brand);
}

.booking-card {
  position: sticky; inset-block-start: calc(var(--header-h) + 18px);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-md);
}
.booking-card .price { font-family: var(--display); font-size: 2rem; font-weight: 700; line-height: 1; }
html[lang="ar"] .booking-card .price { font-family: var(--ui); font-size: 1.7rem; }
.booking-card .price-note { font-size: .8rem; color: var(--muted); margin-block-start: 6px; }
.fact-list { list-style: none; padding: 0; margin-block: 20px; display: grid; gap: 12px; }
.fact-list li { display: flex; justify-content: space-between; gap: 14px; font-size: .9rem; padding-block-end: 12px; border-block-end: 1px solid var(--line); }
.fact-list li:last-child { border-block-end: 0; padding-block-end: 0; }
.fact-list dt, .fact-list .k { color: var(--muted); }
.fact-list .v { font-weight: 700; text-align: end; }

.school-strip {
  display: flex; gap: 16px; align-items: center;
  padding: 20px; border-radius: var(--r-lg);
  background: var(--bg-alt); border: 1px solid var(--line);
  margin-block-start: 34px; flex-wrap: wrap;
}
.school-strip__body { flex: 1; min-width: 200px; }
.school-strip h3 { font-size: 1.08rem; }
.school-strip p { font-size: .88rem; color: var(--muted); margin-block-start: 4px; }

/* --- Shortlist drawer ----------------------------------------------------- */
.drawer-backdrop {
  position: fixed; inset: 0; z-index: 180;
  background: rgba(10, 20, 17, .45);
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.drawer-backdrop[data-open] { opacity: 1; pointer-events: auto; }

.drawer {
  /* The off-screen direction differs per writing mode, but it is carried on a
     custom property rather than a second transform rule: an
     html[dir="rtl"] .drawer rule outscores .drawer[data-open] and would pin
     the panel off-screen in Arabic no matter what the open state said. */
  --drawer-closed: translateX(100%);
  position: fixed; z-index: 190;
  inset-block: 0; inset-inline-end: 0;
  width: min(420px, 100%);
  background: var(--surface); border-inline-start: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
  transform: var(--drawer-closed);
  visibility: hidden;
  transition: transform .24s cubic-bezier(.32, .72, 0, 1), visibility 0s linear .24s;
}
html[dir="rtl"] .drawer { --drawer-closed: translateX(-100%); }
.drawer[data-open] {
  transform: translateX(0);
  /* visibility:hidden while closed keeps the panel's controls out of the tab
     order; inert (set in app.js) does the same for browsers that have it. */
  visibility: visible;
  transition-delay: 0s;
}
.drawer__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px; border-block-end: 1px solid var(--line); }
.drawer__body { flex: 1; overflow-y: auto; padding: 16px 20px; }
.drawer__foot { padding: 16px 20px; border-block-start: 1px solid var(--line); }
.drawer-item { display: flex; gap: 12px; padding-block: 14px; border-block-end: 1px solid var(--line); }
.drawer-item:last-child { border-block-end: 0; }
.drawer-item__body { flex: 1; }
.drawer-item h4 { font-size: .98rem; font-family: var(--ui); font-weight: 700; }
.drawer-item p { font-size: .82rem; color: var(--muted); }
.drawer-item button { background: none; border: 0; color: var(--muted); font-size: .8rem; font-weight: 700; cursor: pointer; padding: 0; }
.drawer-item button:hover { color: #c0392b; }

@media (prefers-reduced-motion: reduce) {
  .drawer, .drawer-backdrop, .course-card, .school-card, .list-card, .subject-tile, .btn { transition: none; }
}

/* --- Editorial blocks ----------------------------------------------------- */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 5vw, 64px); align-items: center; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }

.quote {
  border-inline-start: 3px solid var(--accent);
  padding-inline-start: 22px;
  font-family: var(--display); font-size: 1.24rem; line-height: 1.5;
}
html[lang="ar"] .quote { font-size: 1.12rem; }
.quote footer { font-family: var(--ui); font-size: .86rem; color: var(--muted); margin-block-start: 10px; font-weight: 600; }

.step-list { list-style: none; padding: 0; display: grid; gap: 20px; counter-reset: step; }
.step-list li { display: flex; gap: 16px; }
.step-list li::before {
  counter-increment: step; content: counter(step);
  flex: none; width: 34px; height: 34px; border-radius: var(--r-pill);
  display: grid; place-items: center;
  background: var(--brand-soft); color: var(--brand);
  font-weight: 800; font-size: .9rem;
}
.step-list h3 { font-size: 1.05rem; font-family: var(--ui); font-weight: 700; margin-block-end: 3px; }
.step-list p { color: var(--muted); font-size: .92rem; }

.notice {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 18px; border-radius: var(--r-md);
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  font-size: .88rem;
}
.notice strong { display: block; }

/* --- Forms ---------------------------------------------------------------- */
.form-grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
/* Grid and flex children default to min-width:auto, so one wide item — the
   course <select>, whose longest option is ~700px — can force the whole page
   wider than the viewport. Let them shrink. */
.form-grid > *, .split > *, .catalogue > *, .field-block > * { min-width: 0; }
.field-block select { max-width: 100%; text-overflow: ellipsis; }
.field-block { display: flex; flex-direction: column; gap: 6px; }
.field-block--wide { grid-column: 1 / -1; }
.field-block label { font-size: .85rem; font-weight: 700; }
.field-block input, .field-block select, .field-block textarea {
  padding: 12px 14px; border-radius: var(--r-md);
  border: 1px solid var(--line-firm); background: var(--surface);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.field-block input:focus, .field-block select:focus, .field-block textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent);
}
.field-block textarea { min-height: 130px; resize: vertical; }
.form-note { font-size: .82rem; color: var(--muted); }

/* --- Footer --------------------------------------------------------------- */
.site-footer {
  margin-block-start: clamp(48px, 7vw, 90px);
  background: var(--bg-alt);
  border-block-start: 1px solid var(--line);
  padding-block: 52px 28px;
}
.footer-grid { display: grid; grid-template-columns: 1.6fr repeat(3, 1fr); gap: 34px; }
@media (max-width: 860px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .footer-grid { grid-template-columns: 1fr; } }
.footer-grid h3 { font-family: var(--ui); font-size: .76rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-block-end: 14px; }
html[lang="ar"] .footer-grid h3 { letter-spacing: 0; font-size: .84rem; }
.footer-grid ul { list-style: none; padding: 0; display: grid; gap: 9px; font-size: .92rem; }
.footer-grid a:hover { color: var(--brand); }
.footer-blurb { color: var(--muted); font-size: .92rem; max-width: 34ch; margin-block-start: 12px; }
.footer-bottom {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between;
  margin-block-start: 40px; padding-block-start: 20px;
  border-block-start: 1px solid var(--line);
  font-size: .84rem; color: var(--muted);
}

/* --- RTL touch-ups -------------------------------------------------------- */
/* Logical properties handle layout; these are the glyph-level exceptions. */
html[dir="rtl"] .link-arrow .arw { transform: scaleX(-1); }
html[dir="rtl"] .link-arrow:hover .arw { transform: scaleX(-1) translateX(3px); }
html[dir="rtl"] .hero {
  background:
    radial-gradient(120% 90% at 18% 0%, var(--brand-soft) 0%, transparent 58%),
    radial-gradient(90% 70% at 100% 100%, var(--accent-soft) 0%, transparent 55%);
}
/* Latin fragments inside Arabic text (prices, dates, acronyms) keep their own
   direction so "AACSB" and "$24,500" do not scramble at line boundaries. */
html[dir="rtl"] .course-card__price,
html[dir="rtl"] .booking-card .price,
html[dir="rtl"] .hero-stat .n,
html[dir="rtl"] .pill--ltr { direction: ltr; unicode-bidi: isolate; text-align: start; }


/* Demo-only: the host page supplies the document chrome, so give the bundle
   the same page background the real site sets on <html>. */
html { background: var(--bg); }
</style>

<script>
  /* Locale and theme are decided before anything renders: i18n.js reads
     <html lang> at load, and a late theme switch would flash the page. */
  (function () {
    var lang = 'en', theme = null;
    try {
      lang = localStorage.getItem('masar:lang') === 'ar' ? 'ar' : 'en';

at\"><div class=\"n\" data-stat=\"countries\">—<\/div><div class=\"l\">دولة<\/div><\/div>\n          <div class=\"hero-stat\"><div class=\"n\" data-stat=\"subjects\">—<\/div><div class=\"l\">مجالًا تخصّصيًا<\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">مختارات<\/span>\n            <h2 class=\"h2\">برامج تستحق نظرة ثانية<\/h2>\n            <p>اختارها فريق التحرير لعمق محتواها وجودة تدريسها — لا مقابل رسوم إدراج.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"courses.html\">كل البرامج <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-featured><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--alt\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">حسب التخصّص<\/span>\n            <h2 class=\"h2\">ابدأ ممّا تحتاج إلى تعلّمه<\/h2>\n          <\/div>\n        <\/div>\n        <div class=\"subject-grid\" data-home-subjects><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">تبدأ قريبًا<\/span>\n            <h2 class=\"h2\">أقرب الدفعات<\/h2>\n            <p>مرتّبة حسب تاريخ البدء، لتعرف ما الذي ما زال بإمكانك اللحاق به.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"courses.html?sort=date\">استعرض المواعيد <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-upcoming><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--alt\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">مجموعات<\/span>\n            <h2 class=\"h2\">اختيارات فريق التحرير<\/h2>\n            <p>مجمّعة حسب السؤال الذي يأتي به الزائر فعلًا، لا حسب الترتيب الأبجدي.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"lists.html\">كل المجموعات <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-lists><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container split\">\n        <div>\n          <span class=\"eyebrow\">كيف يعمل «مسار»<\/span>\n          <h2 class=\"h2\">دليل لا يبيعك لأحد.<\/h2>\n          <p class=\"lede\" style=\"margin-block-start:14px\">معظم أدلّة البرامج التدريبية هي في حقيقتها\n            شركات لجمع بيانات العملاء المحتملين ترتدي ثوبًا تحريريًا. هذا الموقع بُني على العكس تمامًا.<\/p>\n          <blockquote class=\"quote\" style=\"margin-block-start:26px\">\n            وجود أي برنامج هنا سببه أنه يستحق مكانه في الدليل — لا أن أحدًا دفع مقابل هذا الموضع.\n            <footer>— سياسة التحرير في جملة واحدة<\/footer>\n          <\/blockquote>\n        <\/div>\n        <ol class=\"step-list\">\n          <li>\n            <div>\n              <h3>ابحث بلا حساب<\/h3>\n              <p>كل أدوات التصفية وكل البرامج وكل الرسوم ظاهرة دون تسجيل أي بيانات.<\/p>\n            <\/div>\n          <\/li>\n          <li>\n            <div>\n              <h3>قارن بما يهمّ فعلًا<\/h3>\n              <p>الرسوم وعدد الأيام ونمط الدراسة ولغة التدريس وتاريخ البدء — في كل بطاقة،\n                 وفي الموضع نفسه، لتصبح المقارنة مسألة ثوانٍ.<\/p>\n            <\/div>\n          <\/li>\n          <li>\n            <div>\n              <h3>احفظ قائمتك المختارة<\/h3>\n              <p>اجمع ما يعجبك في قائمة واحدة أثناء التصفّح. تبقى القائمة في متصفّحك وحده، ولا نطّلع عليها.<\/p>\n            <\/div>\n          <\/li>\n          <li>\n            <div>\n              <h3>تواصل مع الكلية مباشرة<\/h3>\n              <p>تذهب استفساراتك إلى الجهة التي تقدّم البرنامج، ولا يُعاد بيع بياناتك لأي طرف.<\/p>\n            <\/div>\n          <\/li>\n        <\/ol>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--alt\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">المؤسسات<\/span>\n            <h2 class=\"h2\">الكليات المدرجة في الدليل<\/h2>\n          <\/div>\n          <a class=\"link-arrow\" href=\"schools.html\">كل الكليات <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"subject-grid\" data-home-schools><\/div>\n      <\/div>\n    <\/section>\n  "}, "courses.html": {"en": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">The index<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">Executive courses<\/h1>\n        <p class=\"lede\">Every programme in the index, with the fee, the number of teaching days and the\n          language of instruction on the card. Filters update the address bar, so a filtered view is a\n          link you can send to someone.<\/p>\n\n        <form role=\"search\" style=\"margin-block-start:24px;max-width:560px\">\n          <label class=\"sr-only\" for=\"cat-q\">Search courses<\/label>\n          <input id=\"cat-q\" type=\"search\" data-catalogue-search placeholder=\"Course, subject or school\"\n                 style=\"width:100%;padding:14px 18px;border-radius:999px;border:1px solid var(--line-firm);background:var(--surface)\">\n        <\/form>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\" style=\"padding-block-start:8px\">\n      <div class=\"container catalogue\">\n        <aside class=\"filters\" data-filters aria-label=\"Filters\">\n          <div class=\"filters__head\">\n            <h2>Refine<\/h2>\n            <button class=\"btn btn--sm btn--ghost\" type=\"button\" data-filters-close>Done<\/button>\n          <\/div>\n          <div data-filter-body><\/div>\n          <button class=\"btn btn--primary btn--block filters__done\" type=\"button\" data-filters-close>Show results<\/button>\n        <\/aside>\n\n        <div>\n          <div class=\"results-bar\">\n            <p class=\"results-count\" data-results-count aria-live=\"polite\">—<\/p>\n            <div class=\"results-tools\">\n              <button class=\"btn btn--ghost btn--sm filters-toggle\" type=\"button\" data-filters-open>Filters<\/button>\n              <label class=\"sr-only\" for=\"sort\">Sort by<\/label>\n              <select class=\"select\" id=\"sort\" data-sort>\n                <option value=\"date\">Starting soonest<\/option>\n                <option value=\"popular\">Most popular<\/option>\n                <option value=\"rating\">Highest rated<\/option>\n                <option value=\"priceAsc\">Fee: low to high<\/option>\n                <option value=\"priceDesc\">Fee: high to low<\/option>\n              <\/select>\n            <\/div>\n          <\/div>\n          <div class=\"active-filters\" data-active-filters><\/div>\n          <div class=\"card-grid\" data-results><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">الدليل<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">البرامج التنفيذية<\/h1>\n        <p class=\"lede\">كل برنامج في الدليل، وأمامه الرسوم وعدد أيام التدريس ولغة التدريس على البطاقة نفسها.\n          تُحدِّث أدوات التصفية عنوان الصفحة، فتصبح أي نتيجة مصفّاة رابطًا يمكنك إرساله إلى غيرك.<\/p>\n\n        <form role=\"search\" style=\"margin-block-start:24px;max-width:560px\">\n          <label class=\"sr-only\" for=\"cat-q\">ابحث في البرامج<\/label>\n          <input id=\"cat-q\" type=\"search\" data-catalogue-search placeholder=\"برنامج أو تخصّص أو كلية\"\n                 style=\"width:100%;padding:14px 18px;border-radius:999px;border:1px solid var(--line-firm);background:var(--surface)\">\n        <\/form>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\" style=\"padding-block-start:8px\">\n      <div class=\"container catalogue\">\n        <aside class=\"filters\" data-filters aria-label=\"أدوات التصفية\">\n          <div class=\"filters__head\">\n            <h2>تصفية النتائج<\/h2>\n            <button class=\"btn btn--sm btn--ghost\" type=\"button\" data-filters-close>تم<\/button>\n          <\/div>\n          <div data-filter-body><\/div>\n          <button class=\"btn btn--primary btn--block filters__done\" type=\"button\" data-filters-close>اعرض النتائج<\/button>\n        <\/aside>\n\n        <div>\n          <div class=\"results-bar\">\n            <p class=\"results-count\" data-results-count aria-live=\"polite\">—<\/p>\n            <div class=\"results-tools\">\n              <button class=\"btn btn--ghost btn--sm filters-toggle\" type=\"button\" data-filters-open>التصفية<\/button>\n              <label class=\"sr-only\" for=\"sort\">ترتيب النتائج<\/label>\n              <select class=\"select\" id=\"sort\" data-sort>\n                <option value=\"date\">الأقرب بدءًا<\/option>\n                <option value=\"popular\">الأكثر رواجًا<\/option>\n                <option value=\"rating\">الأعلى تقييمًا<\/option>\n                <option value=\"priceAsc\">الرسوم: من الأقل<\/option>\n                <option value=\"priceDesc\">الرسوم: من الأعلى<\/option>\n              <\/select>\n            <\/div>\n          <\/div>\n          <div class=\"active-filters\" data-active-filters><\/div>\n          <div class=\"card-grid\" data-results><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  "}, "course.html": {"en": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <ol>\n          <li><a href=\"index.html\">Home<\/a><\/li>\n          <li><a href=\"courses.html\">Courses<\/a><\/li>\n          <li aria-current=\"page\" data-course-crumb>Course<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <div class=\"container\" data-course-detail><\/div>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\"><h2 class=\"h2\">Similar programmes<\/h2><\/div>\n        <div class=\"card-grid\" data-similar><\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"مسار التنقّل\">\n        <ol>\n          <li><a href=\"index.html\">الرئيسية<\/a><\/li>\n          <li><a href=\"courses.html\">البرامج<\/a><\/li>\n          <li aria-current=\"page\" data-course-crumb>البرنامج<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <div class=\"container\" data-course-detail><\/div>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\"><h2 class=\"h2\">برامج مشابهة<\/h2><\/div>\n        <div class=\"card-grid\" data-similar><\/div>\n      <\/div>\n    <\/section>\n  "}, "schools.html": {"en": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">Institutions<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">Business schools<\/h1>\n        <p class=\"lede\">Every school with programmes in the index, with what it is actually known for —\n          not a paragraph of marketing copy.<\/p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-block-start:22px\" data-region-filter><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-schools><\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">المؤسسات<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">كليات إدارة الأعمال<\/h1>\n        <p class=\"lede\">كل كلية لها برامج في الدليل، ومعها ما تشتهر به فعلًا — لا فقرة من العبارات التسويقية.<\/p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-block-start:22px\" data-region-filter><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-schools><\/div>\n      <\/div>\n    <\/section>\n  "}, "school.html": {"en": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <ol>\n          <li><a href=\"index.html\">Home<\/a><\/li>\n          <li><a href=\"schools.html\">Schools<\/a><\/li>\n          <li aria-current=\"page\" data-school-crumb>School<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-school-detail><\/div>\n    <\/section>\n  ", "ar": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"مسار التنقّل\">\n        <ol>\n          <li><a href=\"index.html\">الرئيسية<\/a><\/li>\n          <li><a href=\"schools.html\">الكليات<\/a><\/li>\n          <li aria-current=\"page\" data-school-crumb>الكلية<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-school-detail><\/div>\n    <\/section>\n  "}, "lists.html": {"en": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">Collections<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">Editors' shortlists<\/h1>\n        <p class=\"lede\">Nine questions people arrive with, each answered with a handful of programmes.\n          These are editorial selections, not a ranking — nobody scored anything out of a hundred.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-lists><\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">مجموعات<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">اختيارات فريق التحرير<\/h1>\n        <p class=\"lede\">تسعة أسئلة يأتي بها الزوّار عادةً، يجيب عن كلٍّ منها عدد محدود من البرامج.\n          هذه اختيارات تحريرية لا تصنيفات — لم يُمنح أي برنامج درجة من مئة.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-lists><\/div>\n      <\/div>\n    <\/section>\n  "}, "list.html": {"en": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <ol>\n          <li><a href=\"index.html\">Home<\/a><\/li>\n          <li><a href=\"lists.html\">Collections<\/a><\/li>\n          <li aria-current=\"page\" data-list-crumb>Collection<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-list-detail><\/div>\n    <\/section>\n  ", "ar": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"مسار التنقّل\">\n        <ol>\n          <li><a href=\"index.html\">الرئيسية<\/a><\/li>\n          <li><a href=\"lists.html\">المجموعات<\/a><\/li>\n          <li aria-current=\"page\" data-list-crumb>المجموعة<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-list-detail><\/div>\n    <\/section>\n  "}, "about.html": {"en": "\n\n    <section class=\"section\">\n      <div class=\"container\" style=\"max-width:760px\">\n        <span class=\"eyebrow\">About<\/span>\n        <h1 class=\"display\" style=\"margin-block:12px 18px\">A course directory built the honest way round.<\/h1>\n        <p class=\"lede\">Masar started from a simple annoyance: searching for an executive programme means\n          wading through directories that rank whoever paid the most, hide the fee until you hand over a\n          phone number, and have no Arabic version worth the name.<\/p>\n\n        <div class=\"prose\" style=\"margin-block-start:32px\">\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">What this site does<\/h2>\n          <p class=\"muted\">It indexes executive programmes and lets you filter them on the things that\n            decide the choice: subject, region, format, language of instruction, length and fee. Everything\n            is visible without an account, and a filtered result is a shareable link.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">How listings are chosen<\/h2>\n          <p class=\"muted\">Editorially. Position in a list or a collection is never for sale, and there is\n            no paid placement tier. The collections are labelled as editorial selections rather than\n            rankings, because assigning a score out of a hundred to a four-day negotiation course would be\n            an invention.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">Arabic, properly<\/h2>\n          <p class=\"muted\">The Arabic site is not the English site run through a translation API. It is\n            written copy, a right-to-left layout built from the same stylesheet, Arabic plural forms for\n            counts, and localised dates and numbers. Both languages read from one catalogue, so a course\n            can never exist in one language and quietly disappear in the other.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">Privacy<\/h2>\n          <p class=\"muted\">There is no tracking script on this site and no analytics. Your shortlist is\n            stored in your own browser's local storage and never leaves the device. Enquiries go to the\n            school running the programme.<\/p>\n\n          <div class=\"notice\" style=\"margin-block-start:32px\">\n            <div>\n              <strong>This is a portfolio project.<\/strong>\n              The schools, programmes, dates, fees and reviews on this site are invented sample data,\n              written to demonstrate the interface. No real institution is described here, and nothing on\n              the site should be treated as a real course offering.\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div style=\"margin-block-start:34px;display:flex;gap:12px;flex-wrap:wrap\">\n          <a class=\"btn btn--primary\" href=\"courses.html\">Browse the index<\/a>\n          <a class=\"btn btn--ghost\" href=\"contact.html\">Get in touch<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section\">\n      <div class=\"container\" style=\"max-width:760px\">\n        <span class=\"eyebrow\">عن مسار<\/span>\n        <h1 class=\"display\" style=\"margin-block:12px 18px\">دليل برامج مبني بالطريقة الصادقة.<\/h1>\n        <p class=\"lede\">بدأ «مسار» من انزعاج بسيط: البحث عن برنامج تنفيذي يعني التنقّل بين أدلّة تُصدِّر\n          من يدفع أكثر، وتُخفي الرسوم حتى تترك رقم هاتفك، وليس لها نسخة عربية تستحق هذا الاسم.<\/p>\n\n        <div class=\"prose\" style=\"margin-block-start:32px\">\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">ماذا يفعل هذا الموقع<\/h2>\n          <p class=\"muted\">يفهرس البرامج التنفيذية ويتيح تصفيتها وفق ما يحسم القرار فعلًا: التخصّص والمنطقة\n            ونمط الدراسة ولغة التدريس والمدّة والرسوم. كل شيء ظاهر دون حساب، وأي نتيجة مصفّاة رابط قابل للمشاركة.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">كيف تُختار البرامج<\/h2>\n          <p class=\"muted\">تحريريًا. الموضع في أي قائمة أو مجموعة غير معروض للبيع، ولا توجد فئة إدراج مدفوعة.\n            وقد وُصفت المجموعات بأنها اختيارات تحريرية لا تصنيفات، لأن منح برنامج تفاوض مدّته أربعة أيام درجةً\n            من مئة سيكون محض اختلاق.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">العربية كما ينبغي<\/h2>\n          <p class=\"muted\">النسخة العربية ليست ترجمة آلية للنسخة الإنجليزية. هي نصوص مكتوبة، وتخطيط من اليمين\n            إلى اليسار مبني من ملف التنسيق نفسه، وصيغ جمع عربية صحيحة للأعداد، وتواريخ وأرقام موطّنة.\n            وتقرأ اللغتان من دليل واحد، فلا يمكن أن يوجد برنامج بلغة ويختفي بهدوء في الأخرى.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">الخصوصية<\/h2>\n          <p class=\"muted\">لا يوجد في هذا الموقع أي برنامج تتبّع أو تحليلات. تُحفظ قائمتك المختارة في التخزين\n            المحلي لمتصفّحك ولا تغادر جهازك. وتذهب الاستفسارات إلى الكلية التي تقدّم البرنامج.<\/p>\n\n          <div class=\"notice\" style=\"margin-block-start:32px\">\n            <div>\n              <strong>هذا مشروع شخصي لعرض العمل.<\/strong>\n              الكليات والبرامج والتواريخ والرسوم والتقييمات في هذا الموقع بيانات تجريبية مُختلقة،\n              كُتبت لعرض الواجهة فحسب. لا يصف الموقع أي مؤسسة حقيقية، ولا ينبغي التعامل مع أي محتوى فيه\n              على أنه عرض تدريبي فعلي.\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div style=\"margin-block-start:34px;display:flex;gap:12px;flex-wrap:wrap\">\n          <a class=\"btn btn--primary\" href=\"courses.html\">تصفّح الدليل<\/a>\n          <a class=\"btn btn--ghost\" href=\"contact.html\">تواصل معنا<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n  "}, "contact.html": {"en": "\n\n    <section class=\"section\">\n      <div class=\"container split\" style=\"align-items:start\">\n        <div>\n          <span class=\"eyebrow\">Contact<\/span>\n          <h1 class=\"h2\" style=\"margin-block:12px 16px\">Ask about a programme<\/h1>\n          <p class=\"lede\">Tell us which course you are considering and what you need to know. Enquiries are\n            passed to the school running the programme — your details are not sold to anyone else.<\/p>\n\n          <div class=\"notice\" style=\"margin-block-start:26px\">\n            <div>\n              <strong>Demo form.<\/strong>\n              This is a portfolio project with no backend attached, so nothing is transmitted or stored\n              when you submit. Wire it to a form endpoint before using it for real.\n            <\/div>\n          <\/div>\n\n          <h2 class=\"h3\" style=\"margin-block:34px 12px\">Listing a course<\/h2>\n          <p class=\"muted\">Schools can suggest a programme for the index at no cost. Inclusion is an\n            editorial decision and position is never for sale.<\/p>\n        <\/div>\n\n        <form class=\"form-grid\" data-contact-form novalidate\n              style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px\">\n          <div class=\"field-block\">\n            <label for=\"name\">Your name<\/label>\n            <input id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\" required>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"email\">Email<\/label>\n            <input id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <label for=\"course\">Course you are asking about<\/label>\n            <select id=\"course\" name=\"course\" data-course-select><\/select>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <label for=\"message\">Your question<\/label>\n            <textarea id=\"message\" name=\"message\" required><\/textarea>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <button class=\"btn btn--primary\" type=\"submit\">Send enquiry<\/button>\n            <p class=\"form-note\" style=\"margin-block-start:10px\">We reply within two working days.<\/p>\n            <p class=\"notice\" data-form-status tabindex=\"-1\" hidden style=\"margin-block-start:14px\">\n              <span><strong>Thank you — in a live version this would now be with the school.<\/strong>\n              This demo does not transmit anything.<\/span>\n            <\/p>\n          <\/div>\n        <\/form>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section\">\n      <div class=\"container split\" style=\"align-items:start\">\n        <div>\n          <span class=\"eyebrow\">تواصل معنا<\/span>\n          <h1 class=\"h2\" style=\"margin-block:12px 16px\">اسأل عن برنامج<\/h1>\n          <p class=\"lede\">أخبرنا بالبرنامج الذي تفكّر فيه وبما تريد معرفته. تُحال الاستفسارات إلى الكلية\n            التي تقدّم البرنامج — ولا تُباع بياناتك لأي جهة أخرى.<\/p>\n\n          <div class=\"notice\" style=\"margin-block-start:26px\">\n            <div>\n              <strong>نموذج تجريبي.<\/strong>\n              هذا مشروع شخصي بلا خادم متصل، فلا يُرسَل أو يُحفَظ أي شيء عند الإرسال.\n              اربطه بخدمة استقبال نماذج قبل استخدامه فعليًا.\n            <\/div>\n          <\/div>\n\n          <h2 class=\"h3\" style=\"margin-block:34px 12px\">إدراج برنامج<\/h2>\n          <p class=\"muted\">يمكن للكليات اقتراح برنامج لإدراجه في الدليل مجانًا. الإدراج قرار تحريري،\n            والموضع غير معروض للبيع.<\/p>\n        <\/div>\n\n        <form class=\"form-grid\" data-contact-form novalidate\n              style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px\">\n          <div class=\"field-block\">\n            <label for=\"name\">الاسم<\/label>\n            <input id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\" required>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"email\">البريد الإلكتروني<\/label>\n            <input id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <label for=\"course\">البرنامج محلّ الاستفسار<\/label>\n            <select id=\"course\" name=\"course\" data-course-select><\/select>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <label for=\"message\">سؤالك<\/label>\n            <textarea id=\"message\" name=\"message\" required><\/textarea>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <button class=\"btn btn--primary\" type=\"submit\">أرسل الاستفسار<\/button>\n            <p class=\"form-note\" style=\"margin-block-start:10px\">نردّ خلال يومَي عمل.<\/p>\n            <p class=\"notice\" data-form-status tabindex=\"-1\" hidden style=\"margin-block-start:14px\">\n              <span><strong>شكرًا لك — في النسخة الفعلية كان استفسارك سيصل الآن إلى الكلية.<\/strong>\n              هذه النسخة التجريبية لا ترسل أي بيانات.<\/span>\n            <\/p>\n          <\/div>\n        <\/form>\n      <\/div>\n    <\/section>\n  "}};

  const homeOf = (c) => cityCountry(schoolOf(c));
  /* Where you would actually be. Used for the "Location" fact on detail pages. */
  const placeOf = (c) => (c.format === 'online' ? t('misc.online') : cityCountry(schoolOf(c)));
  const subjectLabel = (id) => pick(SUBJECT[id]);
  const formatLabel = (id) => pick(FORMAT[id]);
  const regionLabel = (id) => pick(REGION[id]);
  const langLabel = (id) => pick(LANGUAGE[id]);

  const stars = (r) => '★'.repeat(Math.round(r)) + '☆'.repeat(5 - Math.round(r));

  /* --- Shortlist (shared between locales via one storage key) ------------- */
  const STORE_KEY = 'masar:shortlist';
  const Shortlist = {
    read() {
      /* Anything at all can be sitting under this key — another app, an old
         format, a half-written value. JSON.parse succeeding is not enough:
         a parsed string or object would sail past the catch and then throw
         on .filter() deep inside a render. */
      try {
        const raw = JSON.parse(localStorage.getItem(STORE_KEY));
        return Array.isArray(raw) ? raw.filter((id) => typeof id === 'string') : [];
      } catch (e) {
        return [];
      }
    },
    write(ids) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(ids)); } catch (e) { /* private mode */ }
      Shortlist.sync();
    },
    has(id) { return Shortlist.read().indexOf(id) !== -1; },
    toggle(id) {
      const ids = Shortlist.read();
      const i = ids.indexOf(id);
      if (i === -1) ids.push(id); else ids.splice(i, 1);
      Shortlist.write(ids);
      return i === -1;
    },
    remove(id) { Shortlist.write(Shortlist.read().filter((x) => x !== id)); },
    clear() { Shortlist.write([]); },
    sync() {
      const ids = Shortlist.read();
      document.querySelectorAll('[data-shortlist-count]').forEach((el) => {
        el.textContent = I.num(ids.length);
        if (ids.length) el.setAttribute('data-has', ''); else el.removeAttribute('data-has');
      });
      document.querySelectorAll('.save-btn[data-course]').forEach((btn) => {
        const on = ids.indexOf(btn.getAttribute('data-course')) !== -1;
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.title = on ? t('card.saved') : t('card.save');
      });
      renderDrawer();
    }
  };

  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5S3.5 15 3.5 9.2A4.7 4.7 0 0 1 12 6.6a4.7 4.7 0 0 1 8.5 2.6c0 5.8-8.5 11.3-8.5 11.3Z"/></svg>';

  function saveButton(c) {
    return '<button class="save-btn" type="button" data-course="' + c.id + '" aria-pressed="false"' +
      ' aria-label="' + esc(t('card.saveA11y', { title: pick(c.title) })) + '">' + HEART + '</button>';
  }

  /* --- Cards -------------------------------------------------------------- */

      '<article class="course-card">' +
        '<div class="course-card__top">' +
          '<div>' +
            '<a class="course-card__school" href="school.html?id=' + s.id + '">' + esc(pick(s.name)) + '</a>' +
            '<div class="course-card__place">' + esc(homeOf(c)) + ' · ' + esc(formatLabel(c.format)) + '</div>' +
          '</div>' +
          saveButton(c) +
        '</div>' +
        '<h3><a href="course.html?id=' + c.id + '">' + esc(pick(c.title)) + '</a></h3>' +
        '<p class="course-card__summary">' + esc(pick(c.summary)) + '</p>' +
        '<div class="course-card__meta">' +
          '<span class="pill pill--brand">' + esc(subjectLabel(c.subject)) + '</span>' +
          '<span class="pill">' + esc(I.dayCount(c.days)) + '</span>' +

            esc(t('card.starts', { date: I.shortDate(c.start) })) +
            /* Imported listings carry no rating; the card simply omits the
               line rather than showing an invented score. */
            (c.rating != null
              ? '<br><span class="rating"><span class="stars" aria-hidden="true">' + stars(c.rating) + '</span>' +
                '<span class="sr-only">' + c.rating + '/5</span>' +

  function schoolCard(s) {

  /* --- Chrome: theme, nav, drawer ---------------------------------------- */
  function initChrome() {
    /* Currency preference: fees show in each course's own currency, or all
       converted to SAR. Rendering reads the preference through I.money, so a
       change simply reloads the page. */
    const tools = document.querySelector('.header-tools');
    if (tools) {
      const sel = document.createElement('select');
      sel.className = 'select select--sm currency-switch';
      sel.setAttribute('aria-label', t('currency.label'));
      sel.innerHTML =
        '<option value="orig">' + esc(t('currency.orig')) + '</option>' +
        '<option value="sar">' + esc(t('currency.sar')) + '</option>';
      sel.value = I.getCurrency();
      if (sel.value === 'sar') sel.title = t('currency.note');
      sel.addEventListener('change', function () {
        I.setCurrency(sel.value);
        location.reload();
      });
      tools.insertBefore(sel, tools.firstChild);
    }

    const themeBtn = document.querySelector('[data-theme-toggle]');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('masar:theme', next); } catch (e) { /* ignore */ }
        themeBtn.setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
      });
      themeBtn.setAttribute('aria-pressed',
        document.documentElement.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
    }

    const navBtn = document.querySelector('[data-nav-toggle]');
    const nav = document.getElementById('main-nav');
    if (navBtn && nav) {
      navBtn.addEventListener('click', function () {
        const open = nav.hasAttribute('data-open');
        if (open) nav.removeAttribute('data-open'); else nav.setAttribute('data-open', '');
        navBtn.setAttribute('aria-expanded', open ? 'false' : 'true');
      });
    }

    /* Shortlist drawer */
    const drawer = document.querySelector('[data-drawer]');
    const backdrop = document.querySelector('[data-drawer-backdrop]');
    const openBtns = document.querySelectorAll('[data-drawer-open]');
    if (drawer && backdrop) {
      let opener = null;

      const open = (e) => {
        opener = (e && e.currentTarget) || document.activeElement;
        drawer.setAttribute('data-open', ''); backdrop.setAttribute('data-open', '');
        drawer.removeAttribute('aria-hidden');
        drawer.removeAttribute('inert');
        openBtns.forEach((b) => b.setAttribute('aria-expanded', 'true'));
        const closeBtn = drawer.querySelector('[data-drawer-close]');
        if (closeBtn) closeBtn.focus();
      };

      const close = () => {
        if (!drawer.hasAttribute('data-open')) return;
        drawer.removeAttribute('data-open'); backdrop.removeAttribute('data-open');
        openBtns.forEach((b) => b.setAttribute('aria-expanded', 'false'));
        /* Focus has to leave before the panel is hidden — aria-hidden and
           inert must never be applied to a subtree that still holds focus. */
        if (drawer.contains(document.activeElement)) {
          if (opener && document.contains(opener)) opener.focus();
          else document.body.focus();
        }
        drawer.setAttribute('aria-hidden', 'true');
        drawer.setAttribute('inert', '');
        opener = null;
      };

      openBtns.forEach((b) => {
        b.setAttribute('aria-expanded', 'false');
        b.addEventListener('click', open);
      });
      backdrop.addEventListener('click', close);
      drawer.querySelectorAll('[data-drawer-close]').forEach((b) => b.addEventListener('click', close));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      const clearBtn = drawer.querySelector('[data-shortlist-clear]');
      if (clearBtn) clearBtn.addEventListener('click', () => Shortlist.clear());
    }

    /* Save buttons are delegated so dynamically rendered cards work too. */
    document.addEventListener('click', function (e) {
      const btn = e.target.closest ? e.target.closest('.save-btn[data-course]') : null;
      if (!btn) return;
      e.preventDefault();
      Shortlist.toggle(btn.getAttribute('data-course'));
    });

    /* Carry search/filter state across the language switch. There are two of
       these — the header pill and the footer link — and missing the second one
       drops ?id= on detail pages, landing the reader on "not found". */
    if (location.search) {
      document.querySelectorAll('[data-lang-switch]').forEach(function (link) {
        link.href = link.getAttribute('href') + location.search;
      });
    }

    const yr = document.querySelector('[data-year]');
    if (yr) yr.textContent = I.num(new Date().getFullYear());

    /* The shortlist is a nicety; the catalogue is the site. Never let a
       storage problem here abort boot() and leave every page empty. */
    try { Shortlist.sync(); } catch (e) { /* badge and drawer only */ }
  }

  function renderDrawer() {
    const body = document.querySelector('[data-drawer-body]');
    if (!body) return;
    const ids = Shortlist.read().filter((id) => COURSE[id]);
    if (!ids.length) {
      body.innerHTML = '<p class="muted" style="padding-block:20px">' + esc(t('shortlist.empty')) + '</p>';
      return;
    }
    body.innerHTML = ids.map(function (id) {
      const c = COURSE[id];
      return '<div class="drawer-item">' +
        '<div class="drawer-item__body">' +
          '<h4><a href="course.html?id=' + c.id + '">' + esc(pick(c.title)) + '</a></h4>' +
          '<p>' + esc(pick(schoolOf(c).name)) + ' · ' + esc(I.money(c.price, c.currency)) + '</p>' +
        '</div>' +
        '<button type="button" data-remove="' + c.id + '">' + esc(t('shortlist.remove')) + '</button>' +
      '</div>';
    }).join('');
    body.querySelectorAll('[data-remove]').forEach((b) => {
      b.addEventListener('click', () => Shortlist.remove(b.getAttribute('data-remove')));
    });
  }

  /* --- Home --------------------------------------------------------------- */
