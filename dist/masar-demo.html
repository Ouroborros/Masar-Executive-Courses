/* ==========================================================================
   Masar — site.css

   THE LEDGER. The whole site is one ruled ledger: numbered chapters, a
   monospace index track, and hairline data rows — no cards, no boxes — where
   the start date, the teaching days and the fee are set as oversized numerals
   and ARE the imagery. Honesty is structural: an unrecorded field prints an
   em dash against a printed legend rather than disappearing.

   Ground is Kohl; ink is Limestone; one Clay accent, budgeted. Dusk is
   reserved for the Hijri track and nothing else; Olive marks "Online" and
   nothing else.

   Direction is a token block, not a second stylesheet: every rule below uses
   logical properties, and [dir="rtl"] flips tracking, caps, leading, the
   transform origin and the font stack. A grep of this file for physical
   left/right properties must return nothing.
   ========================================================================== */

/* --- Tokens: palette (dark is the default ground) ------------------------- */
:root {
  color-scheme: dark;

  /* grounds */
  --ground:     #1F1B17;   /* Kohl — page */
  --paper:      #272219;   /* raised: row hover, sheet fill */
  --wash:       #2E2820;   /* chips, active-filter bar, tinted band */
  /* ink */
  --ink:        #F3EDE3;   /* Limestone — 13.9:1 on ground */
  --ink-2:      #C9BFAE;   /*  9.4:1 — secondary values */
  --muted:      #A79E90;   /*  6.6:1 — labels, meta (floor for text) */
  /* rules — two weights */
  --rule-hair:  #3D3630;   /* intra-group separators only */
  --rule:       #5A5045;   /* group/set boundaries, control borders */
  --rule-ink:   var(--ink);/* chapter boundaries */
  /* accents */
  --clay:       #D9764F;   /*  5.5:1 on ground */
  --clay-deep:  #E8906C;   /* hover on filled */
  --clay-on:    #1F1B17;   /* text on a filled clay control */
  --dusk:       #8FB0CE;   /* RESERVED: the Hijri track, nothing else */
  --olive:      #93A67E;   /* RESERVED: the "Online" format token */
  /* the one darker band */
  --band:       #16130F;
  --band-ink:   #EFE7DA;
  --band-muted: #A79E90;
  --band-rule:  #3A322A;
  --band-clay:  #D9764F;

  /* faces */
  --latin-display: "Newsreader", Georgia, "Times New Roman", serif;
  --latin-body:    "Archivo", "Helvetica Neue", Helvetica, sans-serif;
  --arabic-display:"Markazi Text", "Noto Naskh Arabic", serif;
  --arabic-body:   "IBM Plex Sans Arabic", "Segoe UI", sans-serif;
  --font-mono:     "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* type scale — the ONLY sizes in this stylesheet */
  --fs-100: .75rem;      /* 12px — Latin micro-label floor */
  --fs-150: .8125rem;    /* 13px — the Arabic twin of --fs-100 */
  --fs-200: .875rem;
  --fs-300: .9375rem;
  --fs-400: 1.0625rem;
  --fs-500: clamp(1.1875rem, .95rem + .55vw, 1.375rem);
  --fs-600: clamp(1.375rem, 1.05rem + 1.15vw, 1.75rem);
  --fs-700: clamp(1.75rem, 1.15rem + 2.1vw, 2.75rem);
  --fs-800: clamp(2.25rem, 1.3rem + 4vw, 4rem);
  --fs-900: clamp(2.75rem, 1.1rem + 6.8vw, 6rem);
  /* the numerals ARE the imagery */
  --fs-num-s: clamp(1.375rem, 1.05rem + 1.35vw, 1.875rem);
  --fs-num-m: clamp(1.75rem, 1.1rem + 2.3vw, 2.75rem);
  --fs-num-l: clamp(3rem, 1.4rem + 6.2vw, 6rem);

  /* spacing — 4px base, nothing outside it */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
  --sp-6: 32px; --sp-7: 48px; --sp-8: 64px; --sp-9: 96px;

  --sheet: 1360px;
  --gutter: clamp(20px, 4vw, 54px);
  --hdr-h: 64px;

  /* direction tokens — LTR values here, flipped once under [dir="rtl"] */
  --track: .12em;
  --track-display: -.02em;
  --caps: uppercase;
  --lh-display: 1.06;
  --lh-title: 1.18;
  --lh-body: 1.62;
  --origin: left;
  --dirx: 1;
  --font-display: var(--latin-display);
  --font-body:    var(--latin-body);
  --font-label:   var(--font-mono);
  --font-num:     var(--latin-display);
}

:root[dir="rtl"] {
  font-size: 110%;
  --track: normal;
  --caps: none;
  --lh-display: 1.32;
  --lh-title: 1.4;
  --lh-body: 1.82;
  --origin: right;
  --dirx: -1;
  --font-display: var(--arabic-display);
  --font-body:    var(--arabic-body);
  --font-label:   var(--arabic-body);   /* mono never carries Arabic */
  --font-num:     var(--latin-display); /* numerals stay Newsreader in both */
}

/* Light is the alternate ground, not the default. Both the media query and
   the explicit attribute are handled, in this order. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ground:    #F3EDE3;
    --paper:     #FAF6EE;
    --wash:      #E9E0D2;
    --ink:       #1F1B17;
    --ink-2:     #56504A;
    --muted:     #6B6257;
    --rule-hair: #B9A98F;
    --rule:      #8E8271;
    --clay:      #A64B2A;
    --clay-deep: #8E3D20;
    --clay-on:   #FFFFFF;
    --dusk:      #2E4157;
    --olive:     #4F5F40;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --ground:    #F3EDE3;
  --paper:     #FAF6EE;
  --wash:      #E9E0D2;
  --ink:       #1F1B17;
  --ink-2:     #56504A;
  --muted:     #6B6257;
  --rule-hair: #B9A98F;
  --rule:      #8E8271;
  --clay:      #A64B2A;
  --clay-deep: #8E3D20;
  --clay-on:   #FFFFFF;
  --dusk:      #2E4157;
  --olive:     #4F5F40;
}

/* --- Base ---------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }

/* clip, not hidden: the off-screen shortlist drawer is a transformed fixed
   element and would otherwise widen the document, but `hidden` would make
   the root a scroll container and kill every sticky head on the page. */
html { -webkit-text-size-adjust: 100%; scroll-padding-block-start: calc(var(--hdr-h) + 20px); overflow-x: clip; }

body {
  font-family: var(--font-body);
  font-size: var(--fs-400);
  line-height: var(--lh-body);
  color: var(--ink);
  background: var(--ground);
  -webkit-font-smoothing: antialiased;
  /* Arabic is never faux-bolded or faux-italicised. */
  font-synthesis-weight: none;
  font-synthesis-style: none;
}

img, svg, video { display: block; max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 300;
  line-height: var(--lh-display);
  letter-spacing: var(--track-display);
}
h3, h4 { font-weight: 400; line-height: var(--lh-title); }
:root[dir="rtl"] h1, :root[dir="rtl"] h2, :root[dir="rtl"] h3, :root[dir="rtl"] h4 {
  font-weight: 500; letter-spacing: 0;
}

::selection { background: var(--clay); color: var(--clay-on); }

:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; border-radius: 2px; }

.sheet { max-inline-size: var(--sheet); margin-inline: auto; padding-inline: var(--gutter); }

.sr-only {
  position: absolute; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; inset-block-start: 8px; inset-inline-start: 8px; z-index: 200;
  transform: translateY(-200%);
  background: var(--clay); color: var(--clay-on);
  padding: 12px 20px; font-family: var(--font-label); font-size: var(--fs-100);
  letter-spacing: var(--track); text-transform: var(--caps);
}
.skip-link:focus { transform: translateY(0); }

/* --- Primitives ---------------------------------------------------------- */
/* Micro-label: the index track. Consumes the direction tokens. */
.lbl {
  font-family: var(--font-label);
  font-size: var(--fs-100);
  font-weight: 500;
  letter-spacing: var(--track);
  text-transform: var(--caps);
  color: var(--muted);
}
:root[dir="rtl"] .lbl { font-size: var(--fs-150); }

/* Every numeral on the site. */
.num {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-weight: 300;
  letter-spacing: var(--track-display);
}

/* Latin runs inside Arabic prose keep their own direction and sit a touch
   smaller so a Latin digit does not shout inside a Naskh line. */
.ltr { direction: ltr; unicode-bidi: isolate; }
:root[dir="rtl"] .ltr { font-size: .92em; }

/* The bidi primitive: an opposite-language run sits flush to the host page's
   own start edge. text-align:end resolves against the element's own
   direction, so this one pair works in all four combinations. */
.alt-run {
  direction: rtl; text-align: end;
  inline-size: fit-content; max-inline-size: 100%;
  font-family: var(--arabic-display);
}
:root[dir="rtl"] .alt-run {
  direction: ltr;
  font-family: var(--latin-display);
}

/* An unrecorded value is printed, not omitted. */
.dash { color: var(--muted); }

/* The leak-proof backstop. Tracking and caps must never reach Arabic, no
   matter which component forgot to reset them. Keep this after everything. */

/* --- Masthead ------------------------------------------------------------ */
.masthead {
  border-block-end: 1px solid var(--rule);
  background: var(--ground);
}
@media (min-width: 900px) { .masthead { position: sticky; inset-block-start: 0; z-index: 100; } }
.masthead__in { display: flex; align-items: center; gap: var(--sp-4); min-block-size: var(--hdr-h); }

.wordmark { display: inline-flex; align-items: center; gap: 10px; flex: none; }
.wordmark__kufi { inline-size: 18px; block-size: 18px; flex: none; color: var(--clay); }
.wordmark__la {
  font-family: var(--latin-display); font-weight: 500; font-size: 1.5rem; line-height: 1;
  letter-spacing: .075em; text-transform: uppercase;
}
.wordmark__bar { inline-size: 1px; block-size: 22px; background: var(--rule); flex: none; }
.wordmark__ar { font-family: var(--arabic-display); font-weight: 600; font-size: 1.9rem; line-height: 1; color: var(--clay); }
/* Order comes from the builder (Arabic-first in the Arabic build); the mark
   leads in both, so the flex direction is never reversed here. */

.chapnav { margin-inline-start: auto; min-inline-size: 0; }
.chapnav ul { display: flex; align-items: center; list-style: none; padding: 0; margin: 0; }
.chapnav li + li { border-inline-start: 1px solid var(--rule-hair); }
.chapnav a {
  display: flex; align-items: center; min-block-size: 44px; padding-inline: 12px;
  font-family: var(--font-label); font-size: var(--fs-100); font-weight: 500;
  letter-spacing: var(--track); text-transform: var(--caps); color: var(--muted);
  white-space: nowrap;
  transition: color .2s;
}
:root[dir="rtl"] .chapnav a { font-size: var(--fs-150); }
.chapnav a:hover { color: var(--ink); }
.chapnav a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 0 var(--clay); }

.tools { display: flex; align-items: center; gap: var(--sp-2); flex: none; }

.ctl {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-block-size: 44px; min-inline-size: 44px; padding-inline: 12px;
  border: 1px solid var(--rule); background: transparent; color: var(--ink);
  font-family: var(--font-label); font-size: var(--fs-100); font-weight: 500;
  letter-spacing: var(--track); text-transform: var(--caps); cursor: pointer;
  transition: background-color .2s, color .2s, border-color .2s;
}
:root[dir="rtl"] .ctl { font-family: var(--arabic-body); font-size: var(--fs-150); }
.ctl:hover { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.ctl[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
select.ctl { appearance: none; padding-inline-end: 28px; }

.only-wide { display: inline; }
.nav-toggle { display: none; }
.currency-in-nav { display: none; }
.chapnav li.nav-currency { display: none; }
@media (max-width: 899px) {
  .only-wide { display: none; }
  .tools > [data-currency] { display: none; }
  .chapnav li.nav-currency { display: block; border-block-start: 0; }
  .currency-in-nav {
    display: inline-flex; inline-size: 100%;
    justify-content: flex-start; margin-block-start: var(--sp-2);
  }
  /* The masthead has to hold a bilingual wordmark and three controls inside
     390px. Everything in it gets smaller rather than anything being dropped. */
  .masthead__in { gap: var(--sp-2); }
  .tools { gap: 6px; }
  .ctl { padding-inline: 9px; min-inline-size: 40px; }
  .wordmark { gap: 7px; }
  .wordmark__kufi { inline-size: 15px; block-size: 15px; }
  .wordmark__la { font-size: 1.15rem; letter-spacing: .06em; }
  .wordmark__ar { font-size: 1.45rem; }
  .wordmark__bar { block-size: 17px; }
  /* The chapters control becomes its own glyph; the word stays for readers
     on assistive technology via aria-label on the button. The :root[dir]
     selector that re-sizes .ctl for Arabic outranks a bare class, so this
     one has to be written at the same weight to win in both directions. */
  :root .ctl.nav-toggle { font-size: 0; padding-inline: 0; inline-size: 44px; }
  .ctl.nav-toggle::before {
    content: ""; inline-size: 17px; block-size: 11px;
    border-block: 1px solid currentColor;
    border-block-end-width: 1px;
    box-shadow: inset 0 5px 0 -2px currentColor;
  }
}
/* Below 360px the wordmark gives up size before the controls give up reach —
   44px touch targets are kept at every width. */
@media (max-width: 360px) {
  :root { --gutter: 16px; }
  .wordmark { gap: 5px; }
  .wordmark__kufi { inline-size: 13px; block-size: 13px; }
  .wordmark__la { font-size: 1rem; }
  .wordmark__ar { font-size: 1.25rem; }
  .wordmark__bar { block-size: 15px; }
}
/* Under ~380px the language control gives up its full name for a two-letter
   code. aria-label still carries "read this page in Arabic" in full. */
@media (max-width: 380px) {
  .tools > [data-lang-switch] {
    font-size: 0; padding-inline: 0; inline-size: 40px; min-inline-size: 40px;
  }
  .tools > [data-lang-switch]::before {
    content: attr(data-lang-code);
    font-family: var(--font-mono); font-size: var(--fs-100); letter-spacing: .08em;
  }
}
@media (max-width: 899px) {
  .nav-toggle { display: inline-flex; }
  .chapnav {
    position: fixed; inset-block-start: var(--hdr-h); inset-inline: 0; z-index: 99;
    background: var(--ground); border-block-end: 1px solid var(--rule);
    padding: var(--sp-2) var(--gutter) var(--sp-5);
    display: none;
  }
  .chapnav[data-open] { display: block; }
  .chapnav ul { flex-direction: column; align-items: stretch; }
  .chapnav li + li { border-inline-start: 0; border-block-start: 1px solid var(--rule-hair); }
  .chapnav a { font-size: var(--fs-200); min-block-size: 48px; padding-inline: 0; }
}

/* --- Chapter ------------------------------------------------------------- */
.chapter { border-block-start: 1px solid var(--rule-ink); }
.chapter:first-of-type { border-block-start: 0; }
.chapter--band { background: var(--band); color: var(--band-ink); border-block-color: var(--band-rule); }
.chapter--band .lbl, .chapter--band .chap-note { color: var(--band-muted); }
.chapter--band .rule-legend { color: var(--band-muted); }

.chap-head {
  display: grid; gap: var(--sp-4);
  padding-block: clamp(34px, 5vw, 66px) clamp(20px, 2.6vw, 32px);
}
@media (min-width: 900px) {
  .chap-head { grid-template-columns: 84px minmax(0, 1fr) minmax(230px, 25rem); gap: var(--sp-5); align-items: start; }
}
.chap-num { font-family: var(--font-mono); font-size: var(--fs-100); font-weight: 500; letter-spacing: var(--track); color: var(--clay); direction: ltr; unicode-bidi: isolate; text-align: start; }
.chap-title { font-size: var(--fs-700); }
.chap-title .alt-run { display: block; font-size: var(--fs-600); color: var(--muted); margin-block-start: var(--sp-1); }
.chap-note { color: var(--muted); font-size: var(--fs-300); }
.chap-body { padding-block-end: clamp(40px, 5vw, 88px); }

/* --- §01 Hero ------------------------------------------------------------ */
.hero { padding-block: clamp(28px, 4vw, 56px) clamp(40px, 5vw, 80px); }
.hero__grid { display: grid; gap: var(--sp-7); }
@media (min-width: 960px) { .hero__grid { grid-template-columns: minmax(0, 1fr) 300px; gap: var(--sp-8); align-items: start; } }

.dateline { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: baseline; margin-block-end: var(--sp-5); }
.dateline__sep { color: var(--rule); }
.dateline .hijri { color: var(--dusk); }

.hero h1 { font-size: var(--fs-900); }
.hero h1 .ln { display: block; inline-size: fit-content; max-inline-size: 100%; padding-block-end: .06em; }
.hero__echo { display: block; color: var(--clay); font-size: var(--fs-700); margin-block-start: var(--sp-4); }
.hero__stand { color: var(--ink-2); font-size: var(--fs-400); max-inline-size: 54ch; margin-block-start: var(--sp-5); }
.hero__acts { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-block-start: var(--sp-6); }

.totals { display: grid; }
.totals__it { display: block; padding-block: var(--sp-4); border-block-start: 1px solid var(--rule); }
.totals__it:first-child { border-block-start: 1px solid var(--rule-ink); }
.totals__n { display: block; font-size: var(--fs-num-l); line-height: .9; }
.totals__l { display: block; margin-block-start: var(--sp-2); }
@media (max-width: 959px) {
  .totals { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); }
  .totals__n { font-size: var(--fs-num-m); }
}

/* --- §02 Fields (the twelve subjects) ------------------------------------ */
/* Hairline grid: gap:1px over a rule background, opaque cells. */
.fields { display: grid; gap: 1px; background: var(--rule-hair); border-block: 1px solid var(--rule); }
@media (min-width: 700px)  { .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1080px) { .fields { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.field {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto;
  align-items: center; gap: var(--sp-3);
  min-block-size: 62px; padding: var(--sp-3) var(--sp-4);
  background: var(--ground);
  transition: background-color .2s;
}
.field:hover { background: var(--paper); }
.field__n { font-family: var(--font-mono); font-size: var(--fs-100); color: var(--muted); }
:root[dir="rtl"] .field__n { font-size: var(--fs-150); }
.field__name { font-family: var(--font-display); font-size: var(--fs-600); line-height: var(--lh-title); }
.field__c { font-family: var(--font-mono); font-size: var(--fs-100); color: var(--muted); }
:root[dir="rtl"] .field__c { font-family: var(--arabic-body); font-size: var(--fs-150); }
.field[aria-disabled="true"] { color: var(--muted); }
.field[aria-disabled="true"] .go { display: none; }

/* --- The arrow ----------------------------------------------------------- */
/* An SVG, never a → character: the glyph is not bidi-mirrored. */
.go { inline-size: 18px; block-size: 18px; flex: none; color: var(--muted); transform: scaleX(var(--dirx)); transition: transform .25s, color .2s; }
.row:hover .go, .field:hover .go, .school-row:hover .go { color: var(--clay); transform: scaleX(var(--dirx)) translateX(4px); }

/* --- §03 The ledger row -------------------------------------------------- */
.ledger { border-block-start: 1px solid var(--rule); }

.grp-head {
  display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: baseline;
  padding-block: var(--sp-4) var(--sp-2);
  background: var(--ground);
  border-block-start: 1px solid var(--rule);
}
.grp-head:first-child { border-block-start: 0; }
@media (min-width: 900px) { .grp-head { position: sticky; inset-block-start: var(--hdr-h); z-index: 20; } }
.grp-head__g { font-family: var(--font-display); font-size: var(--fs-500); }
.grp-head__h { color: var(--dusk); font-size: var(--fs-300); }
.grp-head__c { color: var(--muted); font-size: var(--fs-300); margin-inline-start: auto; }

.row {
  position: relative;
  display: grid; gap: 0 var(--sp-4);
  grid-template-columns: 58px minmax(0, 1fr);
  grid-template-areas: "date main" "date org" "foot foot";
  padding-block: var(--sp-4);
  border-block-start: 1px solid var(--rule-hair);
  transition: background-color .2s;
}
.grp-head + .row { border-block-start: 0; }
.row:hover { background: var(--paper); }
.row__idx  { grid-area: idx;  display: none; }
.row__date { grid-area: date; }
.row__main { grid-area: main; min-inline-size: 0; }
.row__org  { grid-area: org;  min-inline-size: 0; margin-block-start: var(--sp-2); }
.row__foot { grid-area: foot; display: flex; flex-wrap: wrap; gap: var(--sp-5); align-items: baseline; margin-block-start: var(--sp-3); }
.row__days { }
.row__fee  { margin-inline-start: auto; text-align: end; }
.row__go   { grid-area: go; display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2); }

.row__d { display: block; font-size: var(--fs-num-s); line-height: 1; }
.row__m { display: block; margin-block-start: 2px; }
.row__t { font-family: var(--font-display); font-size: var(--fs-600); line-height: var(--lh-title); font-weight: 400; }
.row__t a { display: inline; }
/* Full-row stretched link; the ring lands on the row, not the text. */
.row__t a::after { content: ""; position: absolute; inset: 0; }
.row:has(a:focus-visible) { outline: 2px solid var(--clay); outline-offset: -2px; }
.row__alt { display: block; font-size: var(--fs-300); color: var(--muted); margin-block-start: 2px; }
.row__school { display: block; font-size: var(--fs-300); color: var(--ink-2); }
.row__meta { display: block; margin-block-start: 2px; }
.row__meta .online { color: var(--olive); }
.row__n { display: block; font-size: var(--fs-num-s); line-height: 1; margin-block-start: 2px; }
.row__fee-n { display: block; font-size: var(--fs-num-m); line-height: 1; margin-block-start: 2px; direction: ltr; unicode-bidi: isolate; }
.row__sar { display: block; font-size: var(--fs-100); line-height: 1.35; color: var(--muted); margin-block-start: var(--sp-1); direction: ltr; unicode-bidi: isolate; }
:root[dir="rtl"] .row__sar { font-size: var(--fs-150); }
.row__fee .lbl, .row__days .lbl { display: block; }

@media (min-width: 900px) {
  .row {
    grid-template-columns: 34px 72px minmax(0, 1fr) minmax(130px, .66fr) 62px 168px 68px;
    grid-template-areas: "idx date main org days fee go";
    align-items: start; gap: 0 var(--sp-4);
  }
  .row__idx { display: block; }
  .row__foot { display: contents; }
  .row__org { margin-block-start: 0; }
  .row__days, .row__fee { margin-block-start: 0; }
  .row__fee { margin-inline-start: 0; }
}
@media (min-width: 1140px) {
  .row { grid-template-columns: 42px 88px minmax(0, 1fr) minmax(170px, .6fr) 74px 196px 76px; }
}

.rule-legend {
  display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5);
  padding-block: var(--sp-4);
  border-block-start: 1px solid var(--rule);
  color: var(--muted); font-size: var(--fs-200);
}
.ledger-foot { display: flex; flex-wrap: wrap; gap: var(--sp-4); align-items: center; padding-block: var(--sp-5); border-block-start: 1px solid var(--rule); }

.save { position: relative; z-index: 1; inline-size: 36px; min-inline-size: 36px; padding-inline: 0; }
.save[aria-pressed="true"] { background: var(--clay); border-color: var(--clay); color: var(--clay-on); }
.save[aria-pressed="true"] svg { fill: currentColor; }
.save.btn--block { inline-size: 100%; min-block-size: 48px; gap: var(--sp-2); }

/* --- §04 School row ------------------------------------------------------ */
.school-row {
  position: relative; display: grid; gap: var(--sp-1) var(--sp-4);
  grid-template-columns: 42px minmax(0, 1fr);
  padding-block: var(--sp-4);
  border-block-start: 1px solid var(--rule-hair);
  transition: background-color .2s;
}
.school-row:hover { background: var(--paper); }
/* In the shortlist drawer the header already draws a rule, so the first
   row's own top border would read as a stray mark below it. */
.school-row--saved { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.school-row--saved:first-child { border-block-start: 0; }
.school-row--saved .school-row__name { font-size: var(--fs-500); }
.note--bare { border: 0; }
.enquiry__save { margin-block-start: var(--sp-2); }
.school-row__n { font-family: var(--font-mono); font-size: var(--fs-100); color: var(--muted); }
:root[dir="rtl"] .school-row__n { font-size: var(--fs-150); }
.school-row__name { font-family: var(--font-display); font-size: var(--fs-500); line-height: var(--lh-title); }
.school-row__name a::after { content: ""; position: absolute; inset: 0; }
@media (min-width: 820px) {
  /* Five real columns: lot, name, city, country, programme count. Every one
     after the name is allowed to shrink, or a long count spills the row. */
  .school-row {
    grid-template-columns:
      42px minmax(0, 1fr) minmax(0, 176px) minmax(0, 150px) minmax(0, 132px);
    align-items: baseline;
  }
  .school-row > :last-child { text-align: end; }
}

/* --- Collection row ------------------------------------------------------ */
.coll-row {
  position: relative; display: grid; gap: var(--sp-1) var(--sp-4);
  grid-template-columns: 42px minmax(0, 1fr) 120px;
  padding-block: var(--sp-5);
  border-block-start: 1px solid var(--rule-hair);
  transition: background-color .2s;
}
.coll-row:hover { background: var(--paper); }
.coll-row__t { font-family: var(--font-display); font-size: var(--fs-600); line-height: var(--lh-title); }
.coll-row__t a::after { content: ""; position: absolute; inset: 0; }
.coll-row__b { color: var(--muted); font-size: var(--fs-300); margin-block-start: var(--sp-1); }
.coll-row__c { text-align: end; }
.coll-row__c .num { display: block; font-size: var(--fs-num-s); line-height: 1; }

/* --- §05 Method band ----------------------------------------------------- */
.creed { font-family: var(--font-display); font-size: var(--fs-800); font-weight: 300; max-inline-size: 22ch; }
/* .tenets and .plate are band-only components: they are authored inside
   .chapter--band and read against --band, never against the page ground. */
.tenets { display: grid; gap: 1px; background: var(--band-rule); margin-block-start: var(--sp-7); }
@media (min-width: 820px) { .tenets { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1140px) { .tenets { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tenet { background: var(--band); padding: var(--sp-5) var(--sp-4) var(--sp-5) 0; }
.tenet__n { font-family: var(--font-mono); font-size: var(--fs-100); color: var(--band-clay); letter-spacing: var(--track); direction: ltr; unicode-bidi: isolate; }
.tenet h3 { font-size: var(--fs-500); margin-block: var(--sp-2) var(--sp-2); color: var(--band-ink); }
.tenet p { color: var(--band-muted); font-size: var(--fs-300); }

.plate { display: grid; gap: var(--sp-5); margin-block-start: var(--sp-7); padding-block-start: var(--sp-6); border-block-start: 1px solid var(--band-rule); }
@media (min-width: 900px) { .plate { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-8); align-items: center; } }
.plate__codes {
  font-family: var(--font-mono); font-weight: 400;
  font-size: clamp(1.5rem, 3.1vw, 2.375rem); line-height: 1.5;
  color: var(--band-ink); letter-spacing: .06em;
  direction: ltr; unicode-bidi: isolate;
  /* Spans in a wrapping flow, not one unbreakable run: at 320px the five
     codes have to fold onto a second line rather than widen the document. */
  display: flex; flex-wrap: wrap; gap: 0 .5em;
}
.plate p { color: var(--band-muted); }
.plate p + p { margin-block-start: var(--sp-4); }
.alt-block { margin-block-start: var(--sp-7); padding-block-start: var(--sp-5); border-block-start: 1px solid var(--rule); }
.alt-block .alt-run { font-size: var(--fs-700); color: var(--ink); }
/* The same block appears on the page ground and on the inverted band; only
   inside the band does it take band ink, or in light mode it goes invisible. */
.chapter--band .alt-block { border-block-start-color: var(--band-rule); }
.chapter--band .alt-block .alt-run { color: var(--band-ink); }

/* --- §06 Steps ----------------------------------------------------------- */

.record { margin-block-start: var(--sp-7); border-block-start: 1px solid var(--rule); }
.record__r { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: var(--sp-3) var(--sp-4); padding-block: var(--sp-3); border-block-start: 1px solid var(--rule-hair); }

.record__v { font-family: var(--font-mono); font-size: var(--fs-200); direction: ltr; unicode-bidi: isolate; }

/* --- Buttons ------------------------------------------------------------- */

  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);

  transition: background-color .2s, color .2s, border-color .2s;
}
:root[dir="rtl"] .btn { font-family: var(--arabic-body); font-size: var(--fs-300); letter-spacing: 0; text-transform: none; }
.btn--solid { background: var(--clay); border-color: var(--clay); color: var(--clay-on); }
.btn--solid:hover { background: var(--clay-deep); border-color: var(--clay-deep); }
.btn--ghost:hover { background: var(--ink); color: var(--ground); }
.chapter--band .btn { color: var(--band-ink); }
.chapter--band .btn--solid { background: var(--band-clay); border-color: var(--band-clay); color: var(--band); }

.chapter--band .ctl:hover, .colophon .ctl:hover,

.btn--block { inline-size: 100%; }

.pill {
  display: inline-flex; align-items: center; gap: var(--sp-2);

:root[dir="rtl"] .pill { font-family: var(--arabic-body); font-size: var(--fs-150); letter-spacing: 0; text-transform: none; }
.pill button { min-inline-size: 44px; min-block-size: 34px; background: none; border: 0; color: var(--muted); cursor: pointer; }
.pill button:hover { color: var(--clay); }

/* --- Catalogue ----------------------------------------------------------- */
.cat { display: grid; gap: var(--sp-6); align-items: start; }

.count-hero { display: flex; flex-wrap: wrap; gap: var(--sp-4); align-items: baseline; padding-block: var(--sp-5); }

.count-hero__l { font-size: var(--fs-500); color: var(--ink-2); }

.facets { border-block-start: 1px solid var(--rule); }

.facet { border: 0; border-block-end: 1px solid var(--rule-hair); padding: var(--sp-4) 0; margin: 0; }
.facet > legend, .facet > h3 { padding: 0; margin-block-end: var(--sp-3); font-family: var(--font-label); font-size: var(--fs-100); font-weight: 500; letter-spacing: var(--track); text-transform: var(--caps); color: var(--muted); }
:root[dir="rtl"] .facet > legend, :root[dir="rtl"] .facet > h3 { font-family: var(--arabic-body); font-size: var(--fs-150); }
.facet fieldset { border: 0; padding: 0; margin: 0; }
.facet-opt { display: flex; align-items: center; gap: var(--sp-3); min-block-size: 44px; cursor: pointer; font-size: var(--fs-300); }

.facet-opt span { flex: 1; min-inline-size: 0; }
.facet-opt .c { font-family: var(--font-mono); font-size: var(--fs-100); color: var(--muted); flex: none; }
:root[dir="rtl"] .facet-opt .c { font-family: var(--arabic-body); font-size: var(--fs-150); }
.facet-opt:hover span { color: var(--clay); }
.facet-opt[aria-disabled="true"] { color: var(--muted); cursor: not-allowed; }
.facets__done { display: none; }

.toolbar { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; padding-block: var(--sp-4); border-block-start: 1px solid var(--rule); }

.sortgrp { display: flex; flex-wrap: wrap; }
.sortgrp .ctl { margin-inline-start: -1px; }
.applied { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding-block: var(--sp-3); }

.empty { padding-block: var(--sp-9); border-block-start: 1px solid var(--rule); }
.empty h3 { font-size: var(--fs-700); max-inline-size: 20ch; }
.empty p { color: var(--muted); margin-block: var(--sp-4) var(--sp-5); max-inline-size: 50ch; }

   reachable from anywhere in a long list. */

@media (max-width: 1079px) {

    position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 90;

  .facets {

  }

/* --- Programme detail (quieter than the home page) ----------------------- */
.crumb { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding-block: var(--sp-4); }
.crumb a:hover { color: var(--clay); }

.rec-head { padding-block: var(--sp-5) var(--sp-6); border-block-end: 1px solid var(--rule); }
.rec-head__school { display: block; font-size: var(--fs-500); color: var(--ink-2); margin-block-end: var(--sp-3); }
.rec-head h1 { font-size: var(--fs-800); max-inline-size: 20ch; }
.rec-head__alt { display: block; margin-block-start: var(--sp-3); font-size: var(--fs-600); color: var(--muted); }

.rec { display: grid; gap: var(--sp-7); align-items: start; padding-block: var(--sp-6); }
@media (min-width: 960px) { .rec { grid-template-columns: minmax(0, 1fr) 340px; gap: var(--sp-8); } }

.facts { border-block-start: 1px solid var(--rule); }
.facts__r { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: var(--sp-2) var(--sp-4); padding-block: var(--sp-3); border-block-start: 1px solid var(--rule-hair); }

  --closed: translateX(100%);
  position: fixed; z-index: 190; inset-block: 0; inset-inline-end: 0;
  inline-size: min(440px, 100%);
  background: var(--ground); border-inline-start: 1px solid var(--rule);
  display: flex; flex-direction: column;
  transform: var(--closed); visibility: hidden;
  transition: transform .24s cubic-bezier(.32, .72, 0, 1), visibility 0s linear .24s;

:root[dir="rtl"] .drawer { --closed: translateX(-100%); }
.drawer[data-open] { transform: translateX(0); visibility: visible; transition-delay: 0s; }

/* --- The one motion idea: the rules draw --------------------------------- */
/* The data never animates. Every row is ruled at all times; the reveal draws
   a heavier overlay on top of the static hairline. */
[data-reveal] { position: relative; }
[data-reveal]::before {
  content: ""; position: absolute; inset-block-start: -1px; inset-inline: 0;
  block-size: 1px; background: var(--rule);
  transform: scaleX(0); transform-origin: var(--origin);
  transition: transform .62s cubic-bezier(.22, .72, .2, 1);
  transition-delay: calc(var(--i, 0) * 55ms);
}
[data-reveal].is-in::before { transform: scaleX(1); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: .001ms !important;
    animation-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
  [data-reveal]::before { transform: scaleX(1); }
}

 <section class=\"chapter chapter--band\" id=\"method\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§04<\/span>\n          <h2 class=\"chap-title\">Method<span class=\"alt-run\" lang=\"ar\">المنهج<\/span><\/h2>\n          <p class=\"chap-note\">How a programme gets into the index, and what we will not do to it.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <p class=\"creed\">We list. We do not sell.<\/p>\n\n          <div class=\"tenets\">\n            <div class=\"tenet\">\n              <span class=\"tenet__n\">01<\/span>\n              <h3>Source<\/h3>\n              <p>Every record is taken from the school's own published programme page. If a school\n                did not state it, this index does not state it either.<\/p>\n            <\/div>\n            <div class=\"tenet\">\n              <span class=\"tenet__n\">02<\/span>\n              <h3>Currency<\/h3>\n              <p>The fee is the school's own, in the school's own currency. We do not convert the\n                figure we publish.<\/p>\n            <\/div>\n            <div class=\"tenet\">\n              <span class=\"tenet__n\">03<\/span>\n              <h3>Silence<\/h3>\n              <p>An unrecorded field prints an em dash. An index that fills its own gaps is not\n                an index.<\/p>\n            <\/div>\n            <div class=\"tenet\">\n              <span class=\"tenet__n\">04<\/span>\n              <h3>Position<\/h3>\n              <p>No rankings, no ratings, no featured slots, no paid placement. Order is by date,\n                fee, teaching days or school — whichever you choose.<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"plate\">\n            <p class=\"plate__codes\"><span>USD<\/span><span>CHF<\/span><span>AUD<\/span><span>CAD<\/span><span>DKK<\/span><\/p>\n            <div>\n              <p>Five currencies appear in this index because five currencies appear on the\n                schools' own pages. Converting them would be a guess printed as a fact.<\/p>\n              <p>Beside every fee we also print an indicative riyal figure and the date of the\n                rate we used. It is an indication for a budget line, not a quote.<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"alt-block\">\n            <span class=\"alt-run\" lang=\"ar\">الرقم كما نشرته الكلية. لا تحويل، ولا تقدير.<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n    <section class=\"chapter\" id=\"teams\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§05<\/span>\n          <h2 class=\"chap-title\">Enrolling a team<span class=\"alt-run\">تسجيل فريق<\/span><\/h2>\n          <p class=\"chap-note\">Masar does not enrol on a school's behalf. It points you at the right intake and the right desk.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <div class=\"steps\">\n            <div class=\"step\"><span class=\"step__n\">01<\/span><h3>Shortlist the intakes<\/h3><p>Filter the index by field, city, month, teaching days or fee, and keep what fits.<\/p><\/div>\n            <div class=\"step\"><span class=\"step__n\">02<\/span><h3>Send it on<\/h3><p>A filtered view is a link, and a shortlist copies as plain text — both forward to a sponsor intact.<\/p><\/div>\n            <div class=\"step\"><span class=\"step__n\">03<\/span><h3>Ask for a proposal<\/h3><p>Tell us the seats and the quarter. Group terms and closed cohorts are agreed with the school, not with us.<\/p><\/div>\n          <\/div>\n          <div class=\"ledger-foot\"><a class=\"btn btn--solid\" href=\"contact.html#teams\">Request a proposal<\/a><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"hero\">\n      <div class=\"sheet\">\n        <p class=\"dateline lbl\">\n          <span>فهرس مستقل · الرياض<\/span>\n          <span class=\"dateline__sep\" aria-hidden=\"true\">/<\/span>\n          <span data-today>—<\/span>\n          <span class=\"dateline__sep\" aria-hidden=\"true\">/<\/span>\n          <span class=\"hijri\" data-today-hijri>—<\/span>\n        <\/p>\n\n        <div class=\"hero__grid\">\n          <div>\n            <h1>\n              <span class=\"ln\" data-reveal style=\"--i:0\">الرسوم.<\/span>\n              <span class=\"ln\" data-reveal style=\"--i:1\">المدينة.<\/span>\n              <span class=\"ln\" data-reveal style=\"--i:2\">التواريخ.<\/span>\n            <\/h1>\n            <span class=\"hero__echo alt-run\" lang=\"en\">The fee. The city. The dates.<\/span>\n            <p class=\"hero__stand\">يفهرس «مسار» البرامج التنفيذية مفتوحة التسجيل من كليات الأعمال\n              حول العالم: الرسوم التي تنشرها كل كلية، والمدينة التي يُدرَّس فيها البرنامج، وتواريخه،\n              وعدد أيام التدريس. لا تصنيف، ولا بيع.<\/p>\n            <div class=\"hero__acts\">\n              <a class=\"btn btn--solid\" href=\"courses.html\">تصفَّح الفهرس<\/a>\n              <a class=\"btn btn--ghost\" href=\"contact.html#teams\">سجّل فريقًا<\/a>\n            <\/div>\n          <\/div>\n\n          <div class=\"totals\">\n            <a class=\"totals__it\" href=\"courses.html\">\n              <span class=\"totals__n num\" data-stat=\"programmes\">189<\/span>\n              <span class=\"totals__l lbl\">برنامجًا<\/span>\n            <\/a>\n            <a class=\"totals__it\" href=\"schools.html\">\n              <span class=\"totals__n num\" data-stat=\"schools\">16<\/span>\n              <span class=\"totals__l lbl\">كلية أعمال<\/span>\n            <\/a>\n            <a class=\"totals__it\" href=\"courses.html\">\n              <span class=\"totals__n num\" data-stat=\"countries\">6<\/span>\n              <span class=\"totals__l lbl\">دولة تُقدَّم فيها<\/span>\n            <\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§01<\/span>\n          <h2 class=\"chap-title\">الحقول<span class=\"alt-run\">Fields<\/span><\/h2>\n          <p class=\"chap-note\">اثنا عشر حقلًا تمرّ عبر الفهرس. اختر واحدًا ليُفتح الفهرس مصفّى عليه.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <div class=\"fields\" data-home-fields><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§02<\/span>\n          <h2 class=\"chap-title\">أقرب الدفعات<span class=\"alt-run\">The next intakes<\/span><\/h2>\n          <p class=\"chap-note\">مجمّعة حسب تاريخ البدء، الأقرب أولًا. عشرة هنا، وبقيتها في الفهرس.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <div class=\"ledger\" data-home-ledger><\/div>\n          <div class=\"ledger-foot\">\n            <a class=\"btn btn--ghost\" href=\"courses.html\" data-all-programmes>اعرض الفهرس كاملًا<\/a>\n            <span class=\"lbl\">— غير مسجّل<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§03<\/span>\n          <h2 class=\"chap-title\">الكليات<span class=\"alt-run\">The schools<\/span><\/h2>\n          <p class=\"chap-note\">كل مؤسسة لها برامج في الفهرس، باسمها — بلا شعارات وبلا تصنيفات.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <div data-home-schools><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter chapter--band\" id=\"method\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§04<\/span>\n          <h2 class=\"chap-title\">المنهج<span class=\"alt-run\" lang=\"en\">Method<\/span><\/h2>\n          <p class=\"chap-note\">كيف يدخل البرنامج إلى الفهرس، وما الذي لن نفعله به.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <p class=\"creed\">نحن نفهرس، ولا نبيع.<\/p>\n\n          <div class=\"tenets\">\n            <div class=\"tenet\">\n              <span class=\"tenet__n\">٠١<\/span>\n              <h3>المصدر<\/h3>\n              <p>كل سجل مأخوذ من صفحة البرنامج التي تنشرها الكلية نفسها. وما لم تذكره الكلية\n                لا يذكره هذا الفهرس.<\/p>\n            <\/div>\n            <div class=\"tenet\">\n              <span class=\"tenet__n\">٠٢<\/span>\n              <h3>العملة<\/h3>\n              <p>الرسم رسم الكلية، وبعملتها. ولا نحوّل الرقم الذي ننشره.<\/p>\n            <\/div>\n            <div class=\"tenet\">\n              <span class=\"tenet__n\">٠٣<\/span>\n              <h3>الصمت<\/h3>\n              <p>الحقل غير المسجّل تُطبَع مكانه شَرطة. والفهرس الذي يملأ فجواته بنفسه ليس فهرسًا.<\/p>\n            <\/div>\n            <div class=\"tenet\">\n              <span class=\"tenet__n\">٠٤<\/span>\n              <h3>الترتيب<\/h3>\n              <p>لا تصنيفات ولا تقييمات ولا مواضع مميّزة ولا إدراج مدفوع. الترتيب بالتاريخ أو\n                الرسوم أو أيام التدريس أو الكلية — كما تختار أنت.<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"plate\">\n            <p class=\"plate__codes\"><span>USD<\/span><span>CHF<\/span><span>AUD<\/span><span>CAD<\/span><span>DKK<\/span><\/p>\n            <div>\n              <p>تظهر خمس عملات في هذا الفهرس لأن خمس عملات تظهر في صفحات الكليات نفسها.\n                وتحويلها سيكون تخمينًا يُطبَع بوصفه واقعة.<\/p>\n              <p>وإلى جانب كل رسم نطبع أيضًا مبلغًا استرشاديًا بالريال وتاريخ سعر الصرف المستخدم.\n                هو إشارة لبند في الميزانية، لا عرض سعر.<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"alt-block\">\n            <span class=\"alt-run\" lang=\"en\">The figure is the school's own. No conversion, no estimate.<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n    <section class=\"chapter\" id=\"teams\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§05<\/span>\n          <h2 class=\"chap-title\">تسجيل فريق<span class=\"alt-run\">Enrolling a team<\/span><\/h2>\n          <p class=\"chap-note\">لا يسجّل «مسار» نيابةً عن أي كلية. هو يدلّك على الدفعة الصحيحة وعلى الجهة الصحيحة.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <div class=\"steps\">\n            <div class=\"step\"><span class=\"step__n\">٠١<\/span><h3>اختر الدفعات<\/h3><p>صفِّ الفهرس حسب الحقل أو المدينة أو الشهر أو أيام التدريس أو الرسوم، واحتفظ بما يناسبك.<\/p><\/div>\n            <div class=\"step\"><span class=\"step__n\">٠٢<\/span><h3>مرّرها<\/h3><p>أي نتيجة مصفّاة رابط، والقائمة المختارة تُنسَخ نصًّا — وكلاهما يصل إلى الجهة الداعمة كما هو.<\/p><\/div>\n            <div class=\"step\"><span class=\"step__n\">٠٣<\/span><h3>اطلب عرضًا<\/h3><p>أخبرنا بعدد المقاعد والرُّبع المطلوب. وتُتَّفق شروط المجموعات والدفعات المغلقة مع الكلية، لا معنا.<\/p><\/div>\n          <\/div>\n          <div class=\"ledger-foot\"><a class=\"btn btn--solid\" href=\"contact.html#teams\">اطلب عرضًا<\/a><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  "}, "courses.html": {"en": "\n\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§02<\/span>\n          <h2 class=\"chap-title\">The index<span class=\"alt-run\" lang=\"ar\">الفهرس<\/span><\/h2>\n          <p class=\"chap-note\">Sort by the axis you compare on: date, fee, teaching days or school.<\/p>\n        <\/div>\n\n        <div class=\"count-hero\">\n          <span class=\"count-hero__n num\" data-results-count>—<\/span>\n          <span class=\"count-hero__l\" data-results-label>programmes match.<\/span>\n        <\/div>\n\n        <div class=\"cat\">\n          <form class=\"facets\" data-facets aria-label=\"Filters\">\n            <div data-facet-body><\/div>\n            <button class=\"btn btn--solid facets__done\" type=\"button\" data-facets-close>Show results<\/button>\n          <\/form>\n\n          <div>\n            <div class=\"toolbar\">\n              <div class=\"search\">\n                <label class=\"sr-only\" for=\"q\">Search the index<\/label>\n                <input id=\"q\" type=\"search\" data-search placeholder=\"Programme, school or city\">\n              <\/div>\n              <div class=\"sortgrp\" data-sort role=\"group\" aria-label=\"Sort\"><\/div>\n            <\/div>\n            <div class=\"applied\" data-applied><\/div>\n            <div class=\"ledger\" data-results><\/div>\n            <div class=\"ledger-foot\">\n              <button class=\"btn btn--ghost\" type=\"button\" data-more hidden><\/button>\n              <span class=\"lbl\">— not recorded<\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <div class=\"filters-bar\">\n      <button class=\"ctl\" type=\"button\" data-facets-open>Filters<\/button>\n      <span class=\"lbl\" data-bar-count role=\"status\"><\/span>\n    <\/div>\n  ", "ar": "\n\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§02<\/span>\n          <h2 class=\"chap-title\">الفهرس<span class=\"alt-run\" lang=\"en\">The index<\/span><\/h2>\n          <p class=\"chap-note\">رتّب حسب المحور الذي تقارن به: التاريخ أو الرسوم أو أيام التدريس أو الكلية.<\/p>\n        <\/div>\n\n        <div class=\"count-hero\">\n          <span class=\"count-hero__n num\" data-results-count>—<\/span>\n          <span class=\"count-hero__l\" data-results-label>برنامجًا مطابقًا.<\/span>\n        <\/div>\n\n        <div class=\"cat\">\n          <form class=\"facets\" data-facets aria-label=\"أدوات التصفية\">\n            <div data-facet-body><\/div>\n            <button class=\"btn btn--solid facets__done\" type=\"button\" data-facets-close>اعرض النتائج<\/button>\n          <\/form>\n\n          <div>\n            <div class=\"toolbar\">\n              <div class=\"search\">\n                <label class=\"sr-only\" for=\"q\">ابحث في الفهرس<\/label>\n                <input id=\"q\" type=\"search\" data-search placeholder=\"برنامج أو كلية أو مدينة\">\n              <\/div>\n              <div class=\"sortgrp\" data-sort role=\"group\" aria-label=\"الترتيب\"><\/div>\n            <\/div>\n            <div class=\"applied\" data-applied><\/div>\n            <div class=\"ledger\" data-results><\/div>\n            <div class=\"ledger-foot\">\n              <button class=\"btn btn--ghost\" type=\"button\" data-more hidden><\/button>\n              <span class=\"lbl\">— غير مسجّل<\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <div class=\"filters-bar\">\n      <button class=\"ctl\" type=\"button\" data-facets-open>التصفية<\/button>\n      <span class=\"lbl\" data-bar-count role=\"status\"><\/span>\n    <\/div>\n  "}, "course.html": {"en": "\n\n    <div class=\"sheet\">\n      <nav class=\"crumb lbl\" aria-label=\"Index\">\n        <a href=\"courses.html\">Index<\/a>\n        <span aria-hidden=\"true\">/<\/span>\n        <span data-crumb-school>School<\/span>\n      <\/nav>\n    <\/div>\n    <div class=\"sheet\" data-record><\/div>\n  ", "ar": "\n\n    <div class=\"sheet\">\n      <nav class=\"crumb lbl\" aria-label=\"الفهرس\">\n        <a href=\"courses.html\">الفهرس<\/a>\n        <span aria-hidden=\"true\">/<\/span>\n        <span data-crumb-school>الكلية<\/span>\n      <\/nav>\n    <\/div>\n    <div class=\"sheet\" data-record><\/div>\n  "}, "schools.html": {"en": "\n\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§03<\/span>\n          <h2 class=\"chap-title\">The schools<span class=\"alt-run\" lang=\"ar\">الكليات<\/span><\/h2>\n          <p class=\"chap-note\">Sortable by name, country or number of programmes in the index.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <div class=\"toolbar\"><div class=\"sortgrp\" data-school-sort role=\"group\" aria-label=\"Sort\"><\/div><\/div>\n          <div data-schools><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§03<\/span>\n          <h2 class=\"chap-title\">الكليات<span class=\"alt-run\" lang=\"en\">The schools<\/span><\/h2>\n          <p class=\"chap-note\">يمكن ترتيبها بالاسم أو الدولة أو عدد البرامج في الفهرس.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <div class=\"toolbar\"><div class=\"sortgrp\" data-school-sort role=\"group\" aria-label=\"الترتيب\"><\/div><\/div>\n          <div data-schools><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  "}, "school.html": {"en": "\n\n    <div class=\"sheet\">\n      <nav class=\"crumb lbl\" aria-label=\"Index\">\n        <a href=\"schools.html\">Schools<\/a>\n        <span aria-hidden=\"true\">/<\/span>\n        <span data-crumb-school>—<\/span>\n      <\/nav>\n    <\/div>\n    <div class=\"sheet\" data-school-detail><\/div>\n  ", "ar": "\n\n    <div class=\"sheet\">\n      <nav class=\"crumb lbl\" aria-label=\"الفهرس\">\n        <a href=\"schools.html\">الكليات<\/a>\n        <span aria-hidden=\"true\">/<\/span>\n        <span data-crumb-school>—<\/span>\n      <\/nav>\n    <\/div>\n    <div class=\"sheet\" data-school-detail><\/div>\n  "}, "lists.html": {"en": "\n\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§04<\/span>\n          <h2 class=\"chap-title\">Sets<span class=\"alt-run\" lang=\"ar\">المجموعات<\/span><\/h2>\n          <p class=\"chap-note\">Editorial cuts of the index. Each states who selected it and on what basis — they are selections, not rankings.<\/p>\n        <\/div>\n        <div class=\"chap-body\"><div data-lists><\/div><\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§04<\/span>\n          <h2 class=\"chap-title\">المجموعات<span class=\"alt-run\" lang=\"en\">Sets<\/span><\/h2>\n          <p class=\"chap-note\">مقاطع تحريرية من الفهرس. تذكر كل مجموعة من اختارها وعلى أي أساس — فهي اختيارات لا تصنيفات.<\/p>\n        <\/div>\n        <div class=\"chap-body\"><div data-lists><\/div><\/div>\n      <\/div>\n    <\/section>\n  "}, "list.html": {"en": "\n\n    <div class=\"sheet\">\n      <nav class=\"crumb lbl\" aria-label=\"Index\">\n        <a href=\"lists.html\">Sets<\/a>\n        <span aria-hidden=\"true\">/<\/span>\n        <span data-crumb-list>—<\/span>\n      <\/nav>\n    <\/div>\n    <div class=\"sheet\" data-list-detail><\/div>\n  ", "ar": "\n\n    <div class=\"sheet\">\n      <nav class=\"crumb lbl\" aria-label=\"الفهرس\">\n        <a href=\"lists.html\">المجموعات<\/a>\n        <span aria-hidden=\"true\">/<\/span>\n        <span data-crumb-list>—<\/span>\n      <\/nav>\n    <\/div>\n    <div class=\"sheet\" data-list-detail><\/div>\n  "}, "about.html": {"en": "\n\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§05<\/span>\n          <h2 class=\"chap-title\">Method<span class=\"alt-run\" lang=\"ar\">المنهج<\/span><\/h2>\n          <p class=\"chap-note\">What this index is, where every figure comes from, and what it refuses to do.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <p class=\"creed\">An index that fills its own gaps is not an index.<\/p>\n\n          <div class=\"facts\" style=\"margin-block-start:var(--sp-7)\">\n            <div class=\"facts__r\"><span class=\"lbl\">What it is<\/span><div class=\"facts__v\">\n              An independent, bilingual index of open-enrolment executive programmes from the\n              world's business schools, built in Riyadh. It does not teach, it does not award\n              certificates, and it does not enrol on a school's behalf.<\/div><\/div>\n            <div class=\"facts__r\"><span class=\"lbl\">Where the data comes from<\/span><div class=\"facts__v\">\n              From each school's own published programme pages. Titles, dates, teaching days,\n              format, language of instruction and fees are recorded as stated. Descriptions and\n              marketing copy are never reproduced.<\/div><\/div>\n            <div class=\"facts__r\"><span class=\"lbl\">Fees<\/span><div class=\"facts__v\">\n              Printed in the school's own currency, exactly as published. An indicative riyal\n              figure is printed beside it with the date of the rate used. That line is an\n              indication for a budget, not a quote.<\/div><\/div>\n            <div class=\"facts__r\"><span class=\"lbl\">What is missing<\/span><div class=\"facts__v\">\n              Ratings, reviews, \"what you will learn\" and \"who should attend\" are absent because\n              a factual record cannot supply them. They print as an em dash rather than as an\n              invention.<\/div><\/div>\n            <div class=\"facts__r\"><span class=\"lbl\">Order<\/span><div class=\"facts__v\">\n              No rankings, no featured slots, no paid placement. Sets are editorial selections and\n              say so.<\/div><\/div>\n            <div class=\"facts__r\"><span class=\"lbl\">Privacy<\/span><div class=\"facts__v\">\n              No tracking script and no analytics. A shortlist is held in your own browser and\n              never leaves the device.<\/div><\/div>\n          <\/div>\n\n          <div class=\"alt-block\">\n            <span class=\"alt-run\" lang=\"ar\">مسار فهرس مستقل: لا يُدرّس ولا يمنح شهادات.<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§05<\/span>\n          <h2 class=\"chap-title\">المنهج<span class=\"alt-run\" lang=\"en\">Method<\/span><\/h2>\n          <p class=\"chap-note\">ما هذا الفهرس، ومن أين يأتي كل رقم فيه، وما الذي يرفض أن يفعله.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <p class=\"creed\">الفهرس الذي يملأ فجواته بنفسه ليس فهرسًا.<\/p>\n\n          <div class=\"facts\" style=\"margin-block-start:var(--sp-7)\">\n            <div class=\"facts__r\"><span class=\"lbl\">ما هو<\/span><div class=\"facts__v\">\n              فهرس مستقل ثنائي اللغة للبرامج التنفيذية مفتوحة التسجيل من كليات الأعمال حول العالم،\n              بُني في الرياض. لا يُدرّس، ولا يمنح شهادات، ولا يسجّل نيابةً عن أي كلية.<\/div><\/div>\n            <div class=\"facts__r\"><span class=\"lbl\">من أين تأتي البيانات<\/span><div class=\"facts__v\">\n              من صفحات البرامج التي تنشرها كل كلية. تُسجَّل العناوين والتواريخ وأيام التدريس ونمط\n              الدراسة ولغة التدريس والرسوم كما وردت. ولا يُعاد إنتاج أي وصف أو نص تسويقي.<\/div><\/div>\n            <div class=\"facts__r\"><span class=\"lbl\">الرسوم<\/span><div class=\"facts__v\">\n              تُطبَع بعملة الكلية كما نُشرت تمامًا، ويُطبَع إلى جانبها مبلغ استرشادي بالريال مع\n              تاريخ سعر الصرف المستخدم. هذا السطر إشارة لميزانية، لا عرض سعر.<\/div><\/div>\n            <div class=\"facts__r\"><span class=\"lbl\">ما الذي ينقص<\/span><div class=\"facts__v\">\n              لا تقييمات ولا مراجعات ولا «ماذا ستتعلّم» ولا «لمن هذا البرنامج»، لأن السجل الواقعي\n              لا يوفّرها. وتُطبَع شَرطة مكانها بدل أن تُختلَق.<\/div><\/div>\n            <div class=\"facts__r\"><span class=\"lbl\">الترتيب<\/span><div class=\"facts__v\">\n              لا تصنيفات ولا مواضع مميّزة ولا إدراج مدفوع. والمجموعات اختيارات تحريرية تقول ذلك صراحة.<\/div><\/div>\n            <div class=\"facts__r\"><span class=\"lbl\">الخصوصية<\/span><div class=\"facts__v\">\n              لا برامج تتبّع ولا تحليلات. وتُحفَظ القائمة المختارة في متصفّحك ولا تغادر جهازك.<\/div><\/div>\n          <\/div>\n\n          <div class=\"alt-block\">\n            <span class=\"alt-run\" lang=\"en\">Masar is an independent index. It does not teach and it does not certify.<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  "}, "contact.html": {"en": "\n\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§06<\/span>\n          <h2 class=\"chap-title\">Contact<span class=\"alt-run\" lang=\"ar\">التواصل<\/span><\/h2>\n          <p class=\"chap-note\">Three ways in. A channel we have not published yet prints as a dash, like every other unrecorded field in this index.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <div class=\"contact-row\">\n            <h3>WhatsApp<\/h3>\n            <p>The fastest way to reach us. Ask about an intake, a fee or a group booking.<\/p>\n            <div><span class=\"dash\" aria-hidden=\"true\">—<\/span><\/div>\n          <\/div>\n          <div class=\"contact-row\">\n            <h3>Corporate desk<\/h3>\n            <p>Seats for a team, or a closed cohort built around your calendar.<\/p>\n            <div><a class=\"btn btn--ghost\" href=\"#teams-form\">Request a proposal<\/a><\/div>\n          <\/div>\n          <div class=\"contact-row\">\n            <h3>A correction<\/h3>\n            <p>A fee, a date or a name we have recorded wrongly. Corrections are made the same week.<\/p>\n            <div><span class=\"dash\" aria-hidden=\"true\">—<\/span><\/div>\n          <\/div>\n\n          <div id=\"teams\" class=\"chap-head\" style=\"padding-block-end:0\">\n            <span class=\"chap-num\">§06.1<\/span>\n            <h2 class=\"chap-title\" style=\"font-size:var(--fs-600)\">Enrolling a team<\/h2>\n            <p class=\"chap-note\">Masar does not enrol on a school's behalf; the contract, the classroom and the certificate stay with the school.<\/p>\n          <\/div>\n\n          <form id=\"teams-form\" class=\"form\" data-contact-form novalidate style=\"margin-block-start:var(--sp-5)\">\n            <div class=\"fld\"><label for=\"name\">Your name<\/label><input id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\" required><\/div>\n            <div class=\"fld\"><label for=\"org\">Organisation<\/label><input id=\"org\" name=\"organisation\" type=\"text\" autocomplete=\"organization\"><\/div>\n            <div class=\"fld\"><label for=\"phone\">Mobile<\/label><input id=\"phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\" dir=\"ltr\" placeholder=\"+966\"><\/div>\n            <div class=\"fld\"><label for=\"email\">Email<\/label><input id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required><\/div>\n            <div class=\"fld fld--wide\"><label for=\"course\">Programme<\/label><select id=\"course\" name=\"course\" data-course-select><\/select><\/div>\n            <div class=\"fld\"><label for=\"seats\">Seats<\/label><input id=\"seats\" name=\"seats\" type=\"number\" min=\"1\" step=\"1\" value=\"1\" dir=\"ltr\"><\/div>\n            <div class=\"fld\"><label for=\"reply\">Reply in<\/label><select id=\"reply\" name=\"reply_language\"><option value=\"en\">English<\/option><option value=\"ar\">العربية<\/option><\/select><\/div>\n            <div class=\"fld fld--wide\"><label for=\"message\">Your question<\/label><textarea id=\"message\" name=\"message\" required><\/textarea><\/div>\n            <div class=\"fld fld--wide\">\n              <button class=\"btn btn--solid\" type=\"submit\" style=\"justify-self:start\">Send enquiry<\/button>\n              <p class=\"note\" data-form-status tabindex=\"-1\" hidden><span><strong>This form is not connected yet.<\/strong> The record below shows every channel we have published so far.<\/span><\/p>\n              <p class=\"note\">Answered in Riyadh hours, Sunday to Thursday.<\/p>\n            <\/div>\n          <\/form>\n\n          <div class=\"chap-head\" style=\"padding-block-end:0;margin-block-start:var(--sp-7)\">\n            <span class=\"chap-num\">§06.2<\/span>\n            <h2 class=\"chap-title\" style=\"font-size:var(--fs-600)\">The record<\/h2>\n            <p class=\"chap-note\">Who is behind this index. Every line is printed whether or not we have filled it in.<\/p>\n          <\/div>\n      <div class=\"record\">\n        <div class=\"record__r\">\n          <span class=\"lbl\">Commercial registration<\/span>\n          <span class=\"record__v\"><span class=\"dash\" aria-hidden=\"true\">—<\/span><span class=\"sr-only\">not recorded<\/span><\/span>\n        <\/div>\n        <div class=\"record__r\">\n          <span class=\"lbl\">VAT number<\/span>\n          <span class=\"record__v\"><span class=\"dash\" aria-hidden=\"true\">—<\/span><span class=\"sr-only\">not recorded<\/span><\/span>\n        <\/div>\n        <div class=\"record__r\">\n          <span class=\"lbl\">Maroof<\/span>\n          <span class=\"record__v\"><span class=\"dash\" aria-hidden=\"true\">—<\/span><span class=\"sr-only\">not recorded<\/span><\/span>\n        <\/div>\n        <div class=\"record__r\">\n          <span class=\"lbl\">Address<\/span>\n          <span class=\"record__v\"><span class=\"dash\" aria-hidden=\"true\">—<\/span><span class=\"sr-only\">not recorded<\/span><\/span>\n        <\/div>\n        <div class=\"record__r\">\n          <span class=\"lbl\">Telephone<\/span>\n          <span class=\"record__v\"><span class=\"dash\" aria-hidden=\"true\">—<\/span><span class=\"sr-only\">not recorded<\/span><\/span>\n        <\/div>\n        <div class=\"record__r\">\n          <span class=\"lbl\">WhatsApp<\/span>\n          <span class=\"record__v\"><span class=\"dash\" aria-hidden=\"true\">—<\/span><span class=\"sr-only\">not recorded<\/span><\/span>\n        <\/div>\n        <div class=\"record__r\">\n          <span class=\"lbl\">Last refreshed<\/span>\n          <span class=\"record__v\"><span dir=\"ltr\">23 August 2026<\/span><\/span>\n        <\/div>\n        <p class=\"record__note\">Printed by the same rule as the rest of the index: an em dash means we have not recorded it yet, not that it does not exist.<\/p>\n      <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"chapter\">\n      <div class=\"sheet\">\n        <div class=\"chap-head\">\n          <span class=\"chap-num\">§06<\/span>\n          <h2 class=\"chap-title\">التواصل<span class=\"alt-run\" lang=\"en\">Contact<\/span><\/h2>\n          <p class=\"chap-note\">ثلاث طرق للوصول. والقناة التي لم ننشرها بعد تُطبَع شَرطة، كأي حقل غير مسجّل في هذا الفهرس.<\/p>\n        <\/div>\n        <div class=\"chap-body\">\n          <div class=\"contact-row\">\n            <h3>واتساب<\/h3>\n            <p>أسرع طريقة للوصول إلينا. اسأل عن دفعة أو رسوم أو حجز جماعي.<\/p>\n            <div><span class=\"dash\" aria-hidden=\"true\">—<\/span><\/div>\n          <\/div>\n          <div class=\"contact-row\">\n            <h3>مكتب المنشآت<\/h3>\n            <p>مقاعد لفريق، أو دفعة مغلقة تُبنى حول تقويم منشأتك.<\/p>\n            <div><a class=\"btn btn--ghost\" href=\"#teams-form\">اطلب عرضًا<\/a><\/div>\n          <\/div>\n          <div class=\"contact-row\">\n            <h3>تصحيح<\/h3>\n            <p>رسم أو تاريخ أو اسم سجّلناه خطأً. تُصحَّح الملاحظات في الأسبوع نفسه.<\/p>\n            <div><span class=\"dash\" aria-hidden=\"true\">—<\/span><\/div>\n          <\/div>\n\n          <div id=\"teams\" class=\"chap-head\" style=\"padding-block-end:0\">\n            <span class=\"chap-num\">§06.1<\/span>\n            <h2 class=\"chap-title\" style=\"font-size:var(--fs-600)\">تسجيل فريق<\/h2>\n            <p class=\"chap-note\">لا يسجّل «مسار» نيابةً عن أي كلية؛ فالعقد والقاعة والشهادة تبقى لدى الكلية.<\/p>\n          <\/div>\n\n          <form id=\"teams-form\" -hidden=\"true\">—<\/span><span class=\"sr-only\">not recorded<\/span><\/span>\n        <\/div>\n        <div class=\"record__r\">\n          <span class=\"lbl\">آخر تحديث<\/span>\n          <span class=\"record__v\"><span dir=\"ltr\">٢٣ أغسطس ٢٠٢٦<\/span><\/span>\n        <\/div>\n        <p class=\"record__note\">يُطبَع بالقاعدة نفسها التي يُطبَع بها الفهرس: الشَّرطة تعني أننا لم نسجّله بعد، لا أنه غير موجود.<\/p>\n      <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"colo-base\">\n        <span>© <span data-year>2026<\/span> Masar<\/span>\n        <span>— غير مسجّل<\/span>\n        <span>كل رسم هو الرقم الذي نشرته الكلية نفسها، وبعملتها.<\/span>\n      <\/div>\n    <\/div>\n  <\/footer>", "drawer": "<div class=\"drawer-back\" data-drawer-backdrop><\/div>\n  <aside class=\"drawer\" data-drawer role=\"dialog\" aria-modal=\"true\" aria-label=\"المختارة\" aria-hidden=\"true\" inert>\n    <div class=\"drawer__h\">\n      <h2 style=\"font-size:var(--fs-500)\">المختارة<\/h2>\n      <button class=\"ctl\" type=\"button\" data-drawer-close>إغلاق<\/button>\n    <\/div>\n    <div class=\"drawer__b\" data-drawer-body><\/div>\n    <div class=\"drawer__f\">\n      <button class=\"btn btn--ghost btn--block\" type=\"button\" data-shortlist-copy><\/button>\n      <button class=\"btn btn--ghost btn--block\" type=\"button\" data-shortlist-clear><\/button>\n    <\/div>\n  <\/aside>"}};
  var LANG = document.documentElement.lang === 'ar' ? 'ar' : 'en';
  var HOME = 'index.html';

  function route() {
    var hash = '';
    try { hash = decodeURIComponent(location.hash); } catch (e) { hash = location.hash; }
    hash = hash.replace(/^#\/?/, '');
    var cut = hash.indexOf('?');
    var page = cut === -1 ? hash : hash.slice(0, cut);
    return {
      page: Object.prototype.hasOwnProperty.call(BODIES, page) ? page : HOME,
      query: cut === -1 ? '' : hash.slice(cut)
    };
  }

  function href(page, query) { return '#/' + page + (query || ''); }

  /* app.js asks for location.search and calls history.replaceState with either
     '?query' or a pathname; both are answered against the current hash. */
  window.__masarLocation = {
    get search() { return route().query; },
    get pathname() { return route().page; },
    get hash() { return location.hash; },
    get href() { return location.href; }
  };
  window.__masarHistory = {
    replaceState: function (state, title, url) {
      var query = (typeof url === 'string' && url.charAt(0) === '?') ? url : '';
      history.replaceState(state, title, href(route().page, query));
    },
    pushState: function (state, title, url) {
      var query = (typeof url === 'string' && url.charAt(0) === '?') ? url : '';
      history.pushState(state, title, href(route().page, query));
    }
  };

  function paintChrome() {
    document.querySelector('[data-masar-skip]').innerHTML = CHROME[LANG].skip;
    document.querySelector('[data-masar-chrome-top]').innerHTML = CHROME[LANG].header;
    document.querySelector('[data-masar-chrome-bottom]').innerHTML =
      CHROME[LANG].footer + CHROME[LANG].drawer;
  }

  function paintPage(scroll) {
    var r = route();
    document.getElementById('main').innerHTML = BODIES[r.page][LANG];
    document.title = TITLES[r.page][LANG];
    document.querySelectorAll('.chapnav a').forEach(function (a) {
      var target = (a.getAttribute('href') || '').split('?')[0];
      if (target === r.page) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    var nav = document.getElementById('chapnav');
    if (nav) nav.removeAttribute('data-open');
    if (window.MASAR_APP) window.MASAR_APP.mount();
    if (scroll) window.scrollTo({ top: 0, behavior: 'instant' });
  }

  /* Every in-site link is a document link in the real site; here they route. */
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    var raw = a.getAttribute('href') || '';

    if (a.hasAttribute('data-lang-switch')) {
      e.preventDefault();
      /* i18n.js binds its locale at load, so switching reloads the page. The
         hash — and with it the current page and its filters — survives. */
      try { localStorage.setItem('masar:lang', LANG === 'en' ? 'ar' : 'en'); } catch (err) {}
      location.reload();
      return;
    }

    var m = raw.match(/^(?:\.\.\/|ar\/)?([a-z-]+\.html)(\?.*)?$/);
    if (!m) return;
    e.preventDefault();
    if (!Object.prototype.hasOwnProperty.call(BODIES, m[1])) return;
    history.pushState({}, '', href(m[1], m[2] || ''));
    paintPage(true);
  });

  window.addEventListener('popstate', function () { paintPage(false); });

  paintChrome();
  paintPage(false);   /* app.js boots itself next and mounts this body */
})();
</script>

      'rec.hours': 'نردّ بتوقيت الرياض، من الأحد إلى الخميس.',
      'rec.other': 'برامج أخرى في هذه الكلية',
      'rec.similar': 'برامج أخرى في هذا الحقل',
      'rec.notFound': 'لا يوجد برنامج بهذا الاسم في الفهرس.',
      'rec.back': 'العودة إلى الفهرس',

      'school.notFound': 'لا توجد كلية بهذا الاسم في الفهرس.',
      'school.back': 'العودة إلى الكليات',
      'set.notFound': 'لا توجد مجموعة بهذا الاسم في الفهرس.',
      'set.back': 'العودة إلى المجموعات',
      'set.basis': 'اختارها فريق التحرير على الأساس المذكور هنا. اختيار، لا تصنيف.',
