/* ==========================================================================
   Masar — site.css
   One stylesheet for both locales; layout is written with CSS logical
   properties so the Arabic RTL page is the same code path as the English one.

   Identity (Direction C, "Contemporary Saudi"): the Kufi wordmark leads in
   both languages; violet and peach on a lilac-white ground; ink for text and
   for the hard 2px rules that replace shadows and rounded corners. Bricolage
   Grotesque carries Latin type at every size; Reem Kufi carries Arabic
   headlines; IBM Plex Sans Arabic carries Arabic reading text. Energy at the
   front door, quiet on the pages where the decision is made.
   ========================================================================== */

/* --- Tokens --------------------------------------------------------------- */
:root {
  color-scheme: light dark;

  --ink:          #16132B;
  --violet:       #4B3AD9;
  --violet-strong:#3A2BB8;
  --violet-soft:  #ECE9FF;
  --peach:        #FFD7C2;
  --peach-ink:    #7A5A4A;
  --wa:           #25D366;

  --bg:        #F6F5F8;
  --surface:   #FFFFFF;
  --text:      #16132B;
  --muted:     #6D6A80;
  --line:      #16132B;        /* hard rules */
  --line-soft: #DCD9E6;        /* dividers inside quiet blocks */
  --on-ink:       #F6F5F8;
  --on-ink-muted: #B9B5D1;

  --ui:      'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --display: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --kufi:    'Reem Kufi', 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif;

  --rule: 2px;
  --container: 1280px;
  --gutter: clamp(18px, 4vw, 48px);
  --header-h: 68px;

  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: clamp(1.3rem, 1.1rem + .8vw, 1.7rem);
  --step-3: clamp(1.8rem, 1.3rem + 2vw, 3rem);
  --step-4: clamp(2.6rem, 1.4rem + 5.2vw, 6.6rem);
}

html[lang="ar"] {
  --ui:      'IBM Plex Sans Arabic', 'Bricolage Grotesque', system-ui, 'Segoe UI', Tahoma, sans-serif;
  --display: 'Reem Kufi', 'Noto Kufi Arabic', 'IBM Plex Sans Arabic', sans-serif;
  --step-2: clamp(1.4rem, 1.15rem + .9vw, 1.85rem);
  --step-3: clamp(1.9rem, 1.35rem + 2.2vw, 3.2rem);
  --step-4: clamp(2.6rem, 1.4rem + 5vw, 6.2rem);
}

html[data-theme="dark"] {
  --ink:          #0F0D1C;
  --violet:       #8F80FF;
  --violet-strong:#A99DFF;
  --violet-soft:  #241F4A;
  --peach:        #FFC9AD;
  --peach-ink:    #7A5A4A;

  --bg:        #0F0D1C;
  --surface:   #17142A;
  --text:      #F1EFF9;
  --muted:     #A09CB8;
  --line:      #F1EFF9;
  --line-soft: #2E2A4A;
  --on-ink:       #F1EFF9;
  --on-ink-muted: #A09CB8;
}

/* --- Base ----------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }

html { -webkit-text-size-adjust: 100%; scroll-padding-block-start: calc(var(--header-h) + 20px); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

body {
  font-family: var(--ui);
  font-size: var(--step-0);
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
html[lang="ar"] body { line-height: 1.8; font-size: 1.04rem; }

img, svg, video { display: block; max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

h1, h2, h3, h4 {
  font-family: var(--display); font-weight: 800; line-height: 1;
  letter-spacing: -.03em; text-wrap: balance;
  font-variation-settings: 'opsz' 96, 'wdth' 92;
}
h3, h4 { font-weight: 700; letter-spacing: -.02em; line-height: 1.08; font-variation-settings: 'opsz' 48, 'wdth' 96; }
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] h4 {
  line-height: 1.25; letter-spacing: 0; font-weight: 700; font-variation-settings: normal;
}

::selection { background: var(--violet); color: #fff; }

:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.section { padding-block: clamp(56px, 7vw, 104px); }
.section--tight { padding-block: clamp(32px, 4.5vw, 56px); }
.section--alt { background: var(--surface); border-block: var(--rule) solid var(--line); }
.section--sea { background: var(--ink); color: var(--on-ink); }
.section--sea .eyebrow { color: var(--on-ink-muted); }
.section--sea .section-head p { color: var(--on-ink-muted); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; inset-block-start: 8px; inset-inline-start: 8px;
  z-index: 200; transform: translateY(-160%);
  background: var(--ink); color: #fff;
  padding: 10px 18px; font-weight: 700;
  transition: transform .15s ease-out;
}
.skip-link:focus { transform: translateY(0); }

/* --- Type helpers --------------------------------------------------------- */
.eyebrow {
  font-family: var(--ui);
  font-size: .74rem; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--violet);
}
html[lang="ar"] .eyebrow { letter-spacing: 0; font-size: .86rem; }

.display   { font-size: var(--step-4); }
.h2        { font-size: var(--step-3); }
.h3        { font-size: var(--step-2); }
.lede      { font-size: var(--step-1); color: var(--muted); max-width: 60ch; line-height: 1.5; }
html[lang="ar"] .lede { line-height: 1.8; }
.muted     { color: var(--muted); }
.prose p + p { margin-block-start: 1em; }

.section-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  margin-block-end: 28px; flex-wrap: wrap;
  padding-block-start: 18px; border-block-start: var(--rule) solid var(--line);
}
.section-head .eyebrow { display: block; margin-block-end: 12px; }
.section-head p { color: var(--muted); max-width: 56ch; margin-block-start: 10px; }

/* --- Buttons -------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 22px; border-radius: 0;
  font-weight: 700; font-size: .95rem; font-family: var(--ui);
  border: var(--rule) solid transparent; cursor: pointer;
  transition: background-color .16s ease, color .16s ease, border-color .16s ease;
}
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--violet); color: #fff; border-color: var(--violet); }
.btn--primary:hover { background: var(--violet-strong); border-color: var(--violet-strong); }
html[data-theme="dark"] .btn--primary { color: var(--ink); }
.btn--ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn--ghost:hover { background: var(--text); color: var(--bg); }
.btn--quiet { background: var(--surface); color: var(--text); border-color: var(--line-soft); }
.btn--quiet:hover { border-color: var(--line); }
.btn--block { width: 100%; }
.btn--sm { padding: 8px 14px; font-size: .85rem; }
.btn--wa { background: var(--wa); color: #06371c; border-color: var(--wa); }
.btn--wa:hover { background: #1fbf5a; border-color: #1fbf5a; }

.link-arrow { color: var(--violet); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.link-arrow:hover { color: var(--text); }
.link-arrow .arw { transition: transform .16s ease; }
.link-arrow:hover .arw { transform: translateX(4px); }
.link-arrow--light { color: var(--on-ink); }
.link-arrow--light:hover { color: var(--peach); }

/* --- Header --------------------------------------------------------------- */
.site-header {
  position: sticky; inset-block-start: 0; z-index: 100;
  background: var(--bg);
  border-block-end: var(--rule) solid var(--line);
}
.header-inner { display: flex; align-items: center; gap: 18px; min-height: var(--header-h); }
.brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.brand-kufi { font-family: var(--kufi); font-weight: 700; font-size: 1.9rem; line-height: 1; color: var(--violet); }
.brand-name {
  font-family: var(--display); font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em; line-height: 1;
  white-space: nowrap;
}
.brand-name small { display: none; }

.main-nav { margin-inline-start: auto; }
.main-nav ul { display: flex; align-items: center; gap: 4px; list-style: none; padding: 0; }
.main-nav a {
  display: block; padding: 9px 14px;
  font-size: .92rem; font-weight: 600; color: var(--text);
  transition: background-color .12s ease, color .12s ease;
}
.main-nav a:hover { background: var(--violet-soft); }
.main-nav a[aria-current="page"] { background: var(--text); color: var(--bg); }

.header-tools { display: flex; align-items: center; gap: 6px; flex: none; }
.currency-switch { padding: 7px 10px; font-size: .78rem; }
.currency-switch--nav { display: none; }
@media (max-width: 560px) {
  .header-tools .currency-switch { display: none; }
  .currency-switch--nav { display: block; width: 100%; margin-block-start: 10px; padding: 12px 14px; font-size: 1rem; }
}
@media (max-width: 400px) {
  .header-tools { gap: 3px; }
  .lang-switch { padding-inline: 10px; }
  .icon-btn { width: 36px; height: 36px; }
}

.icon-btn {
  display: inline-grid; place-items: center;
  width: 40px; height: 40px;
  background: transparent; border: var(--rule) solid var(--line); cursor: pointer;
  transition: background-color .12s ease, color .12s ease;
}
.icon-btn:hover { background: var(--text); color: var(--bg); }
.icon-btn svg { width: 18px; height: 18px; }

.lang-switch {
  display: inline-flex; align-items: center;
  padding: 8px 14px; border: var(--rule) solid var(--line);
  font-weight: 700; font-size: .85rem;
  transition: background-color .12s ease, color .12s ease;
}
.lang-switch:hover { background: var(--text); color: var(--bg); }

.shortlist-btn { position: relative; }
.shortlist-count {
  position: absolute; inset-block-start: -7px; inset-inline-end: -7px;
  min-width: 18px; height: 18px; padding-inline: 5px;
  background: var(--violet); color: #fff;
  font-size: .68rem; font-weight: 800; display: none; place-items: center;
}
.shortlist-count[data-has] { display: grid; }

.nav-toggle { display: none; }

@media (max-width: 1040px) {
  .nav-toggle { display: inline-grid; }
  .main-nav {
    position: fixed; inset-block-start: var(--header-h); inset-inline: 0;
    background: var(--bg); border-block-end: var(--rule) solid var(--line);
    padding: 12px var(--gutter) 22px;
    display: none;
  }
  .main-nav[data-open] { display: block; }
  .main-nav ul { flex-direction: column; align-items: stretch; gap: 2px; }
  .main-nav a { padding: 13px 14px; font-size: 1rem; }
}

/* --- Hero (offset headline, search bar, tiles) ----------------------------- */
.hero { padding-block: clamp(36px, 5vw, 72px) 0; }
.hero-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; align-items: end; }
.hero-grid > .hero-copy { grid-column: 1 / span 9; }
.hero-grid > .hero-side { grid-column: 10 / span 3; display: flex; flex-direction: column; gap: 12px; padding-block-end: 10px; }
@media (max-width: 900px) {
  .hero-grid > .hero-copy, .hero-grid > .hero-side { grid-column: 1 / -1; }
  .hero-grid > .hero-side { padding-block-end: 0; }
}
.hero h1 { font-size: var(--step-4); line-height: .92; }
html[lang="ar"] .hero h1 { line-height: 1.2; }
.hero h1 .tint { color: var(--violet); }
.hero-side p { font-size: 1.02rem; line-height: 1.45; }
.hero-side .tag { font-family: var(--display); font-weight: 700; color: var(--violet); font-size: 1.3rem; line-height: 1.3; }
html[lang="ar"] .hero-side .tag, .hero-side .tag[lang="ar"] { font-family: var(--kufi); font-size: 1.35rem; }

.hero-search {
  margin-block-start: 30px;
  display: grid; grid-template-columns: 2fr 1fr 1fr auto;
  border: var(--rule) solid var(--line); background: var(--surface);
}
.hero-search .field { display: flex; flex-direction: column; justify-content: center; padding: 10px 18px; border-inline-end: var(--rule) solid var(--line); }
.hero-search label { font-size: .66rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
html[lang="ar"] .hero-search label { letter-spacing: 0; font-size: .78rem; }
.hero-search input, .hero-search select {
  border: 0; background: transparent; padding: 2px 0;
  font-size: 1.02rem; font-weight: 500; width: 100%; line-height: 1.6; appearance: none; text-overflow: ellipsis;
}
.hero-search input:focus, .hero-search select:focus { outline: none; }
.hero-search .field:focus-within { background: var(--violet-soft); }
.hero-search .btn { align-self: stretch; border-radius: 0; padding-inline: 30px; }
@media (max-width: 820px) {
  .hero-search { grid-template-columns: 1fr 1fr; }
  .hero-search .field:first-child { grid-column: 1 / -1; border-inline-end: 0; border-block-end: var(--rule) solid var(--line); }
  .hero-search .field:nth-child(3) { border-inline-end: 0; }
  .hero-search .btn { grid-column: 1 / -1; }
}

/* Explore by ambition */
.ambitions { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 14px; }
.ambition {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 14px; border: var(--rule) solid var(--line);
  font-size: .9rem; font-weight: 700;
  transition: background-color .12s ease, color .12s ease;
}
.ambition:hover { background: var(--text); color: var(--bg); }
.ambition .arw { opacity: .6; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; margin-block-start: 22px; }
.tile {
  position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
  padding: 22px; min-height: 300px;
  background: var(--surface); border: var(--rule) solid var(--line); color: var(--text);
  transition: background-color .16s ease, color .16s ease;
}
.tile--large { grid-column: span 4; min-height: 340px; }
.tile--small { grid-column: span 3; min-height: 200px; }
.tile--violet { background: var(--violet); color: #fff; border-color: var(--violet); }
.tile--peach { background: var(--peach); color: var(--ink); border-color: var(--peach); }
.tile--ink { background: var(--text); color: var(--bg); border-color: var(--text); }
.tile a.tile__link::after { content: ''; position: absolute; inset: 0; }
.tile:not(.tile--violet):not(.tile--peach):not(.tile--ink):hover { background: var(--violet-soft); }
.tile__top { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; font-weight: 700; }
.tile__top .place { opacity: .7; font-weight: 500; }
.tile h3 { font-size: clamp(1.4rem, 1.1rem + 1.2vw, 2.1rem); }
.tile--small h3 { font-size: clamp(1.15rem, 1rem + .7vw, 1.5rem); }
.tile__spec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; font-size: .9rem; }
.tile__spec .k { display: block; font-size: .64rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
html[lang="ar"] .tile__spec .k { letter-spacing: 0; font-size: .74rem; }
.tile__spec .v { display: block; font-weight: 700; }
.tile__line { font-size: .9rem; font-weight: 700; }
.tile__num { font-family: var(--display); font-weight: 800; font-size: clamp(3.4rem, 2rem + 5vw, 5.5rem); line-height: .9; letter-spacing: -.04em; }
html[lang="ar"] .tile__num { font-family: var(--display); letter-spacing: 0; line-height: 1.05; }
.tile__sub { font-size: .95rem; line-height: 1.4; opacity: .92; }
.tile__label { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
html[lang="ar"] .tile__label { letter-spacing: 0; font-size: .84rem; }
@media (max-width: 1000px) {
  .tile--large { grid-column: span 6; }
  .tile--small { grid-column: span 6; }
}
@media (max-width: 560px) {
  .tile--large, .tile--small { grid-column: 1 / -1; min-height: 0; }
}

/* Action bar */
.action-bar {
  margin-block-start: 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 16px 22px; background: var(--text); color: var(--bg);
}
.action-bar p { font-size: .98rem; }
.action-bar .row { display: flex; gap: 8px; flex-wrap: wrap; }
.action-bar .btn--ghost { color: var(--bg); border-color: var(--bg); }
.action-bar .btn--ghost:hover { background: var(--bg); color: var(--text); }

/* --- Intakes rail --------------------------------------------------------- */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 1fr); gap: 14px; overflow-x: auto; padding-block-end: 8px; scroll-snap-type: x proximity; }
.rail > * { scroll-snap-align: start; }
@media (min-width: 1100px) { .rail { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; } }

/* --- Subject list --------------------------------------------------------- */
.subject-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
@media (max-width: 560px) { .subject-list { grid-template-columns: 1fr; } }
.subject-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 2px; border-block-end: 1px solid var(--line-soft);
  font-weight: 600; transition: color .12s ease;
}
.subject-row:hover { color: var(--violet); }
.subject-row .n { font-size: .8rem; color: var(--muted); font-weight: 700; flex: none; min-width: 2ch; text-align: end; }

.subject-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(232px, 100%), 1fr)); }
.subject-tile {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 18px; background: var(--surface); border: var(--rule) solid var(--line); font-weight: 600;
}
.subject-tile:hover { background: var(--violet-soft); }
.subject-tile .n { font-size: .8rem; color: var(--muted); font-weight: 700; flex: none; }

/* --- School strip (home) -------------------------------------------------- */
.school-strip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 0 28px; }
.school-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 2px; border-block-end: 1px solid var(--line-soft); }
.school-row:hover .school-row__name { color: var(--violet); }
.school-row__name { font-weight: 700; font-size: .95rem; }
.school-row__meta { font-size: .8rem; color: var(--muted); flex: none; }

/* --- Cards ---------------------------------------------------------------- */
.card-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }

.course-card {
  position: relative; display: flex; flex-direction: column;
  background: var(--surface); border: var(--rule) solid var(--line);
  padding: 18px 18px 16px;
  transition: background-color .16s ease;
}
.course-card:hover { background: var(--violet-soft); }
html[data-theme="dark"] .course-card:hover { background: var(--violet-soft); }
.course-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.course-card__school { position: relative; z-index: 1; font-size: .82rem; font-weight: 700; }
.course-card__school:hover { color: var(--violet); }
.course-card__place { font-size: .8rem; color: var(--muted); margin-block-start: 2px; }
.course-card h3 { font-size: 1.28rem; margin-block: 14px 8px; }
html[lang="ar"] .course-card h3 { font-size: 1.35rem; }
.course-card h3 a::after { content: ''; position: absolute; inset: 0; }
.course-card__summary { font-size: .9rem; color: var(--muted); flex: 1; }
.course-card__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: 6px; flex: 1; align-content: flex-start; }

.spec { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-block-start: 16px; padding-block-start: 14px; border-block-start: 1px solid var(--line-soft); }
.spec__k { display: block; font-size: .64rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
html[lang="ar"] .spec__k { letter-spacing: 0; font-size: .76rem; }
.spec__v { display: block; font-size: .92rem; font-weight: 700; margin-block-start: 2px; }
.spec__v small { display: block; font-size: .74rem; font-weight: 500; color: var(--muted); margin-block-start: 1px; }
.spec__v--price { font-size: 1.08rem; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border: 1px solid var(--line-soft);
  font-size: .76rem; font-weight: 600; color: var(--muted); white-space: nowrap;
}
.pill--brand { background: var(--violet-soft); border-color: transparent; color: var(--violet-strong); }
html[data-theme="dark"] .pill--brand { color: var(--violet); }
.pill--accent { background: var(--peach); border-color: transparent; color: var(--ink); }

.rating { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; font-weight: 600; }
.rating .stars { color: var(--violet); letter-spacing: .06em; }
.rating .count { color: var(--muted); font-weight: 500; }

.save-btn {
  position: relative; z-index: 1;
  display: inline-grid; place-items: center; flex: none;
  width: 34px; height: 34px;
  border: var(--rule) solid var(--line); background: var(--surface); cursor: pointer; color: var(--text);
  transition: background-color .12s ease, color .12s ease;
}
.save-btn:hover { background: var(--text); color: var(--bg); }
.save-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.save-btn[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); color: #fff; }
.save-btn[aria-pressed="true"] svg { fill: currentColor; }

.school-card {
  position: relative; display: flex; flex-direction: column; gap: 8px;
  padding: 22px; background: var(--surface); border: var(--rule) solid var(--line);
  transition: background-color .16s ease;
}
.school-card:hover { background: var(--violet-soft); }
.school-card h3 { font-size: 1.3rem; }
.school-card h3 a::after { content: ''; position: absolute; inset: 0; }
.school-card__place { font-size: .86rem; color: var(--muted); }
.school-card__foot { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: auto; padding-block-start: 14px; }

.list-card {
  position: relative; display: flex; flex-direction: column; gap: 10px;
  padding: 24px; background: var(--surface); border: var(--rule) solid var(--line);
  transition: background-color .16s ease;
}
.list-card:hover { background: var(--peach); color: var(--ink); }
.list-card:hover p, .list-card:hover .list-card__n { color: var(--ink); }
.list-card h3 { font-size: 1.4rem; }
.list-card h3 a::after { content: ''; position: absolute; inset: 0; }
.list-card p { color: var(--muted); font-size: .93rem; }
.list-card__n { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--violet); }
html[lang="ar"] .list-card__n { letter-spacing: 0; font-size: .82rem; }

/* --- Feature grid (KSA block) -------------------------------------------- */
.feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 28px 32px; }
.feature { padding-block-start: 18px; border-block-start: var(--rule) solid color-mix(in srgb, var(--on-ink) 30%, transparent); }
.feature h3 { font-size: 1.2rem; color: var(--on-ink); margin-block-end: 8px; }
.feature p { font-size: .93rem; color: var(--on-ink-muted); }
.feature .link-arrow { margin-block-start: 12px; font-size: .9rem; }

/* --- Catalogue layout ----------------------------------------------------- */
.catalogue { display: grid; grid-template-columns: 280px 1fr; gap: 34px; align-items: start; }
@media (max-width: 900px) { .catalogue { grid-template-columns: 1fr; gap: 18px; } }

.catalogue-search {
  width: 100%; padding: 14px 18px; border: var(--rule) solid var(--line); background: var(--surface); border-radius: 0;
}

.filters {
  position: sticky; inset-block-start: calc(var(--header-h) + 18px);
  background: var(--surface); border: var(--rule) solid var(--line); padding: 18px 20px;
  max-height: calc(100vh - var(--header-h) - 40px); overflow-y: auto;
}
.filters h2 { font-size: 1rem; }
.filters__head { display: flex; align-items: center; justify-content: space-between; margin-block-end: 8px; }
.filter-group { border: 0; padding-block: 16px; border-block-start: 1px solid var(--line-soft); }
.filter-group:first-of-type { border-block-start: 0; padding-block-start: 6px; }
.filter-group > legend, .filter-group > h3 {
  font-family: var(--ui); font-size: .68rem; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  margin-block-end: 10px; padding: 0;
}
html[lang="ar"] .filter-group > legend, html[lang="ar"] .filter-group > h3 { letter-spacing: 0; font-size: .82rem; }
.filter-group fieldset { border: 0; padding: 0; margin: 0; }

.check { display: flex; align-items: flex-start; gap: 9px; padding-block: 6px; font-size: .88rem; line-height: 1.4; cursor: pointer; }
html[lang="ar"] .check { line-height: 1.6; }
.check input { accent-color: var(--violet); width: 16px; height: 16px; flex: none; cursor: pointer; margin-block-start: 2px; }
.check span { flex: 1; }
.check .n { flex: none; color: var(--muted); font-size: .76rem; font-weight: 700; }
.check:hover span { color: var(--violet); }

.range-row { display: flex; align-items: center; justify-content: space-between; font-size: .85rem; font-weight: 700; margin-block-end: 6px; }
input[type="range"] { width: 100%; accent-color: var(--violet); }

.filters-toggle, .filters [data-filters-close], .filters__done { display: none; }
@media (max-width: 900px) {
  .filters [data-filters-close] { display: inline-flex; }
  .filters__done { display: inline-flex; }
  .filters { position: fixed; inset: 0; z-index: 150; border: 0; max-height: none; overflow-y: auto; padding: 20px var(--gutter) 90px; display: none; }
  .filters[data-open] { display: block; }
  .filters__done { position: fixed; inset-inline: var(--gutter); inset-block-end: 18px; }
  .filters-toggle { display: inline-flex; }
}

.results-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-block-end: 18px; }
.results-count { font-weight: 700; }
.results-tools { display: flex; align-items: center; gap: 10px; }
.select { padding: 9px 12px; border: var(--rule) solid var(--line); background: var(--surface); font-size: .88rem; font-weight: 600; cursor: pointer; border-radius: 0; }

.active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-block-end: 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 8px 5px 12px; background: var(--violet-soft); color: var(--violet-strong);
  font-size: .8rem; font-weight: 700; border: 0; cursor: pointer;
}
html[data-theme="dark"] .chip { color: var(--violet); }
html[dir="rtl"] .chip { padding: 5px 12px 5px 8px; }
.chip:hover { background: var(--violet); color: #fff; }
.chip .x { font-size: 1rem; line-height: 1; }

.empty-state { text-align: center; padding: 60px 20px; border: var(--rule) dashed var(--line); }
.empty-state h3 { font-size: 1.3rem; margin-block-end: 8px; }
.empty-state p { color: var(--muted); margin-block-end: 18px; }

/* --- Detail pages (quiet) ------------------------------------------------- */
.breadcrumbs { font-size: .85rem; color: var(--muted); padding-block: 18px 0; }
.breadcrumbs ol { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; }
.breadcrumbs li::after { content: '/'; margin-inline-start: 8px; color: var(--line-soft); }
.breadcrumbs li:last-child::after { content: none; }
.breadcrumbs a:hover { color: var(--violet); }

.detail { display: grid; grid-template-columns: 1fr 360px; gap: 44px; align-items: start; }
@media (max-width: 940px) { .detail { grid-template-columns: 1fr; gap: 28px; } }

.detail-head { padding-block: 26px 30px; }
.detail-head h1 { font-size: var(--step-3); margin-block: 12px 14px; max-width: 24ch; line-height: 1; }
html[lang="ar"] .detail-head h1 { line-height: 1.25; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 16px; }

.detail-body h2 { font-size: 1.5rem; margin-block: 34px 12px; }
.detail-body h2:first-child { margin-block-start: 0; }
.detail-body p { color: var(--muted); }
.detail-body ul.ticks { list-style: none; padding: 0; display: grid; gap: 10px; }
.detail-body ul.ticks li { display: flex; gap: 11px; align-items: flex-start; }
.detail-body ul.ticks li::before { content: ''; flex: none; margin-block-start: 8px; width: 10px; height: 2px; background: var(--violet); }

.booking-card {
  position: sticky; inset-block-start: calc(var(--header-h) + 18px);
  background: var(--surface); border: var(--rule) solid var(--line); padding: 24px;
}
.booking-card .price { font-family: var(--display); font-size: 2.3rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
html[lang="ar"] .booking-card .price { font-family: var(--ui); font-size: 1.9rem; letter-spacing: 0; }
.booking-card .price-note { font-size: .8rem; color: var(--muted); margin-block-start: 6px; }
.fact-list { list-style: none; padding: 0; margin-block: 20px; display: grid; gap: 12px; }
.fact-list li { display: flex; justify-content: space-between; gap: 14px; font-size: .9rem; padding-block-end: 12px; border-block-end: 1px solid var(--line-soft); }
.fact-list li:last-child { border-block-end: 0; padding-block-end: 0; }
.fact-list dt, .fact-list .k { color: var(--muted); }
.fact-list .v { font-weight: 700; text-align: end; }
.fact-list .v small { display: block; font-weight: 400; color: var(--muted); font-size: .78rem; }
.booking-card .btn + .btn { margin-block-start: 10px; }

.school-strip {
  display: flex; gap: 16px; align-items: center; padding: 20px;
  background: var(--surface); border: var(--rule) solid var(--line); margin-block-start: 34px; flex-wrap: wrap;
}
.school-strip__body { flex: 1; min-width: 200px; }
.school-strip h3 { font-size: 1.15rem; }
.school-strip p { font-size: .88rem; color: var(--muted); margin-block-start: 4px; }

/* --- Shortlist drawer ----------------------------------------------------- */
.drawer-backdrop { position: fixed; inset: 0; z-index: 180; background: rgba(22, 19, 43, .5); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.drawer-backdrop[data-open] { opacity: 1; pointer-events: auto; }
.drawer {
  --drawer-closed: translateX(100%);
  position: fixed; z-index: 190; inset-block: 0; inset-inline-end: 0;
  width: min(420px, 100%);
  background: var(--surface); border-inline-start: var(--rule) solid var(--line);
  display: flex; flex-direction: column;
  transform: var(--drawer-closed); visibility: hidden;
  transition: transform .24s cubic-bezier(.32, .72, 0, 1), visibility 0s linear .24s;
}
html[dir="rtl"] .drawer { --drawer-closed: translateX(-100%); }
.drawer[data-open] { transform: translateX(0); visibility: visible; transition-delay: 0s; }
.drawer__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px; border-block-end: var(--rule) solid var(--line); }
.drawer__body { flex: 1; overflow-y: auto; padding: 16px 20px; }
.drawer__foot { padding: 16px 20px; border-block-start: var(--rule) solid var(--line); }
.drawer-item { display: flex; gap: 12px; padding-block: 14px; border-block-end: 1px solid var(--line-soft); }
.drawer-item:last-child { border-block-end: 0; }
.drawer-item__body { flex: 1; }
.drawer-item h4 { font-size: 1rem; }
.drawer-item p { font-size: .82rem; color: var(--muted); }
.drawer-item button { background: none; border: 0; color: var(--muted); font-size: .8rem; font-weight: 700; cursor: pointer; padding: 0; }
.drawer-item button:hover { color: var(--violet); }

/* --- Editorial blocks ----------------------------------------------------- */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 5vw, 64px); align-items: center; }
.split--wide { grid-template-columns: 1fr 1.4fr; align-items: start; }
@media (max-width: 860px) { .split, .split--wide { grid-template-columns: 1fr; } }

.quote { border-inline-start: var(--rule) solid var(--violet); padding-inline-start: 22px; font-family: var(--display); font-size: 1.3rem; line-height: 1.4; font-weight: 600; }
.quote footer { font-family: var(--ui); font-size: .86rem; color: var(--muted); margin-block-start: 10px; font-weight: 600; }

.step-list { list-style: none; padding: 0; display: grid; gap: 18px; }
.step-list li { display: flex; gap: 16px; padding-block-start: 14px; border-block-start: 1px solid var(--line-soft); }
.step-list li::before { content: ''; flex: none; width: 18px; height: 2px; margin-block-start: 12px; background: var(--violet); }
.step-list h3 { font-size: 1.05rem; margin-block-end: 3px; }
.step-list p { color: var(--muted); font-size: .92rem; }

.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; background: var(--violet-soft); border: var(--rule) solid var(--violet); font-size: .88rem; }
.notice strong { display: block; }

/* --- Forms ---------------------------------------------------------------- */
.form-grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
.form-card { background: var(--surface); border: var(--rule) solid var(--line); padding: 26px; }
.form-grid > *, .split > *, .catalogue > *, .field-block > * { min-width: 0; }
.field-block select { max-width: 100%; text-overflow: ellipsis; }
.field-block { display: flex; flex-direction: column; gap: 6px; }
.field-block--wide { grid-column: 1 / -1; }
.field-block label { font-size: .85rem; font-weight: 700; }
.field-block input, .field-block select, .field-block textarea {
  padding: 11px 13px; border: var(--rule) solid var(--line-soft); background: var(--surface); border-radius: 0;
  transition: border-color .12s ease;
}
.field-block input:focus, .field-block select:focus, .field-block textarea:focus { outline: none; border-color: var(--violet); }
.field-block textarea { min-height: 130px; resize: vertical; }
.form-note { font-size: .82rem; color: var(--muted); }
.channel-row { display: flex; flex-wrap: wrap; gap: 10px; margin-block-start: 22px; }

/* --- Floating WhatsApp ---------------------------------------------------- */
.wa-float {
  position: fixed; z-index: 120; inset-block-end: 18px; inset-inline-end: 18px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 16px; background: var(--wa); color: #06371c; font-weight: 700; font-size: .9rem;
  border: var(--rule) solid #06371c;
}
.wa-float svg { width: 20px; height: 20px; }
.wa-float:hover { background: #1fbf5a; }

/* --- Footer --------------------------------------------------------------- */
.site-footer { margin-block-start: clamp(48px, 7vw, 90px); background: var(--text); color: var(--bg); padding-block: 56px 28px; }
.site-footer .brand-kufi { color: var(--peach); }
.site-footer .brand-name { color: var(--bg); }
.footer-grid { display: grid; grid-template-columns: 1.7fr repeat(3, 1fr); gap: 34px; }
@media (max-width: 860px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .footer-grid { grid-template-columns: 1fr; } }
.footer-grid h3 { font-family: var(--ui); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--on-ink-muted); margin-block-end: 14px; }
html[lang="ar"] .footer-grid h3 { letter-spacing: 0; font-size: .84rem; }
.footer-grid ul { list-style: none; padding: 0; display: grid; gap: 9px; font-size: .92rem; }
.footer-grid a:hover { color: var(--peach); }
.footer-blurb { color: var(--on-ink-muted); font-size: .92rem; max-width: 40ch; margin-block-start: 12px; }
.footer-advisor__h { margin-block-start: 22px; }
.footer-advisor { gap: 6px !important; }
.contact-row { display: flex; gap: 10px; align-items: baseline; }
.contact-row__k { color: var(--on-ink-muted); font-size: .82rem; min-width: 5.5ch; }
.contact-row__v { font-weight: 700; }
.footer-hours { font-size: .8rem; color: var(--on-ink-muted); margin-block-start: 8px; }
.footer-bottom {
  display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between;
  margin-block-start: 44px; padding-block-start: 20px;
  border-block-start: 1px solid color-mix(in srgb, var(--bg) 25%, transparent);
  font-size: .82rem; color: var(--on-ink-muted);
}
.footer-source { max-width: 62ch; }

/* --- Reveal on scroll (one orchestrated move) ----------------------------- */
@media (prefers-reduced-motion: no-preference) {
  [data-reveal] { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
  [data-reveal].is-in { opacity: 1; transform: none; }
  .tiles > .tile:nth-child(2) { transition-delay: .08s; }
  .tiles > .tile:nth-child(3) { transition-delay: .16s; }
  .tiles > .tile:nth-child(4) { transition-delay: .24s; }
  .tiles > .tile:nth-child(5) { transition-delay: .3s; }
  .tiles > .tile:nth-child(6) { transition-delay: .36s; }
  .tiles > .tile:nth-child(7) { transition-delay: .42s; }
}

  .drawer, .drawer-backdrop, .course-card, .school-card, .list-card, .tile, .btn { transition: none; }

<script>
  /* Locale and theme are decided before anything renders: i18n.js reads
     <html lang> at load, and a late theme switch would flash the page. */
  (function () {
    var lang = 'en', theme = null;
    try {
      lang = localStorage.getItem('masar:lang') === 'ar' ? 'ar' : 'en';
      theme = localStorage.getItem('masar:theme');
    } catch (e) {}
    if (!theme) {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    var root = document.documentElement;
    root.setAttribute('lang', lang);
    root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    root.setAttribute('data-theme', theme);
  })();
</script>

tion--sea\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">For buyers in the Kingdom<\/span>\n            <h2 class=\"h2\">Built for how executive education is actually bought here.<\/h2>\n          <\/div>\n        <\/div>\n        <div class=\"feature-grid\">\n          <div class=\"feature\">\n            <h3>Riyals, or the school's own currency<\/h3>\n            <p>Every fee is shown exactly as the school publishes it, and switches to riyals in one click. No hidden pricing, no account to open.<\/p>\n          <\/div>\n          <div class=\"feature\">\n            <h3>Hijri and Gregorian dates<\/h3>\n            <p>Start dates on every programme in both calendars, so a cohort can be checked against Ramadan, Eid and the fiscal year at a glance.<\/p>\n          <\/div>\n          <div class=\"feature\">\n            <h3>An advisor, not a lead form<\/h3>\n            <p>Ask in Arabic or English and get a reply within two working days, Sunday to Thursday. Your details go to the school you choose, and nowhere else.<\/p>\n            <a class=\"link-arrow link-arrow--light\" href=\"contact.html\">Talk to an advisor <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n          <div class=\"feature\">\n            <h3>Cohorts for organisations<\/h3>\n            <p>Enrolling a team or a leadership bench? Request a proposal for a group booking or a closed cohort delivered to your calendar.<\/p>\n            <a class=\"link-arrow link-arrow--light\" href=\"contact.html#corporate\">Request a proposal <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">The schools<\/span>\n            <h2 class=\"h2\">Named, not \"world-class\".<\/h2>\n torial, and say so.<\/p><\/div><\/li>\n          <li><div><h3>Straight to the school<\/h3><p>An enquiry goes to the institution running the programme. Your details are not resold.<\/p><\/div><\/li>\n        <\/ol>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"hero\">\n      <div class=\"container\">\n        <div class=\"hero-grid\">\n          <div class=\"hero-copy\">\n            <h1>تعلّم ما يتطلّبه <span class=\"tint\">العقد القادم<\/span> من القيادة.<\/h1>\n          <\/div>\n          <div class=\"hero-side\">\n            <p>برامج مكثّفة من إم آي تي سلون، وآي إم دي، وكيلوغ، وكلية كينيدي في هارفارد واثنتي عشرة كلية أخرى —\n              <span data-stat=\"courses\">189<\/span> برنامجًا، مع الرسوم والمدينة والتواريخ على كل بطاقة.\n              بالريال أو بعملة الكلية.<\/p>\n            <p class=\"tag\" lang=\"en\" dir=\"ltr\">Real fees. Real dates.<\/p>\n          <\/div>\n        <\/div>\n\n        <form class=\"hero-search\" action=\"courses.html\" method=\"get\" role=\"search\">\n          <div class=\"field\">\n            <label for=\"q\">البحث<\/label>\n            <input id=\"q\" name=\"q\" type=\"search\" placeholder=\"برنامج أو تخصّص أو كلية\" autocomplete=\"off\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"subject\">التخصّص<\/label>\n            <select id=\"subject\" name=\"subject\" data-hero-subject><\/select>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"format\">نمط الدراسة<\/label>\n            <select id=\"format\" name=\"format\" data-hero-format><\/select>\n          <\/div>\n          <button class=\"btn btn--primary\" type=\"submit\">ابحث<\/button>\n        <\/form>\n\n        <nav class=\"ambitions\" aria-label=\"استكشف حسب طموحك\">\n          <a class=\"ambition\" href=\"courses.html?subject=leadership\">كن قائدًا أفضل <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <a class=\"ambition\" href=\"courses.html?subject=digital\">أتقن استراتيجية الذكاء الاصطناعي <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <a class=\"ambition\" href=\"courses.html?q=chief\">انتقل إلى الصف القيادي الأول <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <a class=\"ambition\" href=\"courses.html?subject=finance\">افهم التمويل <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <a class=\"ambition\" href=\"courses.html?subject=entrepreneurship\">ابنِ مشروعًا جديدًا <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <a class=\"ambition\" href=\"courses.html?subject=negotiation\">تفاوض بشكل أفضل <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/nav>\n\n        <div class=\"tiles\" data-home-tiles><\/div>\n\n        <div class=\"action-bar\">\n          <p>اسأل بالعربية أو الإنجليزية — ستصلك الإجابة خلال يومَي عمل، من الأحد إلى الخميس.<\/p>\n          <div class=\"row\"><a class=\"btn btn--ghost\" href=\"contact.html\">اطلب اتصالًا<\/a><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">أقرب الدفعات<\/span>\n            <h2 class=\"h2\">الأقرب بدءًا<\/h2>\n            <p>مرتّبة حسب تاريخ البدء. تحمل كل بطاقة الرسوم وعدد أيام التدريس ولغة التدريس.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"courses.html?sort=date\">التقويم الكامل <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-upcoming><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--alt\">\n      <div class=\"container split split--wide\">\n        <div>\n          <span class=\"eyebrow\">حسب التخصّص<\/span>\n          <h2 class=\"h2\">ابدأ ممّا تحتاج إليه لتقود.<\/h2>\n          <p class=\"lede\" style=\"margin-block-start:14px\">اثنا عشر مجالًا، من حوكمة مجالس الإدارة إلى الذكاء الاصطناعي. الأعداد محدّثة باستمرار.<\/p>\n        <\/div>\n        <div class=\"subject-list\" data-home-subjects><\/div>\n      <\/div>\n    <\/section>\n\n\n    <section class=\"section section--sea\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">لمن يشتري في المملكة<\/span>\n            <h2 class=\"h2\">مبني على الطريقة التي يُشترى بها التعليم التنفيذي فعلًا.<\/h2>\n          <\/div>\n        <\/div>\n        <div class=\"feature-grid\">\n          <div class=\"feature\">\n            <h3>بالريال، أو بعملة الكلية<\/h3>\n            <p>تُعرض كل الرسوم كما تنشرها الكلية تمامًا، وتتحوّل إلى الريال بنقرة واحدة. لا أسعار مخفية، ولا حساب يلزم فتحه.<\/p>\n          <\/div>\n          <div class=\"feature\">\n            <h3>التاريخان الهجري والميلادي<\/h3>\n            <p>مواعيد البدء على كل برنامج بالتقويمين، ليسهل التحقّق من موقع الدفعة من رمضان والأعياد والسنة المالية بنظرة واحدة.<\/p>\n          <\/div>\n          <div class=\"feature\">\n            <h3>مستشار، لا نموذج لجمع البيانات<\/h3>\n            <p>اسأل بالعربية أو الإنجليزية وستصلك الإجابة خلال يومَي عمل، من الأحد إلى الخميس. تذهب بياناتك إلى الكلية التي تختارها، ولا إلى أي جهة أخرى.<\/p>\n            <a class=\"link-arrow link-arrow--light\" href=\"contact.html\">تحدّث مع مستشار <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n          <div class=\"feature\">\n            <h3>دفعات للمنشآت<\/h3>\n            <p>تسجّل فريقًا أو صفًّا قياديًا كاملًا؟ اطلب عرضًا لحجز جماعي أو لدفعة مغلقة تُقدَّم وفق تقويم منشأتك.<\/p>\n            <a class=\"link-arrow link-arrow--light\" href=\"contact.html#corporate\">اطلب عرضًا <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">الكليات<\/span>\n            <h2 class=\"h2\">بأسمائها، لا بعبارات التفخيم.<\/h2>\n            <p>كل مؤسسة في الدليل، مع المدينة التي تدرّس منها وعدد برامجها المدرجة.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"schools.html\">كل الكليات <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"school-strip-grid\" data-home-schools><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--alt\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">مجموعات<\/span>\n            <h2 class=\"h2\">إجابات عن الأسئلة التي يأتي بها الزوّار<\/h2>\n            <p>اختيارات تحريرية لا تصنيفات. لم يُمنح أي برنامج درجة من مئة.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"lists.html\">كل المجموعات <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-lists><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container split\">\n        <div>\n          <span class=\"eyebrow\">كيف تصل البرامج إلى هنا<\/span>\n          <h2 class=\"h2\">وقائع من الكليات. لا شيء مختلَق.<\/h2>\n          <p class=\"lede\" style=\"margin-block-start:14px\">يقرأ «مسار» صفحات البرامج التي تنشرها الكليات ويسجّل ما تقوله: العنوان والتواريخ وأيام التدريس ونمط الدراسة واللغة والرسوم. هذا كل ما تعرضه البطاقة، وكل ما تدّعيه.<\/p>\n        <\/div>\n        <ol class=\"step-list\">\n          <li><div><h3>من المصدر مباشرة<\/h3><p>تُؤخذ البرامج من التقويم المنشور لكل كلية وتُحدَّث دوريًا.<\/p><\/div><\/li>\n          <li><div><h3>لا تقييمات لم نستحقّها<\/h3><p>لا تحمل البرامج المستوردة نجومًا ولا شهادات ولا نصوصًا تسويقية. ما لم تذكره الكلية لا تذكره البطاقة.<\/p><\/div><\/li>\n          <li><div><h3>لا إدراج مدفوع<\/h3><p>الموضع في هذا الموقع غير معروض للبيع. والمجموعات تحريرية، وتقول ذلك صراحة.<\/p><\/div><\/li>\n          <li><div><h3>إلى الكلية مباشرة<\/h3><p>يذهب الاستفسار إلى المؤسسة التي تقدّم البرنامج، ولا يُعاد بيع بياناتك.<\/p><\/div><\/li>\n        <\/ol>\n      <\/div>\n    <\/section>\n  "}, "courses.html": {"en": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">The index<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">Executive programmes<\/h1>\n        <p class=\"lede\">Every programme in the index, with the fee, teaching days, start date and language of\n          instruction on the card. Filters live in the address bar, so a shortlist is a link you can forward\n          for approval.<\/p>\n\n        <form role=\"search\" style=\"margin-block-start:24px;max-width:560px\">\n          <label class=\"sr-only\" for=\"cat-q\">Search programmes<\/label>\n          <input id=\"cat-q\" type=\"search\" data-catalogue-search placeholder=\"Programme, subject or school\" class=\"catalogue-search\">\n        <\/form>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\" style=\"padding-block-start:8px\">\n      <div class=\"container catalogue\">\n        <aside class=\"filters\" data-filters aria-label=\"Filters\">\n          <div class=\"filters__head\">\n            <h2>Refine<\/h2>\n            <button class=\"btn btn--sm btn--ghost\" type=\"button\" data-filters-close>Done<\/button>\n          <\/div>\n          <div data-filter-body><\/div>\n          <button class=\"btn btn--primary btn--block filters__done\" type=\"button\" data-filters-close>Show results<\/button>\n        <\/aside>\n\n        <div>\n          <div class=\"results-bar\">\n            <p class=\"results-count\" data-results-count aria-live=\"polite\">—<\/p>\n            <div class=\"results-tools\">\n              <button class=\"btn btn--ghost btn--sm filters-toggle\" type=\"button\" data-filters-open>Filters<\/button>\n              <label class=\"sr-only\" for=\"sort\">Sort by<\/label>\n              <select class=\ on>\n        <\/aside>\n\n        <div>\n          <div class=\"results-bar\">\n            <p class=\"results-count\" data-results-count aria-live=\"polite\">—<\/p>\n            <div class=\"results-tools\">\n              <button class=\"btn btn--ghost btn--sm filters-toggle\" type=\"button\" data-filters-open>التصفية<\/button>\n              <label class=\"sr-only\" for=\"sort\">ترتيب النتائج<\/label>\n              <select class=\"select\" id=\"sort\" data-sort>\n                <option value=\"date\">الأقرب بدءًا<\/option>\n                <option value=\"popular\">الأكثر رواجًا<\/option>\n                <option value=\"rating\">الأعلى تقييمًا<\/option>\n                <option value=\"priceAsc\">الرسوم: من الأقل<\/option>\n                <option value=\"priceDesc\">الرسوم: من الأعلى<\/option>\n              <\/select>\n            <\/div>\n          <\/div>\n          <div class=\"active-filters\" data-active-filters><\/div>\n          <div class=\"card-grid\" data-results><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  "}, "course.html": {"en": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <ol>\n          <li><a href=\"index.html\">Home<\/a><\/li>\n          <li><a href=\"courses.html\">Courses<\/a><\/li>\n          <li aria-current=\"page\" data-course-crumb>Course<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <div class=\"container\" data-course-detail><\/div>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\"><h2 class=\"h2\">Similar programmes<\/h2><\/div>\n        <div class=\"card-grid\" data-similar><\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"مسار التنقّل\">\n        <ol>\n          <li><a href=\"index.html\">الرئيسية<\/a><\/li>\n          <li><a href=\"courses.html\">البرامج<\/a><\/li>\n          <li aria-current=\"page\" data-course-crumb>البرنامج<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <div class=\"container\" data-course-detail><\/div>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\"><h2 class=\"h2\">برامج مشابهة<\/h2><\/div>\n        <div class=\"card-grid\" data-similar><\/div>\n      <\/div>\n    <\/section>\n  "}, "schools.html": {"en": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">Institutions<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">Business schools<\/h1>\n        <p class=\"lede\">Every institution with programmes in the index, with the city it teaches from and\n          what it lists — not a paragraph of marketing copy.<\/p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-block-start:22px\" data-region-filter><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-schools><\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">المؤسسات<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">كليات إدارة الأعمال<\/h1>\n        <p class=\"lede\">كل كلية لها برامج في الدليل، ومعها ما تشتهر به فعلًا — لا فقرة من العبارات التسويقية.<\/p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-block-start:22px\" data-region-filter><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-schools><\/div>\n      <\/div>\n    <\/section>\n  "}, "school.html": {"en": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <ol>\n          <li><a href=\"index.html\">Home<\/a><\/li>\n          <li><a href=\"schools.html\">Schools<\/a><\/li>\n          <li aria-current=\"page\" data-school-crumb>School<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-school-detail><\/div>\n    <\/section>\n  ", "ar": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"مسار التنقّل\">\n        <ol>\n          <li><a href=\"index.html\">الرئيسية<\/a><\/li>\n          <li><a href=\"schools.html\">الكليات<\/a><\/li>\n          <li aria-current=\"page\" data-school-crumb>الكلية<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-school-detail><\/div>\n    <\/section>\n  "}, "lists.html": {"en": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">Collections<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">Editors' shortlists<\/h1>\n        <p class=\"lede\">The questions people arrive with, each answered with a handful of programmes.\n          Editorial selections, not a ranking — nobody scored anything out of a hundred.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-lists><\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">مجموعات<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">اختيارات فريق التحرير<\/h1>\n        <p class=\"lede\">الأسئلة التي يأتي بها الزوّار عادةً، يجيب عن كلٍّ منها عدد محدود من البرامج.\n          اختيارات تحريرية لا تصنيفات — لم يُمنح أي برنامج درجة من مئة.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-lists><\/div>\n      <\/div>\n    <\/section>\n  "}, "list.html": {"en": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <ol>\n          <li><a href=\"index.html\">Home<\/a><\/li>\n          <li><a href=\"lists.html\">Collections<\/a><\/li>\n          <li aria-current=\"page\" data-list-crumb>Collection<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-list-detail><\/div>\n    <\/section>\n  ", "ar": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"مسار التنقّل\">\n        <ol>\n          <li><a href=\"index.html\">الرئيسية<\/a><\/li>\n          <li><a href=\"lists.html\">المجموعات<\/a><\/li>\n          <li aria-current=\"page\" data-list-crumb>المجموعة<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-list-detail><\/div>\n    <\/section>\n  "}, "about.html": {"en": "\n\n    <section class=\"section\">\n      <div class=\"container\" style=\"max-width:760px\">\n        <span class=\"eyebrow\">About Masar<\/span>\n        <h1 class=\"display\" style=\"margin-block:12px 18px\">An index of executive programmes, built the honest way round.<\/h1>\n        <p class=\"lede\">Choosing an executive programme usually means directories that rank whoever paid most,\n          hide the fee until you hand over a phone number, and have no Arabic version worth the name.\n          Masar (<span lang=\"ar\">مسار<\/span>, \"the path\") was built in Riyadh to be the opposite.<\/p>\n\n        <div class=\"prose\" style=\"margin-block-start:32px\">\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">What is here<\/h2>\n          <p class=\"muted\">Open-enrolment executive programmes from business schools around the world —\n            MIT Sloan, IMD, Kellogg, Harvard Kennedy School, Berkeley Haas, Queen's Smith, UBC Sauder, AGSM,\n            Copenhagen Business School, St. Gallen and others — each with its dates, teaching days, format,\n            language of instruction and fee. Everything is visible without an account, and any filtered view\n            is a link you can forward.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">Where the data comes from<\/h2>\n          <p class=\"muted\">From the schools themselves. Masar reads each institution's published programme\n            pages and records the facts they state. Nothing is paraphrased from a school's marketing copy,\n            no rating is invented, and a programme with no published fee is left out rather than guessed.\n            Fees appear in the currency the school publishes; the riyal figure is an indicative conversion\n            with the rate date shown.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">How programmes are selected<\/h2>\n          <p class=\"muted\">Editorially. Position in the index or in a collection is never for sale and there\n            is no paid tier. Collections are labelled as editorial selections rather than rankings, because\n            scoring a four-day negotiation programme out of a hundred would be an invention.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">Arabic, properly<\/h2>\n          <p class=\"muted\">The Arabic site is not the English site passed through a translation engine.\n            It is written copy, a right-to-left layout built from the same stylesheet, correct Arabic plural\n            forms, Hijri dates alongside Gregorian, and localised numbers. Both languages read from one\n            catalogue, so a programme cannot exist in one and quietly vanish in the other.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">Privacy<\/h2>\n          <p class=\"muted\">No tracking script, no analytics. Your shortlist lives in your own browser and\n            never leaves it. An enquiry goes to the school running the programme and is not resold.<\/p>\n        <\/div>\n\n        <div style=\"margin-block-start:34px;display:flex;gap:12px;flex-wrap:wrap\">\n          <a class=\"btn btn--primary\" href=\"courses.html\">Browse the index<\/a>\n          <a class=\"btn btn--ghost\" href=\"contact.html\">Talk to an advisor<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section\">\n      <div class=\"container\" style=\"max-width:760px\">\n        <span class=\"eyebrow\">عن مسار<\/span>\n        <h1 class=\"display\" style=\"margin-block:12px 18px\">دليل للبرامج التنفيذية، مبني بالطريقة الصادقة.<\/h1>\n        <p class=\"lede\">اختيار برنامج تنفيذي يعني عادةً أدلّة تُصدِّر من يدفع أكثر، وتُخفي الرسوم حتى تترك رقم هاتفك،\n          وليس لها نسخة عربية تستحق هذا الاسم. بُني «مسار» في الرياض ليكون النقيض.<\/p>\n\n        <div class=\"prose\" style=\"margin-block-start:32px\">\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">ما الذي تجده هنا<\/h2>\n          <p class=\"muted\">برامج تنفيذية مفتوحة التسجيل من كليات الأعمال حول العالم — إم آي تي سلون، وآي إم دي، وكيلوغ،\n            وكلية كينيدي في هارفارد، وهاس في بيركلي، وسميث في جامعة كوينز، وساودر في جامعة بريتيش كولومبيا،\n            وكلية كوبنهاغن للأعمال، وسانت غالن وغيرها — لكلٍّ منها تواريخه وأيام تدريسه ونمط دراسته ولغة التدريس والرسوم.\n            كل شيء ظاهر دون حساب، وأي نتيجة مصفّاة رابط يمكن تمريره.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">من أين تأتي البيانات<\/h2>\n          <p class=\"muted\">من الكليات نفسها. يقرأ «مسار» صفحات البرامج المنشورة لكل مؤسسة ويسجّل الوقائع التي تذكرها.\n            لا يُعاد صياغة أي نص تسويقي، ولا يُختلق أي تقييم، والبرنامج الذي لم تُنشر رسومه يُستبعد ولا يُخمَّن.\n            تظهر الرسوم بالعملة التي تنشرها الكلية، ومبلغ الريال تحويل استرشادي مع تاريخ سعر الصرف.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">كيف تُختار البرامج<\/h2>\n          <p class=\"muted\">تحريريًا. الموضع في الدليل أو في أي مجموعة غير معروض للبيع، ولا توجد فئة مدفوعة.\n            وُصفت المجموعات بأنها اختيارات تحريرية لا تصنيفات، لأن منح برنامج تفاوض مدّته أربعة أيام درجةً من مئة سيكون اختلاقًا.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">العربية كما ينبغي<\/h2>\n          <p class=\"muted\">النسخة العربية ليست النسخة الإنجليزية بعد تمريرها على محرّك ترجمة. هي نصوص مكتوبة، وتخطيط\n            من اليمين إلى اليسار مبني من ملف التنسيق نفسه، وصيغ جمع عربية صحيحة، وتواريخ هجرية إلى جانب الميلادية، وأرقام موطّنة.\n            تقرأ اللغتان من دليل واحد، فلا يمكن أن يوجد برنامج بلغة ويختفي بهدوء في الأخرى.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">الخصوصية<\/h2>\n          <p class=\"muted\">لا برامج تتبّع ولا تحليلات. تعيش قائمتك المختارة في متصفّحك ولا تغادره.\n            يذهب الاستفسار إلى الكلية التي تقدّم البرنامج ولا يُعاد بيعه.<\/p>\n        <\/div>\n\n        <div style=\"margin-block-start:34px;display:flex;gap:12px;flex-wrap:wrap\">\n          <a class=\"btn btn--primary\" href=\"courses.html\">تصفّح الدليل<\/a>\n          <a class=\"btn btn--ghost\" href=\"contact.html\">تحدّث مع مستشار<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n  "}, "contact.html": {"en": "\n\n    <section class=\"section\">\n      <div class=\"container split\" style=\"align-items:start\">\n        <div>\n          <span class=\"eyebrow\">Contact<\/span>\n          <h1 class=\"h2\" style=\"margin-block:12px 16px\">Talk to an advisor<\/h1>\n          <p class=\"lede\">Tell us which programme you are weighing and what you need to know — dates,\n            fees, whether it suits your level, how to get it approved. We reply within two working days,\n            Sunday to Thursday, in Arabic or English. Your details go to the school you choose and nowhere else.<\/p>\n          \n\n          <h2 class=\"h3\" id=\"corporate\" style=\"margin-block:34px 12px\">For organisations<\/h2>\n          <p class=\"muted\">Enrolling a team, a leadership bench or a full closed cohort? Say how many people\n            and which subjects, and we will come back with options, group terms and a proposal you can\n            forward internally.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:34px 12px\">Listing a programme<\/h2>\n          <p class=\"muted\">Schools can propose a programme for the index at no cost. Inclusion is an editorial\n            decision and position is never for sale.<\/p>\n        <\/div>\n\n        <form class=\"form-grid form-card\" data-contact-form novalidate>\n          <div class=\"field-block\">\n            <label for=\"name\">Your name<\/label>\n            <input id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\" required>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"org\">Organisation<\/label>\n            <input id=\"org\" name=\"organisation\" type=\"text\" autocomplete=\"organization\">\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"phone\">Mobile<\/label>\n            <input id=\"phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\" dir=\"ltr\" placeholder=\"+966\">\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"email\">Email<\/label>\n            <input id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <label for=\"course\">Programme you are asking about<\/label>\n            <select id=\"course\" name=\"course\" data-course-select><\/select>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"size\">Who is enrolling<\/label>\n            <select id=\"size\" name=\"group\">\n              <option value=\"1\">Just me<\/option>\n              <option value=\"2-5\">A team of 2–5<\/option>\n              <option value=\"6+\">6 or more / closed cohort<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"lang\">Reply in<\/label>\n            <select id=\"lang\" name=\"reply_language\">\n              <option value=\"en\">English<\/option>\n              <option value=\"ar\">Arabic<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <label for=\"message\">Your question<\/label>\n            <textarea id=\"message\" name=\"message\" required><\/textarea>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <button class=\"btn btn--primary\" type=\"submit\">Send enquiry<\/button>\n            <p class=\"form-note\" style=\"margin-block-start:10px\">Two working days, Sunday to Thursday, Riyadh time.<\/p>\n            <p class=\"notice\" data-form-status tabindex=\"-1\" hidden style=\"margin-block-start:14px\">\n              <span><strong>This form is not connected yet.<\/strong> Please use the contact channels on this page.<\/span>\n            <\/p>\n          <\/div>\n        <\/form>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section\">\n      <div class=\"container split\" style=\"align-items:start\">\n        <div>\n          <span class=\"eyebrow\">تواصل معنا<\/span>\n          <h1 class=\"h2\" style=\"margin-block:12px 16px\">تحدّث مع مستشار<\/h1>\n          <p class=\"lede\">أخبرنا بالبرنامج الذي تفاضل بينه وبين غيره وبما تريد معرفته — المواعيد والرسوم ومدى ملاءمته\n            لمستواك وكيفية اعتماده. نردّ خلال يومَي عمل، من الأحد إلى الخميس، بالعربية أو الإنجليزية.\n            تذهب بياناتك إلى الكلية التي تختارها ولا إلى أي جهة أخرى.<\/p>\n          \n\n          <h2 class=\"h3\" id=\"corporate\" style=\"margin-block:34px 12px\">للمنشآت<\/h2>\n          <p class=\"muted\">تسجّل فريقًا أو صفًّا قياديًا أو دفعة مغلقة كاملة؟ اذكر عدد المشاركين والمجالات المطلوبة،\n            وسنعود إليك بالخيارات وشروط الحجز الجماعي وعرض يمكن تمريره داخل منشأتك.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:34px 12px\">إدراج برنامج<\/h2>\n          <p class=\"muted\">يمكن للكليات اقتراح برنامج لإدراجه في الدليل مجانًا. الإدراج قرار تحريري، والموضع غير معروض للبيع.<\/p>\n        <\/div>\n\n        <form class=\"form-grid form-card\" data-contact-form novalidate>\n          <div class=\"field-block\">\n            <label for=\"name\">الاسم<\/label>\n            <input id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\" required>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"org\">المنشأة<\/label>\n            <input id=\"org\" name=\"organisation\" type=\"text\" autocomplete=\"organization\">\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"phone\">الجوال<\/label>\n            <input id=\"phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\" dir=\"ltr\" placeholder=\"+966\">\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"email\">البريد الإلكتروني<\/label>\n            <input id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <label for=\"course\">البرنامج محلّ الاستفسار<\/label>\n            <select id=\"course\" name=\"course\" data-course-select><\/select>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"size\">من سيلتحق<\/label>\n            <select id=\"size\" name=\"group\">\n              <option value=\"1\">أنا فقط<\/option>\n              <option value=\"2-5\">فريق من 2 إلى 5<\/option>\n              <option value=\"6+\">6 فأكثر / دفعة مغلقة<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"lang\">لغة الردّ<\/label>\n            <select id=\"lang\" name=\"reply_language\">\n              <option value=\"ar\">العربية<\/option>\n              <option value=\"en\">الإنجليزية<\
