/* ==========================================================================
   Masar — site.css
   One stylesheet for both locales. Everything directional is written with CSS
   logical properties (inline-start/end rather than left/right), so the Arabic
   RTL layout is the same code path as the English one. The handful of things
   logical properties cannot express (glyph direction, gradient angles) are
   collected under [dir="rtl"] at the bottom.

   Identity: "the considered route". Deep Sea ink and Rawashin teal (the
   painted lattice balconies of Jeddah's Al-Balad) on a cool salt-white
   ground, one warm coral note kept scarce. IBM Plex Sans / Plex Sans Arabic
   for everything read; IBM Plex Serif and Markazi Text for what is said
   loudly. Square corners, hairlines, tabular numerals.
   ========================================================================== */

/* --- Tokens --------------------------------------------------------------- */
:root {
  color-scheme: light dark;

  --sea:          #0F3642;   /* ink and dark surfaces */
  --sea-deep:     #0A2730;
  --brand:        #1C7C86;   /* interactive: links, buttons, focus */
  --brand-strong: #14606A;
  --brand-soft:   #E1EFF0;
  --accent:       #D9775F;   /* coral stone — scarce */
  --accent-soft:  #FBEBE5;

  --bg:        #F3F4F2;
  --bg-alt:    #E9ECEA;
  --surface:   #FFFFFF;
  --text:      #142A31;
  --muted:     #5A6B70;
  --line:      #D8DEDC;
  --line-firm: #BCC6C3;
  --on-sea:       #EAF1F1;
  --on-sea-muted: #9DB6BA;
  --shadow-sm: 0 1px 2px rgba(15, 54, 66, .06);
  --shadow-md: 0 6px 16px rgba(15, 54, 66, .08);
  --shadow-lg: 0 18px 48px rgba(15, 54, 66, .16);

  --ui:      'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'IBM Plex Serif', Georgia, 'Times New Roman', serif;

  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;
  --r-pill: 999px;

  --container: 1200px;
  --gutter: clamp(18px, 4vw, 40px);
  --header-h: 66px;

  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: clamp(1.25rem, 1.1rem + .6vw, 1.5rem);
  --step-3: clamp(1.55rem, 1.25rem + 1.4vw, 2.2rem);
  --step-4: clamp(2.2rem, 1.5rem + 3vw, 3.9rem);
}

html[lang="ar"] {
  --ui:      'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, 'Segoe UI', Tahoma, sans-serif;
  --display: 'Markazi Text', 'Noto Naskh Arabic', 'IBM Plex Sans Arabic', serif;
  --step-2: clamp(1.35rem, 1.15rem + .7vw, 1.65rem);
  --step-3: clamp(1.75rem, 1.35rem + 1.6vw, 2.5rem);
  --step-4: clamp(2.5rem, 1.7rem + 3.4vw, 4.4rem);
}

html[data-theme="dark"] {
  --sea:          #0B1B21;
  --sea-deep:     #071419;
  --brand:        #4FB3BC;
  --brand-strong: #7CCBD1;
  --brand-soft:   #123339;
  --accent:       #F0957E;
  --accent-soft:  #3A221C;

  --bg:        #0E1F25;
  --bg-alt:    #0B1A1F;
  --surface:   #132A31;
  --text:      #E4ECED;
  --muted:     #94A8AC;
  --line:      #1F383F;
  --line-firm: #2C4A52;
  --on-sea:       #E4ECED;
  --on-sea-muted: #94A8AC;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, .45);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, .55);
}

/* --- Base ----------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }

html { -webkit-text-size-adjust: 100%; scroll-padding-block-start: calc(var(--header-h) + 20px); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

body {
  font-family: var(--ui);
  font-size: var(--step-0);
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
html[lang="ar"] body { line-height: 1.8; font-size: 1.04rem; }

img, svg, video { display: block; max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; line-height: 1.12; letter-spacing: -.012em; text-wrap: balance; }
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] h4 {
  line-height: 1.3; letter-spacing: 0; font-weight: 600;
}

::selection { background: var(--brand); color: #fff; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.section { padding-block: clamp(52px, 7vw, 92px); }
.section--tight { padding-block: clamp(32px, 4.5vw, 56px); }
.section--alt { background: var(--bg-alt); }
.section--sea { background: var(--sea); color: var(--on-sea); }
.section--sea .eyebrow { color: var(--on-sea-muted); }
.section--sea .section-head p { color: var(--on-sea-muted); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; inset-block-start: 8px; inset-inline-start: 8px;
  z-index: 200; transform: translateY(-160%);
  background: var(--sea); color: #fff;
  padding: 10px 18px; border-radius: var(--r-sm); font-weight: 600;
  transition: transform .15s ease-out;
}
.skip-link:focus { transform: translateY(0); }

/* --- Type helpers --------------------------------------------------------- */
.eyebrow {
  font-family: var(--ui);
  font-size: .72rem; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--brand);
}
html[lang="ar"] .eyebrow { letter-spacing: 0; font-size: .86rem; font-weight: 600; }

.display   { font-size: var(--step-4); }
.h2        { font-size: var(--step-3); }
.h3        { font-size: var(--step-2); }
.lede      { font-size: var(--step-1); color: var(--muted); max-width: 62ch; line-height: 1.55; }
html[lang="ar"] .lede { line-height: 1.8; }
.muted     { color: var(--muted); }
.prose p + p { margin-block-start: 1em; }

.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-block-end: 30px; flex-wrap: wrap; }
.section-head .eyebrow { display: block; margin-block-end: 10px; }
.section-head p { color: var(--muted); max-width: 58ch; margin-block-start: 10px; }

/* --- Buttons -------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px; border-radius: var(--r-md);
  font-weight: 600; font-size: .95rem; font-family: var(--ui);
  border: 1px solid transparent; cursor: pointer;
  transition: background-color .16s ease, color .16s ease, border-color .16s ease;
}
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--brand); color: #fff; }
.btn--primary:hover { background: var(--brand-strong); }
html[data-theme="dark"] .btn--primary { color: #06171a; }
.btn--ghost { background: transparent; color: var(--text); border-color: var(--line-firm); }
.btn--ghost:hover { border-color: var(--brand); color: var(--brand); }
.btn--quiet { background: var(--surface); color: var(--text); border-color: var(--line); box-shadow: var(--shadow-sm); }
.btn--quiet:hover { border-color: var(--brand); }
.btn--block { width: 100%; }
.btn--sm { padding: 8px 14px; font-size: .85rem; }

.link-arrow { color: var(--brand); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.link-arrow:hover { color: var(--brand-strong); }
.link-arrow .arw { transition: transform .16s ease; }
.link-arrow:hover .arw { transform: translateX(3px); }
.link-arrow--light { color: var(--on-sea); }
.link-arrow--light:hover { color: #fff; }

/* --- Header --------------------------------------------------------------- */
.site-header {
  position: sticky; inset-block-start: 0; z-index: 100;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  border-block-end: 1px solid var(--line);
}
.header-inner {
  display: flex; align-items: center; gap: 20px;
  min-height: var(--header-h);
}
.brand {
  display: inline-flex; align-items: center; gap: 10px;
  min-width: 0;
  color: var(--sea);
}
html[data-theme="dark"] .brand { color: var(--text); }
.brand-mark { width: 34px; height: 28px; flex: none; }
.brand-name {
  font-family: var(--display); font-size: 1.4rem; font-weight: 600; line-height: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
html[lang="ar"] .brand-name { font-size: 1.7rem; }
.brand-name small {
  display: block; font-family: var(--ui); font-size: .58rem; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-block-start: 4px;
}
html[lang="ar"] .brand-name small { letter-spacing: 0; font-size: .66rem; margin-block-start: 0; }

.main-nav { margin-inline-start: auto; }
.main-nav ul { display: flex; align-items: center; gap: 2px; list-style: none; padding: 0; }
.main-nav a {
  display: block; padding: 8px 12px; border-radius: var(--r-sm);
  font-size: .93rem; font-weight: 500; color: var(--muted);
  transition: color .15s ease, background-color .15s ease;
}
.main-nav a:hover { color: var(--text); background: var(--bg-alt); }
.main-nav a[aria-current="page"] { color: var(--sea); font-weight: 600; box-shadow: inset 0 -2px 0 var(--brand); border-radius: 0; }
html[data-theme="dark"] .main-nav a[aria-current="page"] { color: var(--text); }

.header-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.currency-switch { padding: 6px 10px; font-size: .78rem; }
.currency-switch--nav { display: none; }
@media (max-width: 560px) {
  /* Four tools plus a select squeeze the wordmark to nothing on a phone, so
     the currency choice moves into the menu panel. */
  .header-tools .currency-switch { display: none; }
  .currency-switch--nav { display: block; width: 100%; margin-block-start: 10px; padding: 12px 14px; font-size: 1rem; }
}

@media (max-width: 400px) {
  .header-tools { gap: 3px; }
  .lang-switch { padding-inline: 10px; }
  .icon-btn { width: 34px; height: 34px; }
}

.icon-btn {
  display: inline-grid; place-items: center;
  width: 38px; height: 38px; border-radius: var(--r-md);
  background: transparent; border: 1px solid var(--line); cursor: pointer;
  transition: border-color .15s ease, background-color .15s ease;
}
.icon-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
.icon-btn svg { width: 18px; height: 18px; }

.lang-switch {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--r-md);
  border: 1px solid var(--line-firm); font-weight: 600; font-size: .85rem;
  transition: border-color .15s ease, color .15s ease;
}
.lang-switch:hover { border-color: var(--brand); color: var(--brand); }

.shortlist-btn { position: relative; }
.shortlist-count {
  position: absolute; inset-block-start: -5px; inset-inline-end: -5px;
  min-width: 18px; height: 18px; padding-inline: 5px;
  border-radius: var(--r-pill); background: var(--accent); color: #fff;
  font-size: .68rem; font-weight: 700; display: none; place-items: center;
}
.shortlist-count[data-has] { display: grid; }

.nav-toggle { display: none; }

@media (max-width: 1040px) {
  .nav-toggle { display: inline-grid; }
  .brand-name small { display: none; }
  .main-nav {
    position: fixed; inset-block-start: var(--header-h); inset-inline: 0;
    background: var(--surface); border-block-end: 1px solid var(--line);
    box-shadow: var(--shadow-md);
    padding: 12px var(--gutter) 22px;
    display: none;
  }
  .main-nav[data-open] { display: block; }
  .main-nav ul { flex-direction: column; align-items: stretch; gap: 2px; }
  .main-nav a { padding: 13px 14px; font-size: 1rem; }
  .main-nav a[aria-current="page"] { box-shadow: inset 3px 0 0 var(--brand); }
}

/* --- Hero ----------------------------------------------------------------- */
.hero {
  position: relative; overflow: hidden;
  padding-block: clamp(56px, 8vw, 108px) clamp(44px, 6vw, 72px);
  background: var(--sea); color: var(--on-sea);
}
.hero .eyebrow { color: var(--on-sea-muted); }
.hero .lede { color: var(--on-sea-muted); }
.hero .lede [data-stat] { color: var(--on-sea); font-weight: 600; }
.hero-path {
  position: absolute; inset-inline: 0; inset-block-end: -6px;
  width: 100%; height: clamp(120px, 18vw, 220px);
  color: var(--brand); opacity: .55; pointer-events: none;
}
.hero-path path { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 1.6s cubic-bezier(.4, 0, .2, 1) .15s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .hero-path path { animation: none; stroke-dashoffset: 0; } }
.hero-inner { position: relative; max-width: 1040px; }
.hero-inner h1, .hero-inner .lede, .hero-inner .eyebrow { max-width: 780px; }
.hero h1 { font-size: var(--step-4); margin-block: 16px 20px; color: #fff; }
.hero .lede { font-size: clamp(1.05rem, .98rem + .4vw, 1.2rem); }

.hero-search {
  margin-block-start: 34px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  padding: 8px;
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr auto;
  gap: 6px;
  width: 100%;
}
.hero-search .field { display: flex; flex-direction: column; justify-content: center; padding: 6px 14px; border-radius: var(--r-sm); }
.hero-search .field + .field { border-inline-start: 1px solid var(--line); }
.hero-search label { font-size: .68rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
html[lang="ar"] .hero-search label { letter-spacing: 0; font-size: .78rem; }
.hero-search input,
.hero-search select {
  border: 0; background: transparent; padding: 3px 0;
  font-size: .98rem; font-weight: 500; width: 100%;
  line-height: 1.7; height: auto;
  appearance: none;
  text-overflow: ellipsis;
}
.hero-search input:focus, .hero-search select:focus { outline: none; }
.hero-search .field:focus-within { background: var(--bg-alt); }
.hero-search .btn { align-self: stretch; }

@media (max-width: 820px) {
  .hero-search { grid-template-columns: 1fr 1fr; }
  .hero-search .field + .field { border-inline-start: 0; }
  .hero-search .field:first-child { grid-column: 1 / -1; }
  .hero-search .btn { grid-column: 1 / -1; }
}

.hero-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 18px; }
.chip-link {
  display: inline-flex; align-items: center;
  padding: 7px 13px; border-radius: var(--r-pill);
  border: 1px solid color-mix(in srgb, var(--on-sea) 26%, transparent);
  color: var(--on-sea); font-size: .84rem; font-weight: 500;
  transition: border-color .15s ease, background-color .15s ease;
}
.chip-link:hover { border-color: var(--on-sea); background: color-mix(in srgb, #fff 8%, transparent); }

/* --- Proof strip ---------------------------------------------------------- */
.proof { background: var(--surface); border-block-end: 1px solid var(--line); }
.proof-grid { display: grid; grid-template-columns: repeat(4, 1fr); }
.proof-item { padding: 22px 0; border-inline-start: 1px solid var(--line); padding-inline-start: 22px; }
.proof-item:first-child { border-inline-start: 0; padding-inline-start: 0; }
.proof-item .n { font-family: var(--display); font-size: 1.9rem; font-weight: 600; line-height: 1; color: var(--sea); }
html[data-theme="dark"] .proof-item .n { color: var(--text); }
html[lang="ar"] .proof-item .n { font-size: 2.1rem; }
.proof-item .l { font-size: .82rem; color: var(--muted); margin-block-start: 6px; }
@media (max-width: 720px) {
  .proof-grid { grid-template-columns: 1fr 1fr; }
  .proof-item { padding: 16px 0; }
  .proof-item:nth-child(3) { border-inline-start: 0; padding-inline-start: 0; }
}

/* --- Subject list --------------------------------------------------------- */
.subject-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
@media (max-width: 560px) { .subject-list { grid-template-columns: 1fr; } }
.subject-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 4px; border-block-end: 1px solid var(--line);
  font-weight: 500;
  transition: color .15s ease;
}
.subject-row:hover { color: var(--brand); }
.subject-row .n { font-size: .8rem; color: var(--muted); font-weight: 600; flex: none; min-width: 2ch; text-align: end; }

/* legacy tiles (schools page) */
.subject-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(232px, 100%), 1fr)); }
.subject-tile {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  font-weight: 500;
  transition: border-color .15s ease;
}
.subject-tile:hover { border-color: var(--brand); }
.subject-tile .n { font-size: .8rem; color: var(--muted); font-weight: 600; flex: none; }

/* --- School strip (home) -------------------------------------------------- */
.school-strip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 0 28px; }
.school-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 12px 2px; border-block-end: 1px solid var(--line);
}
.school-row:hover .school-row__name { color: var(--brand); }
.school-row__name { font-weight: 600; font-size: .95rem; }
.school-row__meta { font-size: .8rem; color: var(--muted); flex: none; }

/* --- Cards ---------------------------------------------------------------- */
.card-grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
}

.course-card {
  position: relative;
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 18px 16px;
  transition: border-color .16s ease, box-shadow .16s ease;
}
.course-card:hover { border-color: var(--line-firm); box-shadow: var(--shadow-md); }
.course-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.course-card__school { position: relative; z-index: 1; font-size: .8rem; font-weight: 600; color: var(--brand); }
.course-card__school:hover { text-decoration: underline; }
.course-card__place { font-size: .8rem; color: var(--muted); margin-block-start: 2px; }
.course-card h3 { font-size: 1.14rem; margin-block: 12px 6px; line-height: 1.25; }
html[lang="ar"] .course-card h3 { font-size: 1.3rem; line-height: 1.35; }
.course-card h3 a::after { content: ''; position: absolute; inset: 0; border-radius: inherit; }
.course-card__summary { font-size: .9rem; color: var(--muted); flex: 1; }
.course-card__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: 10px; flex: 1; align-content: flex-start; }

/* Fixed-label spec block: the same four cells in the same order on every
   card, so comparison is a glance rather than a read. */
.spec {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px;
  margin-block-start: 16px; padding-block-start: 14px; border-block-start: 1px solid var(--line);
}
.spec__k { display: block; font-size: .66rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
html[lang="ar"] .spec__k { letter-spacing: 0; font-size: .76rem; }
.spec__v { display: block; font-size: .9rem; font-weight: 600; margin-block-start: 2px; }
.spec__v small { display: block; font-size: .74rem; font-weight: 500; color: var(--muted); margin-block-start: 1px; }
.spec__v--price { font-size: 1.05rem; color: var(--sea); }
html[data-theme="dark"] .spec__v--price { color: var(--text); }

.badge-new {
  display: inline-block; padding: 2px 7px; border-radius: var(--r-sm);
  background: var(--accent-soft); color: var(--accent); font-size: .66rem; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; vertical-align: middle; margin-inline-start: 6px;
}
html[lang="ar"] .badge-new { letter-spacing: 0; font-size: .74rem; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: var(--r-sm);
  background: var(--bg-alt); border: 1px solid transparent;
  font-size: .76rem; font-weight: 500; color: var(--muted);
  white-space: nowrap;
}
.pill--brand { background: var(--brand-soft); color: var(--brand-strong); font-weight: 600; }
html[data-theme="dark"] .pill--brand { color: var(--brand); }
.pill--accent { background: var(--accent-soft); color: var(--accent); }

.rating { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; font-weight: 600; }
.rating .stars { color: var(--accent); letter-spacing: .06em; }
.rating .count { color: var(--muted); font-weight: 500; }

.save-btn {
  position: relative; z-index: 1;
  display: inline-grid; place-items: center; flex: none;
  width: 32px; height: 32px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  color: var(--muted);
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.save-btn:hover { color: var(--accent); border-color: var(--accent); }
.save-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.save-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.save-btn[aria-pressed="true"] svg { fill: currentColor; }

.school-card {
  position: relative;
  display: flex; flex-direction: column; gap: 8px;
  padding: 22px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-lg);
  transition: border-color .16s ease, box-shadow .16s ease;
}
.school-card:hover { border-color: var(--brand); box-shadow: var(--shadow-md); }
.school-card h3 { font-size: 1.16rem; }
html[lang="ar"] .school-card h3 { font-size: 1.3rem; }
.school-card h3 a::after { content: ''; position: absolute; inset: 0; }
.school-card__place { font-size: .86rem; color: var(--muted); }
.school-card__foot { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: auto; padding-block-start: 14px; }

.list-card {
  position: relative; display: flex; flex-direction: column; gap: 10px;
  padding: 24px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line);
  transition: border-color .16s ease, box-shadow .16s ease;
}
.list-card:hover { border-color: var(--brand); box-shadow: var(--shadow-md); }
.list-card h3 { font-size: 1.24rem; }
html[lang="ar"] .list-card h3 { font-size: 1.4rem; }
.list-card h3 a::after { content: ''; position: absolute; inset: 0; }
.list-card p { color: var(--muted); font-size: .93rem; }
.list-card__n { font-size: .74rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); }
html[lang="ar"] .list-card__n { letter-spacing: 0; font-size: .82rem; }

/* --- Feature grid (KSA block) -------------------------------------------- */
.feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 28px 32px; }
.feature { padding-block-start: 18px; border-block-start: 1px solid color-mix(in srgb, var(--on-sea) 22%, transparent); }
.feature h3 { font-size: 1.15rem; color: #fff; margin-block-end: 8px; font-family: var(--ui); font-weight: 600; }
html[lang="ar"] .feature h3 { font-size: 1.2rem; }
.feature p { font-size: .93rem; color: var(--on-sea-muted); }
.feature .link-arrow { margin-block-start: 12px; font-size: .9rem; }

/* --- Catalogue layout ----------------------------------------------------- */
.catalogue { display: grid; grid-template-columns: 280px 1fr; gap: 34px; align-items: start; }
@media (max-width: 900px) { .catalogue { grid-template-columns: 1fr; gap: 18px; } }

.filters {
  position: sticky; inset-block-start: calc(var(--header-h) + 18px);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 18px 20px;
  max-height: calc(100vh - var(--header-h) - 40px); overflow-y: auto;
}
.filters h2 { font-size: 1rem; font-family: var(--ui); font-weight: 600; }
.filters__head { display: flex; align-items: center; justify-content: space-between; margin-block-end: 8px; }
.filter-group { border: 0; padding-block: 16px; border-block-start: 1px solid var(--line); }
.filter-group:first-of-type { border-block-start: 0; padding-block-start: 6px; }
.filter-group > legend, .filter-group > h3 {
  font-family: var(--ui); font-size: .7rem; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  margin-block-end: 10px; padding: 0;
}
html[lang="ar"] .filter-group > legend, html[lang="ar"] .filter-group > h3 { letter-spacing: 0; font-size: .82rem; }
.filter-group fieldset { border: 0; padding: 0; margin: 0; }

.check {
  display: flex; align-items: flex-start; gap: 9px;
  padding-block: 6px; font-size: .88rem; line-height: 1.4; cursor: pointer;
}
html[lang="ar"] .check { line-height: 1.6; }
.check input { accent-color: var(--brand); width: 16px; height: 16px; flex: none; cursor: pointer; margin-block-start: 2px; }
.check span { flex: 1; }
.check .n { flex: none; color: var(--muted); font-size: .76rem; font-weight: 600; }
.check:hover span { color: var(--brand); }

.range-row { display: flex; align-items: center; justify-content: space-between; font-size: .85rem; font-weight: 600; margin-block-end: 6px; }
input[type="range"] { width: 100%; accent-color: var(--brand); }

.filters-toggle,
.filters [data-filters-close],
.filters__done { display: none; }

@media (max-width: 900px) {
  .filters [data-filters-close] { display: inline-flex; }
  .filters__done { display: inline-flex; }
  .filters {
    position: fixed; inset: 0; z-index: 150; border-radius: 0; border: 0;
    max-height: none; overflow-y: auto; padding: 20px var(--gutter) 90px;
    display: none;
  }
  .filters[data-open] { display: block; }
  .filters__done { position: fixed; inset-inline: var(--gutter); inset-block-end: 18px; }
  .filters-toggle { display: inline-flex; }
}

.results-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-block-end: 18px; }
.results-count { font-weight: 600; }
.results-tools { display: flex; align-items: center; gap: 10px; }
.select {
  padding: 9px 12px; border-radius: var(--r-md);
  border: 1px solid var(--line-firm); background: var(--surface);
  font-size: .88rem; font-weight: 500; cursor: pointer;
}

.active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-block-end: 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 8px 5px 12px; border-radius: var(--r-sm);
  background: var(--brand-soft); color: var(--brand-strong);
  font-size: .8rem; font-weight: 600; border: 0; cursor: pointer;
}
html[data-theme="dark"] .chip { color: var(--brand); }
html[dir="rtl"] .chip { padding: 5px 12px 5px 8px; }
.chip:hover { background: var(--brand); color: #fff; }
.chip .x { font-size: 1rem; line-height: 1; }

.empty-state { text-align: center; padding: 60px 20px; border: 1px dashed var(--line-firm); border-radius: var(--r-lg); }
.empty-state h3 { font-size: 1.3rem; margin-block-end: 8px; }
.empty-state p { color: var(--muted); margin-block-end: 18px; }

/* --- Detail pages --------------------------------------------------------- */
.breadcrumbs { font-size: .85rem; color: var(--muted); padding-block: 18px 0; }
.breadcrumbs ol { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; }
.breadcrumbs li::after { content: '/'; margin-inline-start: 8px; color: var(--line-firm); }
.breadcrumbs li:last-child::after { content: none; }
.breadcrumbs a:hover { color: var(--brand); }

.detail { display: grid; grid-template-columns: 1fr 360px; gap: 44px; align-items: start; }

es.html?subject=leadership\">Leadership<\/a>\n          <a class=\"chip-link\" href=\"courses.html?subject=digital\">AI &amp; digital<\/a>\n          <a class=\"chip-link\" href=\"courses.html?subject=finance\">Finance<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"proof\">\n      <div class=\"container proof-grid\">\n        <div class=\"proof-item\"><div class=\"n\" data-stat=\"courses\">—<\/div><div class=\"l\">Programmes indexed<\/div><\/div>\n        <div class=\"proof-item\"><div class=\"n\" data-stat=\"schools\">—<\/div><div class=\"l\">Business schools<\/div><\/div>\n        <div class=\"proof-item\"><div class=\"n\" data-stat=\"countries\">—<\/div><div class=\"l\">Countries of delivery<\/div><\/div>\n        <div class=\"proof-item\"><div class=\"n\" data-stat=\"next\">—<\/div><div class=\"l\">Next start date<\/div><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">Next intakes<\/span>\n            <h2 class=\"h2\">Starting soonest<\/h2>\n            <p>Sorted by start date. Each card carries the fee, the teaching days and the language of instruction.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"courses.html?sort=date\">Full calendar <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-upcoming><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--alt\">\n      <div class=\"container split split--wide\">\n        <div>\n          <span class=\"eyebrow\">By subject<\/span>\n          <h2 class=\"h2\">Start from what you need to lead.<\/h2>\n          <p class=\"lede\" style=\"margin-block-start:14px\">Twelve subject areas, from board governance to AI. Counts are live.<\/p>\n        <\/div>\n        <div class=\"subject-list\" data-home-subjects><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">Selected<\/span>\n            <h2 class=\"h2\">Eight programmes to start with<\/h2>\n            <p>One programme from each of eight leading schools in the index, chosen by the editors — never for a placement fee.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"courses.html\">All programmes <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-featured><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--sea\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">For buyers in the Kingdom<\/span>\n            <h2 class=\"h2\">Built for how executive education is actually bought here.<\/h2>\n          <\/div>\n        <\/div>\n        <div class=\"feature-grid\">\n          <div class=\"feature\">\n            <h3>Riyals, or the school's own currency<\/h3>\n            <p>Every fee is shown exactly as the school publishes it, and switches to riyals in one click. No hidden pricing, no account to open.<\/p>\n          <\/div>\n          <div class=\"feature\">\n            <h3>Hijri and Gregorian dates<\/h3>\n            <p>Start dates on every programme in both calendars, so a cohort can be checked against Ramadan, Eid and the fiscal year at a glance.<\/p>\n          <\/div>\n          <div class=\"feature\">\n            <h3>An advisor, not a lead form<\/h3>\n            <p>Ask in Arabic or English and get a reply within two working days, Sunday to Thursday. Your details go to the school you choose, and nowhere else.<\/p>\n            <a class=\"link-arrow link-arrow--light\" href=\"contact.html\">Talk to an advisor <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n          <div class=\"feature\">\n            <h3>Cohorts for organisations<\/h3>\n            <p>Enrolling a team or a leadership bench? Request a proposal for a group booking or a closed cohort delivered to your calendar.<\/p>\n            <a class=\"link-arrow link-arrow--light\" href=\"contact.html#corporate\">Request a proposal <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">The schools<\/span>\n            <h2 class=\"h2\">Named, not \"world-class\".<\/h2>\n            <p>Every institution in the index, with the city it teaches from and the number of programmes listed.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"schools.html\">All schools <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"school-strip-grid\" data-home-schools><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--alt\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">Collections<\/span>\n            <h2 class=\"h2\">Answers to the questions people arrive with<\/h2>\n            <p>Editorial selections, not rankings. Nobody scored anything out of a hundred.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"lists.html\">All collections <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-lists><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container split\">\n        <div>\n          <span class=\"eyebrow\">How programmes get here<\/span>\n          <h2 class=\"h2\">Facts from the schools. Nothing invented.<\/h2>\n          <p class=\"lede\" style=\"margin-block-start:14px\">Masar reads the programme pages the schools publish and records what they say — title, dates, teaching days, format, language and fee. That is all a card shows, and all it claims.<\/p>\n        <\/div>\n        <ol class=\"step-list\">\n          <li><div><h3>Taken from the source<\/h3><p>Listings come from each school's own published calendar and are refreshed regularly.<\/p><\/div><\/li>\n          <li><div><h3>No ratings we did not earn<\/h3><p>Imported programmes carry no star ratings, testimonials or marketing copy. If a school did not state it, the card does not either.<\/p><\/div><\/li>\n          <li><div><h3>No paid placement<\/h3><p>Position on this site is not for sale. Collections are editorial, and say so.<\/p><\/div><\/li>\n          <li><div><h3>Straight to the school<\/h3><p>An enquiry goes to the institution running the programme. Your details are not resold.<\/p><\/div><\/li>\n        <\/ol>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"hero\">\n        <svg class=\"hero-path\" viewBox=\"0 0 1200 220\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M0 190 C 220 190, 300 60, 480 60 S 760 200, 940 120 S 1120 20, 1200 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>\n      <div class=\"container hero-inner\">\n        <p class=\"eyebrow\">برامج تنفيذية مفتوحة التسجيل<\/p>\n        <h1>برامج قصيرة تستحق أن تغادر مكتبك من أجلها.<\/h1>\n        <p class=\"lede\"><span data-stat=\"courses\">189<\/span> برنامجًا من <span data-stat=\"schools\">17<\/span> كلية أعمال —\n          إم آي تي سلون، وآي إم دي، وكيلوغ، وكلية كينيدي في هارفارد، وهاس في بيركلي — مع التواريخ وأيام التدريس\n          والرسوم على كل بطاقة، بعملة الكلية أو بالريال السعودي.<\/p>\n\n        <form class=\"hero-search\" action=\"courses.html\" method=\"get\" role=\"search\">\n          <div class=\"field\">\n            <label for=\"q\">البحث<\/label>\n            <input id=\"q\" name=\"q\" type=\"search\" placeholder=\"برنامج أو تخصّص أو كلية\" autocomplete=\"off\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"subject\">التخصّص<\/label>\n            <select id=\"subject\" name=\"subject\" data-hero-subject><\/select>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"format\">نمط الدراسة<\/label>\n            <select id=\"format\" name=\"format\" data-hero-format><\/select>\n          <\/div>\n          <button class=\"btn btn--primary\" type=\"submit\">ابحث عن برنامج<\/button>\n        <\/form>\n\n        <div class=\"hero-chips\" aria-label=\"تصفية سريعة\">\n          <a class=\"chip-link\" href=\"courses.html?sort=date\">الأقرب بدءًا<\/a>\n          <a class=\"chip-link\" href=\"courses.html?duration=short,mid\">أسبوع أو أقل<\/a>\n          <a class=\"chip-link\" href=\"courses.html?format=online\">عن بُعد<\/a>\n          <a class=\"chip-link\" href=\"courses.html?subject=leadership\">القيادة<\/a>\n          <a class=\"chip-link\" href=\"courses.html?subject=digital\">الذكاء الاصطناعي والتحوّل الرقمي<\/a>\n          <a class=\"chip-link\" href=\"courses.html?subject=finance\">التمويل<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"proof\">\n      <div class=\"container proof-grid\">\n        <div class=\"proof-item\"><div class=\"n\" data-stat=\"courses\">—<\/div><div class=\"l\">برنامجًا مفهرسًا<\/div><\/div>\n        <div class=\"proof-item\"><div class=\"n\" data-stat=\"schools\">—<\/div><div class=\"l\">كلية أعمال<\/div><\/div>\n        <div class=\"proof-item\"><div class=\"n\" data-stat=\"countries\">—<\/div><div class=\"l\">دولة تُقدَّم فيها البرامج<\/div><\/div>\n        <div class=\"proof-item\"><div class=\"n\" data-stat=\"next\">—<\/div><div class=\"l\">أقرب موعد بدء<\/div><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">أقرب الدفعات<\/span>\n            <h2 class=\"h2\">الأقرب بدءًا<\/h2>\n            <p>مرتّبة حسب تاريخ البدء. تحمل كل بطاقة الرسوم وعدد أيام التدريس ولغة التدريس.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"courses.html?sort=date\">التقويم الكامل <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-upcoming><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--alt\">\n      <div class=\"container split split--wide\">\n        <div>\n          <span class=\"eyebrow\">حسب التخصّص<\/span>\n          <h2 class=\"h2\">ابدأ ممّا تحتاج إليه لتقود.<\/h2>\n          <p class=\"lede\" style=\"margin-block-start:14px\">اثنا عشر مجالًا، من حوكمة مجالس الإدارة إلى الذكاء الاصطناعي. الأعداد محدّثة باستمرار.<\/p>\n        <\/div>\n        <div class=\"subject-list\" data-home-subjects><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">مختارات<\/span>\n            <h2 class=\"h2\">ثمانية برامج تبدأ منها<\/h2>\n            <p>برنامج واحد من كلٍّ من ثماني كليات رائدة في الدليل، اختاره فريق التحرير — ولا مقابل رسوم إدراج.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"courses.html\">كل البرامج <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-featured><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--sea\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">لمن يشتري في المملكة<\/span>\n            <h2 class=\"h2\">مبني على الطريقة التي يُشترى بها التعليم التنفيذي فعلًا.<\/h2>\n          <\/div>\n        <\/div>\n        <div class=\"feature-grid\">\n          <div class=\"feature\">\n            <h3>بالريال، أو بعملة الكلية<\/h3>\n            <p>تُعرض كل الرسوم كما تنشرها الكلية تمامًا، وتتحوّل إلى الريال بنقرة واحدة. لا أسعار مخفية، ولا حساب يلزم فتحه.<\/p>\n          <\/div>\n          <div class=\"feature\">\n            <h3>التاريخان الهجري والميلادي<\/h3>\n            <p>مواعيد البدء على كل برنامج بالتقويمين، ليسهل التحقّق من موقع الدفعة من رمضان والأعياد والسنة المالية بنظرة واحدة.<\/p>\n          <\/div>\n          <div class=\"feature\">\n            <h3>مستشار، لا نموذج لجمع البيانات<\/h3>\n            <p>اسأل بالعربية أو الإنجليزية وستصلك الإجابة خلال يومَي عمل، من الأحد إلى الخميس. تذهب بياناتك إلى الكلية التي تختارها، ولا إلى أي جهة أخرى.<\/p>\n            <a class=\"link-arrow link-arrow--light\" href=\"contact.html\">تحدّث مع مستشار <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n          <div class=\"feature\">\n            <h3>دفعات للمنشآت<\/h3>\n            <p>تسجّل فريقًا أو صفًّا قياديًا كاملًا؟ اطلب عرضًا لحجز جماعي أو لدفعة مغلقة تُقدَّم وفق تقويم منشأتك.<\/p>\n            <a class=\"link-arrow link-arrow--light\" href=\"contact.html#corporate\">اطلب عرضًا <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">الكليات<\/span>\n            <h2 class=\"h2\">بأسمائها، لا بعبارات التفخيم.<\/h2>\n            <p>كل مؤسسة في الدليل، مع المدينة التي تدرّس منها وعدد برامجها المدرجة.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"schools.html\">كل الكليات <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"school-strip-grid\" data-home-schools><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section section--alt\">\n      <div class=\"container\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">مجموعات<\/span>\n            <h2 class=\"h2\">إجابات عن الأسئلة التي يأتي بها الزوّار<\/h2>\n            <p>اختيارات تحريرية لا تصنيفات. لم يُمنح أي برنامج درجة من مئة.<\/p>\n          <\/div>\n          <a class=\"link-arrow\" href=\"lists.html\">كل المجموعات <span class=\"arw\" aria-hidden=\"true\">→<\/span><\/a>\n        <\/div>\n        <div class=\"card-grid\" data-home-lists><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section\">\n      <div class=\"container split\">\n        <div>\n          <span class=\"eyebrow\">كيف تصل البرامج إلى هنا<\/span>\n          <h2 class=\"h2\">وقائع من الكليات. لا شيء مختلَق.<\/h2>\n          <p class=\"lede\" style=\"margin-block-start:14px\">يقرأ «مسار» صفحات البرامج التي تنشرها الكليات ويسجّل ما تقوله: العنوان والتواريخ وأيام التدريس ونمط الدراسة واللغة والرسوم. هذا كل ما تعرضه البطاقة، وكل ما تدّعيه.<\/p>\n        <\/div>\n        <ol class=\"step-list\">\n          <li><div><h3>من المصدر مباشرة<\/h3><p>تُؤخذ البرامج من التقويم المنشور لكل كلية وتُحدَّث دوريًا.<\/p><\/div><\/li>\n          <li><div><h3>لا تقييمات لم نستحقّها<\/h3><p>لا تحمل البرامج المستوردة نجومًا ولا شهادات ولا نصوصًا تسويقية. ما لم تذكره الكلية لا تذكره البطاقة.<\/p><\/div><\/li>\n          <li><div><h3>لا إدراج مدفوع<\/h3><p>الموضع في هذا الموقع غير معروض للبيع. والمجموعات تحريرية، وتقول ذلك صراحة.<\/p><\/div><\/li>\n          <li><div><h3>إلى الكلية مباشرة<\/h3><p>يذهب الاستفسار إلى المؤسسة التي تقدّم البرنامج، ولا يُعاد بيع بياناتك.<\/p><\/div><\/li>\n        <\/ol>\n      <\/div>\n    <\/section>\n  "}, "courses.html": {"en": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">The index<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">Executive programmes<\/h1>\n        <p class=\"lede\">Every programme in the index, with the fee, teaching days, start date and language of\n          instruction on the card. Filters live in the address bar, so a shortlist is a link you can forward\n          for approval.<\/p>\n\n        <form role=\"search\" style=\"margin-block-start:24px;max-width:560px\">\n          <label class=\"sr-only\" for=\"cat-q\">Search programmes<\/label>\n          <input id=\"cat-q\" type=\"search\" data-catalogue-search placeholder=\"Programme, subject or school\"\n                 style=\"width:100%;padding:14px 18px;border-radius:999px;border:1px solid var(--line-firm);background:var(--surface)\">\n        <\/form>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\" style=\"padding-block-start:8px\">\n      <div class=\"container catalogue\">\n        <aside class=\"filters\" data-filters aria-label=\"Filters\">\n          <div class=\"filters__head\">\n            <h2>Refine<\/h2>\n            <button class=\"btn btn--sm btn--ghost\" type=\"button\" data-filters-close>Done<\/button>\n          <\/div>\n          <div data-filter-body><\/div>\n          <button class=\"btn btn--primary btn--block filters__done\" type=\"button\" data-filters-close>Show results<\/button>\n        <\/aside>\n\n        <div>\n          <div class=\"results-bar\">\n            <p class=\"results-count\" data-results-count aria-live=\"polite\">—<\/p>\n            <div class=\"results-tools\">\n              <button class=\"btn btn--ghost btn--sm filters-toggle\" type=\"button\" data-filters-open>Filters<\/button>\n              <label class=\"sr-only\" for=\"sort\">Sort by<\/label>\n              <select class=\"select\" id=\"sort\" data-sort>\n                <option value=\"date\">Starting soonest<\/option>\n                <option value=\"popular\">Most popular<\/option>\n                <option value=\"rating\">Highest rated<\/option>\n                <option value=\"priceAsc\">Fee: low to high<\/option>\n                <option value=\"priceDesc\">Fee: high to low<\/option>\n              <\/select>\n            <\/div>\n          <\/div>\n          <div class=\"active-filters\" data-active-filters><\/div>\n          <div class=\"card-grid\" data-results><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">الدليل<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">البرامج التنفيذية<\/h1>\n        <p class=\"lede\">كل برنامج في الدليل، ومعه الرسوم وأيام التدريس وتاريخ البدء ولغة التدريس على البطاقة نفسها.\n          تعيش أدوات التصفية في عنوان الصفحة، فتصبح قائمتك المختصرة رابطًا يمكن تمريره لاعتماده.<\/p>\n\n        <form role=\"search\" style=\"margin-block-start:24px;max-width:560px\">\n          <label class=\"sr-only\" for=\"cat-q\">ابحث في البرامج<\/label>\n          <input id=\"cat-q\" type=\"search\" data-catalogue-search placeholder=\"برنامج أو تخصّص أو كلية\"\n                 style=\"width:100%;padding:14px 18px;border-radius:999px;border:1px solid var(--line-firm);background:var(--surface)\">\n        <\/form>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\" style=\"padding-block-start:8px\">\n      <div class=\"container catalogue\">\n        <aside class=\"filters\" data-filters aria-label=\"أدوات التصفية\">\n          <div class=\"filters__head\">\n            <h2>تصفية النتائج<\/h2>\n            <button class=\"btn btn--sm btn--ghost\" type=\"button\" data-filters-close>تم<\/button>\n          <\/div>\n          <div data-filter-body><\/div>\n          <button class=\"btn btn--primary btn--block filters__done\" type=\"button\" data-filters-close>اعرض النتائج<\/button>\n        <\/aside>\n\n        <div>\n          <div class=\"results-bar\">\n            <p class=\"results-count\" data-results-count aria-live=\"polite\">—<\/p>\n            <div class=\"results-tools\">\n              <button class=\"btn btn--ghost btn--sm filters-toggle\" type=\"button\" data-filters-open>التصفية<\/button>\n              <label class=\"sr-only\" for=\"sort\">ترتيب النتائج<\/label>\n              <select class=\"select\" id=\"sort\" data-sort>\n                <option value=\"date\">الأقرب بدءًا<\/option>\n                <option value=\"popular\">الأكثر رواجًا<\/option>\n                <option value=\"rating\">الأعلى تقييمًا<\/option>\n                <option value=\"priceAsc\">الرسوم: من الأقل<\/option>\n                <option value=\"priceDesc\">الرسوم: من الأعلى<\/option>\n              <\/select>\n            <\/div>\n          <\/div>\n          <div class=\"active-filters\" data-active-filters><\/div>\n          <div class=\"card-grid\" data-results><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  "}, "course.html": {"en": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <ol>\n          <li><a href=\"index.html\">Home<\/a><\/li>\n          <li><a href=\"courses.html\">Courses<\/a><\/li>\n          <li aria-current=\"page\" data-course-crumb>Course<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <div class=\"container\" data-course-detail><\/div>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\"><h2 class=\"h2\">Similar programmes<\/h2><\/div>\n        <div class=\"card-grid\" data-similar><\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"مسار التنقّل\">\n        <ol>\n          <li><a href=\"index.html\">الرئيسية<\/a><\/li>\n          <li><a href=\"courses.html\">البرامج<\/a><\/li>\n          <li aria-current=\"page\" data-course-crumb>البرنامج<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <div class=\"container\" data-course-detail><\/div>\n\n    <section class=\"section\">\n      <div class=\"container\">\n        <div class=\"section-head\"><h2 class=\"h2\">برامج مشابهة<\/h2><\/div>\n        <div class=\"card-grid\" data-similar><\/div>\n      <\/div>\n    <\/section>\n  "}, "schools.html": {"en": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">Institutions<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">Business schools<\/h1>\n        <p class=\"lede\">Every institution with programmes in the index, with the city it teaches from and\n          what it lists — not a paragraph of marketing copy.<\/p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-block-start:22px\" data-region-filter><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-schools><\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">المؤسسات<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">كليات إدارة الأعمال<\/h1>\n        <p class=\"lede\">كل كلية لها برامج في الدليل، ومعها ما تشتهر به فعلًا — لا فقرة من العبارات التسويقية.<\/p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-block-start:22px\" data-region-filter><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-schools><\/div>\n      <\/div>\n    <\/section>\n  "}, "school.html": {"en": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <ol>\n          <li><a href=\"index.html\">Home<\/a><\/li>\n          <li><a href=\"schools.html\">Schools<\/a><\/li>\n          <li aria-current=\"page\" data-school-crumb>School<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-school-detail><\/div>\n    <\/section>\n  ", "ar": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"مسار التنقّل\">\n        <ol>\n          <li><a href=\"index.html\">الرئيسية<\/a><\/li>\n          <li><a href=\"schools.html\">الكليات<\/a><\/li>\n          <li aria-current=\"page\" data-school-crumb>الكلية<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-school-detail><\/div>\n    <\/section>\n  "}, "lists.html": {"en": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">Collections<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">Editors' shortlists<\/h1>\n        <p class=\"lede\">The questions people arrive with, each answered with a handful of programmes.\n          Editorial selections, not a ranking — nobody scored anything out of a hundred.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-lists><\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section--tight\" style=\"padding-block-start:34px\">\n      <div class=\"container\">\n        <span class=\"eyebrow\">مجموعات<\/span>\n        <h1 class=\"h2\" style=\"margin-block:10px 12px\">اختيارات فريق التحرير<\/h1>\n        <p class=\"lede\">الأسئلة التي يأتي بها الزوّار عادةً، يجيب عن كلٍّ منها عدد محدود من البرامج.\n          اختيارات تحريرية لا تصنيفات — لم يُمنح أي برنامج درجة من مئة.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"section--tight\">\n      <div class=\"container\">\n        <div class=\"card-grid\" data-lists><\/div>\n      <\/div>\n    <\/section>\n  "}, "list.html": {"en": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <ol>\n          <li><a href=\"index.html\">Home<\/a><\/li>\n          <li><a href=\"lists.html\">Collections<\/a><\/li>\n          <li aria-current=\"page\" data-list-crumb>Collection<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-list-detail><\/div>\n    <\/section>\n  ", "ar": "\n\n    <div class=\"container\">\n      <nav class=\"breadcrumbs\" aria-label=\"مسار التنقّل\">\n        <ol>\n          <li><a href=\"index.html\">الرئيسية<\/a><\/li>\n          <li><a href=\"lists.html\">المجموعات<\/a><\/li>\n          <li aria-current=\"page\" data-list-crumb>المجموعة<\/li>\n        <\/ol>\n      <\/nav>\n    <\/div>\n\n    <section class=\"section--tight\">\n      <div class=\"container\" data-list-detail><\/div>\n    <\/section>\n  "}, "about.html": {"en": "\n\n    <section class=\"section\">\n      <div class=\"container\" style=\"max-width:760px\">\n        <span class=\"eyebrow\">About Masar<\/span>\n        <h1 class=\"display\" style=\"margin-block:12px 18px\">An index of executive programmes, built the honest way round.<\/h1>\n        <p class=\"lede\">Choosing an executive programme usually means directories that rank whoever paid most,\n          hide the fee until you hand over a phone number, and have no Arabic version worth the name.\n          Masar (<span lang=\"ar\">مسار<\/span>, \"the path\") was built in Riyadh to be the opposite.<\/p>\n\n        <div class=\"prose\" style=\"margin-block-start:32px\">\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">What is here<\/h2>\n          <p class=\"muted\">Open-enrolment executive programmes from business schools around the world —\n            MIT Sloan, IMD, Kellogg, Harvard Kennedy School, Berkeley Haas, Queen's Smith, UBC Sauder, AGSM,\n            Copenhagen Business School, St. Gallen and others — each with its dates, teaching days, format,\n            language of instruction and fee. Everything is visible without an account, and any filtered view\n            is a link you can forward.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">Where the data comes from<\/h2>\n          <p class=\"muted\">From the schools themselves. Masar reads each institution's published programme\n            pages and records the facts they state. Nothing is paraphrased from a school's marketing copy,\n            no rating is invented, and a programme with no published fee is left out rather than guessed.\n            Fees appear in the currency the school publishes; the riyal figure is an indicative conversion\n            with the rate date shown.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">How programmes are selected<\/h2>\n          <p class=\"muted\">Editorially. Position in the index or in a collection is never for sale and there\n            is no paid tier. Collections are labelled as editorial selections rather than rankings, because\n            scoring a four-day negotiation programme out of a hundred would be an invention.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">Arabic, properly<\/h2>\n          <p class=\"muted\">The Arabic site is not the English site passed through a translation engine.\n            It is written copy, a right-to-left layout built from the same stylesheet, correct Arabic plural\n            forms, Hijri dates alongside Gregorian, and localised numbers. Both languages read from one\n            catalogue, so a programme cannot exist in one and quietly vanish in the other.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">Privacy<\/h2>\n          <p class=\"muted\">No tracking script, no analytics. Your shortlist lives in your own browser and\n            never leaves it. An enquiry goes to the school running the programme and is not resold.<\/p>\n        <\/div>\n\n        <div style=\"margin-block-start:34px;display:flex;gap:12px;flex-wrap:wrap\">\n          <a class=\"btn btn--primary\" href=\"courses.html\">Browse the index<\/a>\n          <a class=\"btn btn--ghost\" href=\"contact.html\">Talk to an advisor<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section\">\n      <div class=\"container\" style=\"max-width:760px\">\n        <span class=\"eyebrow\">عن مسار<\/span>\n        <h1 class=\"display\" style=\"margin-block:12px 18px\">دليل للبرامج التنفيذية، مبني بالطريقة الصادقة.<\/h1>\n        <p class=\"lede\">اختيار برنامج تنفيذي يعني عادةً أدلّة تُصدِّر من يدفع أكثر، وتُخفي الرسوم حتى تترك رقم هاتفك،\n          وليس لها نسخة عربية تستحق هذا الاسم. بُني «مسار» في الرياض ليكون النقيض.<\/p>\n\n        <div class=\"prose\" style=\"margin-block-start:32px\">\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">ما الذي تجده هنا<\/h2>\n          <p class=\"muted\">برامج تنفيذية مفتوحة التسجيل من كليات الأعمال حول العالم — إم آي تي سلون، وآي إم دي، وكيلوغ،\n            وكلية كينيدي في هارفارد، وهاس في بيركلي، وسميث في جامعة كوينز، وساودر في جامعة بريتيش كولومبيا،\n            وكلية كوبنهاغن للأعمال، وسانت غالن وغيرها — لكلٍّ منها تواريخه وأيام تدريسه ونمط دراسته ولغة التدريس والرسوم.\n            كل شيء ظاهر دون حساب، وأي نتيجة مصفّاة رابط يمكن تمريره.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">من أين تأتي البيانات<\/h2>\n          <p class=\"muted\">من الكليات نفسها. يقرأ «مسار» صفحات البرامج المنشورة لكل مؤسسة ويسجّل الوقائع التي تذكرها.\n            لا يُعاد صياغة أي نص تسويقي، ولا يُختلق أي تقييم، والبرنامج الذي لم تُنشر رسومه يُستبعد ولا يُخمَّن.\n            تظهر الرسوم بالعملة التي تنشرها الكلية، ومبلغ الريال تحويل استرشادي مع تاريخ سعر الصرف.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">كيف تُختار البرامج<\/h2>\n          <p class=\"muted\">تحريريًا. الموضع في الدليل أو في أي مجموعة غير معروض للبيع، ولا توجد فئة مدفوعة.\n            وُصفت المجموعات بأنها اختيارات تحريرية لا تصنيفات، لأن منح برنامج تفاوض مدّته أربعة أيام درجةً من مئة سيكون اختلاقًا.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">العربية كما ينبغي<\/h2>\n          <p class=\"muted\">النسخة العربية ليست النسخة الإنجليزية بعد تمريرها على محرّك ترجمة. هي نصوص مكتوبة، وتخطيط\n            من اليمين إلى اليسار مبني من ملف التنسيق نفسه، وصيغ جمع عربية صحيحة، وتواريخ هجرية إلى جانب الميلادية، وأرقام موطّنة.\n            تقرأ اللغتان من دليل واحد، فلا يمكن أن يوجد برنامج بلغة ويختفي بهدوء في الأخرى.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:28px 10px\">الخصوصية<\/h2>\n          <p class=\"muted\">لا برامج تتبّع ولا تحليلات. تعيش قائمتك المختارة في متصفّحك ولا تغادره.\n            يذهب الاستفسار إلى الكلية التي تقدّم البرنامج ولا يُعاد بيعه.<\/p>\n        <\/div>\n\n        <div style=\"margin-block-start:34px;display:flex;gap:12px;flex-wrap:wrap\">\n          <a class=\"btn btn--primary\" href=\"courses.html\">تصفّح الدليل<\/a>\n          <a class=\"btn btn--ghost\" href=\"contact.html\">تحدّث مع مستشار<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n  "}, "contact.html": {"en": "\n\n    <section class=\"section\">\n      <div class=\"container split\" style=\"align-items:start\">\n        <div>\n          <span class=\"eyebrow\">Contact<\/span>\n          <h1 class=\"h2\" style=\"margin-block:12px 16px\">Talk to an advisor<\/h1>\n          <p class=\"lede\">Tell us which programme you are weighing and what you need to know — dates,\n            fees, whether it suits your level, how to get it approved. We reply within two working days,\n            Sunday to Thursday, in Arabic or English. Your details go to the school you choose and nowhere else.<\/p>\n          \n\n          <h2 class=\"h3\" id=\"corporate\" style=\"margin-block:34px 12px\">For organisations<\/h2>\n          <p class=\"muted\">Enrolling a team, a leadership bench or a full closed cohort? Say how many people\n            and which subjects, and we will come back with options, group terms and a proposal you can\n            forward internally.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:34px 12px\">Listing a programme<\/h2>\n          <p class=\"muted\">Schools can propose a programme for the index at no cost. Inclusion is an editorial\n            decision and position is never for sale.<\/p>\n        <\/div>\n\n        <form class=\"form-grid form-card\" data-contact-form novalidate>\n          <div class=\"field-block\">\n            <label for=\"name\">Your name<\/label>\n            <input id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\" required>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"org\">Organisation<\/label>\n            <input id=\"org\" name=\"organisation\" type=\"text\" autocomplete=\"organization\">\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"phone\">Mobile<\/label>\n            <input id=\"phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\" dir=\"ltr\" placeholder=\"+966\">\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"email\">Email<\/label>\n            <input id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <label for=\"course\">Programme you are asking about<\/label>\n            <select id=\"course\" name=\"course\" data-course-select><\/select>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"size\">Who is enrolling<\/label>\n            <select id=\"size\" name=\"group\">\n              <option value=\"1\">Just me<\/option>\n              <option value=\"2-5\">A team of 2–5<\/option>\n              <option value=\"6+\">6 or more / closed cohort<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field-block\">\n            <label for=\"lang\">Reply in<\/label>\n            <select id=\"lang\" name=\"reply_language\">\n              <option value=\"en\">English<\/option>\n              <option value=\"ar\">Arabic<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <label for=\"message\">Your question<\/label>\n            <textarea id=\"message\" name=\"message\" required><\/textarea>\n          <\/div>\n          <div class=\"field-block field-block--wide\">\n            <button class=\"btn btn--primary\" type=\"submit\">Send enquiry<\/button>\n            <p class=\"form-note\" style=\"margin-block-start:10px\">Two working days, Sunday to Thursday, Riyadh time.<\/p>\n            <p class=\"notice\" data-form-status tabindex=\"-1\" hidden style=\"margin-block-start:14px\">\n              <span><strong>This form is not connected yet.<\/strong> Please use the contact channels on this page.<\/span>\n            <\/p>\n          <\/div>\n        <\/form>\n      <\/div>\n    <\/section>\n  ", "ar": "\n\n    <section class=\"section\">\n      <div class=\"container split\" style=\"align-items:start\">\n        <div>\n          <span class=\"eyebrow\">تواصل معنا<\/span>\n          <h1 class=\"h2\" style=\"margin-block:12px 16px\">تحدّث مع مستشار<\/h1>\n          <p class=\"lede\">أخبرنا بالبرنامج الذي تفاضل بينه وبين غيره وبما تريد معرفته — المواعيد والرسوم ومدى ملاءمته\n            لمستواك وكيفية اعتماده. نردّ خلال يومَي عمل، من الأحد إلى الخميس، بالعربية أو الإنجليزية.\n            تذهب بياناتك إلى الكلية التي تختارها ولا إلى أي جهة أخرى.<\/p>\n          \n\n          <h2 class=\"h3\" id=\"corporate\" style=\"margin-block:34px 12px\">للمنشآت<\/h2>\n          <p class=\"muted\">تسجّل فريقًا أو صفًّا قياديًا أو دفعة مغلقة كاملة؟ اذكر عدد المشاركين والمجالات المطلوبة،\n            وسنعود إليك بالخيارات وشروط الحجز الجماعي وعرض يمكن تمريره داخل منشأتك.<\/p>\n\n          <h2 class=\"h3\" style=\"margin-block:34px 12px\">إدراج برنامج<\/h2>\n          <p class=\"muted\">يمكن للكليات اقتراح برنامج لإدراجه في الدليل مجانًا. الإدراج قرار تحريري، والموضع غير معروض للبيع.<\/p>\n        <\/div>\n\n        <form class=\"form-grid form-card\" data-contact-form novalidate>\n          <div class=\"field-block\">\n            <label for=\"name\">الاسم<\/label>\n            <input id     }
  };

  function t(key, vars) {
    let out = (strings[LANG] && strings[LANG][key]) || strings.en[key] || key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        out = out.replace('{' + k + '}', vars[k]);
      });
    }
    return out;
  }

  /* Pick the localised half of a { en, ar } pair. */
  function pick(pair) {
    if (pair == null) return '';
    if (typeof pair === 'string') return pair;
    return pair[LANG] != null ? pair[LANG] : pair.en;
  }

  /* Arabic counts genuinely need six forms — doing this properly is the
     difference between a translated site and a localised one. */
  function courseCount(n) {
    if (LANG !== 'ar') return n === 1 ? '1 course' : n.toLocaleString('en') + ' courses';
    if (n === 0) return 'لا توجد برامج';
    if (n === 1) return 'برنامج واحد';
    if (n === 2) return 'برنامجان';
    if (n <= 10) return n + ' برامج';
    return n + ' برنامجًا';
  }

  function dayCount(n) {
    if (LANG !== 'ar') return n === 1 ? '1 day' : n + ' days';
    if (n === 1) return 'يوم واحد';
    if (n === 2) return 'يومان';
    if (n <= 10) return n + ' أيام';
    return n + ' يومًا';
  }

  const numLocale = LANG === 'ar' ? 'ar-u-nu-latn' : 'en';

  /* Fees are stored in each course's original currency; the viewer can opt
     into seeing everything converted to SAR (rates: MASAR_DATA.fx, a dated
     snapshot — display only, not billing). */
  const CURRENCY_KEY = 'masar-currency';

  function getCurrency() {
    try {
      return localStorage.getItem(CURRENCY_KEY) === 'sar' ? 'sar' : 'orig';
    } catch (e) { return 'orig'; }
  }

  function setCurrency(pref) {
    try { localStorage.setItem(CURRENCY_KEY, pref === 'sar' ? 'sar' : 'orig'); } catch (e) {}
  }

  function fxTable() {
    return (window.MASAR_DATA && window.MASAR_DATA.fx) || { sarPerUsd: 3.75, usdPer: { USD: 1 } };
  }

  /* USD equivalent of a fee — used for the price filter and price sorting so
     mixed currencies compare on one scale. Unknown codes fall back 1:1. */
  function toUsd(value, currency) {
    const rate = fxTable().usdPer[currency || 'USD'];
    return value * (rate == null ? 1 : rate);
  }

  function format(value, code) {
    try {
      /* A bare "$" would make an Australian or Canadian fee read as US
         dollars, so only USD gets the narrow symbol; others keep their
         qualifier (A$, CA$, CHF, DKK…). */
      return new Intl.NumberFormat(numLocale, {
        style: 'currency', currency: code,
        currencyDisplay: code === 'USD' ? 'narrowSymbol' : 'symbol', maximumFractionDigits: 0
      }).format(value);
    } catch (e) {
      return value.toLocaleString('en') + ' ' + code;
    }
  }

  /* Format a fee in its own currency (default), or converted to SAR when the
     viewer selected the SAR option. */
  function money(value, currency) {
    const code = currency || 'USD';
    if (getCurrency() === 'sar') {
      return format(Math.round(toUsd(value, code) * fxTable().sarPerUsd), 'SAR');
    }
    return format(value, code);
  }

  function shortDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    try {
      return new Intl.DateTimeFormat(numLocale, {
        day: 'numeric', month: 'short', year: 'numeric'
      }).format(d);
    } catch (e) {
      return iso;
    }
  }

  /* Umm al-Qura Hijri date for the same day — shown beside the Gregorian
     date so a cohort can be placed against Ramadan and the Eids at a glance. */
  function hijriDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    try {
      return new Intl.DateTimeFormat(
        LANG === 'ar' ? 'ar-SA-u-ca-islamic-umalqura-nu-latn' : 'en-u-ca-islamic-umalqura',
        { day: 'numeric', month: 'short', year: 'numeric' }
      ).format(d);
    } catch (e) {
      return '';
    }
  }

  function monthLabel(iso) {
    const d = new Date(iso + 'T00:00:00');
    try {
      return new Intl.DateTimeFormat(numLocale, { month: 'long', year: 'numeric' }).format(d);
    } catch (e) {
      return iso.slice(0, 7);
    }
  }

  function num(n) {
    try { return new Intl.NumberFormat(numLocale).format(n); } catch (e) { return String(n); }
  }

  return { LANG, IS_RTL, t, pick, courseCount, dayCount, money, toUsd,
    getCurrency, setCurrency, shortDate, hijriDate, monthLabel, num };
})();
